<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181f2a" />
      <stop offset="100%" stop-color="#0f141c" />
    </radialGradient>
    
    <!-- Accent Orange gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff753a" />
      <stop offset="100%" stop-color="#e84e10" />
    </linearGradient>

    <!-- ITF Cyan gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c5d8" />
      <stop offset="100%" stop-color="#009cab" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg-grad)" stroke="#2c3647" stroke-width="2" />

  <!-- Background Ambient Glow Spots -->
  <circle cx="48" cy="16" r="14" fill="#e84e10" opacity="0.22" filter="url(#ambient-glow)" />
  <circle cx="16" cy="48" r="14" fill="#009cab" opacity="0.16" filter="url(#ambient-glow)" />

  <!-- Double Code Slash Graphic (//) with Brand Gradients -->
  <!-- First Slash: TM Orange -->
  <line x1="25" y1="16" x2="15" y2="48" stroke="url(#orange-grad)" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Second Slash: ITF Cyan -->
  <line x1="39" y1="16" x2="29" y2="48" stroke="url(#cyan-grad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Presentation Slide Dots (representing deck pagination) -->
  <circle cx="49" cy="22" r="2.8" fill="#ff753a" />
  <circle cx="49" cy="32" r="2.8" fill="#009cab" opacity="0.85" />
  <circle cx="49" cy="42" r="2.8" fill="#3d495d" />
</svg>
