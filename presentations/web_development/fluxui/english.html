<header>ITF | Web Development - Flux UI</header>
<h2 id="1-what-is-flux-ui">1. What is Flux UI?</h2>
<p>Flux is an <strong>official UI component library</strong> designed specifically for Livewire and Tailwind CSS:</p>
<div class="grid-2">
<div class="card">
<h4 id="tailored-for-livewire">Tailored for Livewire</h4>
<ul>
<li>Created by Caleb Porzio (creator of Livewire and Alpine.js)</li>
<li>Components automatically understand <code>wire:model</code>, error bags, and loading states</li>
<li>Zero need for complex JavaScript bridges or heavy React/Vue wrappers</li>
</ul>
</div>
<div class="card">
<h4 id="powered-by-tailwind-css">Powered by Tailwind CSS</h4>
<ul>
<li>Leverages modern Tailwind utility classes</li>
<li>Full out-of-the-box Dark Mode support</li>
<li>100% customizable via standard Tailwind classes and theme variables</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="ITF | Web Development - Flux UI" data-footer="Web Development - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:ITF | Web Development - Flux UI;--footer:Web Development - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="18">
<header>ITF | Web Development - Flux UI</header>
<h2 id="2-installation--setup-in-laravel-13">2. Installation &amp; Setup in Laravel 13</h2>
<p>Install Flux into your Laravel application via Composer:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1. Install the Flux package</span>
composer require livewire/flux

<span class="hljs-comment"># 2. Publish assets and configuration (optional for customizing)</span>
php artisan flux:publish
</code></pre>
<p>Add Flux directives into your root application layout (<code>resources/views/layouts/app.blade.php</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;en&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;utf-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>ITF Web Development<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
    @vite([&#x27;resources/css/app.css&#x27;, &#x27;resources/js/app.js&#x27;])
    @fluxAppearance
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;min-h-screen bg-white dark:bg-slate-900 text-slate-900 dark:text-white&quot;</span>&gt;</span>
    {{ $slot }}

    @fluxScripts
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<footer>Web Development - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="ITF | Web Development - Flux UI" data-footer="Web Development - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:ITF | Web Development - Flux UI;--footer:Web Development - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="18">
<header>ITF | Web Development - Flux UI</header>
<h2 id="4-why-flux-advantages-over-handcrafted-tailwind">4. Why Flux? Advantages over Handcrafted Tailwind</h2>
<p>Why do we use Flux instead of manually crafting every HTML element with Tailwind classes?</p>
<div class="grid-2">
<div class="card">
<h4 id="1-built-in-accessibility-a11y">1. Built-in Accessibility (A11y)</h4>
<ul>
<li>Correct ARIA attributes (<code>aria-invalid</code>, <code>aria-describedby</code>, <code>aria-expanded</code>)</li>
<li>Automated connection between <code>&lt;label for=&quot;...&quot;&gt;</code> and <code>&lt;input id=&quot;...&quot;&gt;</code></li>
<li>Comprehensive keyboard navigation (Tab, Escape, Arrows) and modal focus trapping</li>
</ul>
</div>
<div class="card">
<h4 id="2-automatic-livewire-validation">2. Automatic Livewire Validation</h4>
<ul>
<li>Renders validation errors <strong>without manual <code>@error</code> blocks</strong></li>
<li>Automatically highlights input borders in red on failure</li>
<li>Clears error states as soon as the user corrects their input</li>
</ul>
</div>
</div>
<div class="grid-2" style="margin-top: 16px;">
<div class="card">
<h4 id="3-massive-productivity-boost">3. Massive Productivity Boost</h4>
<ul>
<li>80-90% fewer lines of Blade code across views</li>
<li>Eliminates repetitive copy-pasting of complex form structures</li>
</ul>
</div>
<div class="card">
<h4 id="4-consistent-design-system">4. Consistent Design System</h4>
<ul>
<li>Unified focus rings, typography, and dark mode throughout the entire app</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="ITF | Web Development - Flux UI" data-footer="Web Development - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:ITF | Web Development - Flux UI;--footer:Web Development - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="18">
<header>ITF | Web Development - Flux UI</header>
<h2 id="5-code-comparison-manual-tailwind-form-field">5. Code Comparison: Manual Tailwind Form Field</h2>
<p>Look at the overwhelming boilerplate required for <strong>a single form field</strong> with validation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- Manual Tailwind &amp; Blade Form Input: 18 lines of boilerplate! --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex justify-between items-center mb-1&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;block text-sm font-medium text-slate-200&quot;</span>&gt;</span>
            Email Address <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-red-500&quot;</span>&gt;</span>*<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xs text-slate-400&quot;</span>&gt;</span>Required<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
    
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;relative rounded-md shadow-sm&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">input</span> 
            <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span> 
            <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;email&quot;</span> 
            <span class="hljs-attr">wire:model.blur</span>=<span class="hljs-string">&quot;email&quot;</span> 
            <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;student@thomasmore.be&quot;</span>
            <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;block w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 @error(&#x27;email&#x27;) border-red-500 text-red-400 focus:border-red-500 @enderror&quot;</span>
            <span class="hljs-attr">aria-invalid</span>=<span class="hljs-string">&quot;@error(&#x27;email&#x27;) true @else false @enderror&quot;</span>
        &gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mt-1 text-xs text-slate-400&quot;</span>&gt;</span>Use your Thomas More student account.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

    @error(&#x27;email&#x27;)
        <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mt-1 text-xs text-red-500 font-medium&quot;</span>&gt;</span>{{ $message }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    @enderror
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<footer>Web Development - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="ITF | Web Development - Flux UI" data-footer="Web Development - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:ITF | Web Development - Flux UI;--footer:Web Development - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="18">
<header>ITF | Web Development - Flux UI</header>
<h2 id="5-code-comparison-the-same-feature-in-flux-ui">5. Code Comparison: The Same Feature in Flux UI</h2>
<p>The exact same input with label, description, badge, icon, and automated validation in Flux:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- Flux UI Component: Exactly 1 clean, readable line of code! --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">flux:input</span> 
    <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span>
    <span class="hljs-attr">label</span>=<span class="hljs-string">&quot;Email Address&quot;</span> 
    <span class="hljs-attr">badge</span>=<span class="hljs-string">&quot;Required&quot;</span>

<header>ITF | Web Development - Flux UI</header>
<h2 id="7-buttons--actions-fluxbutton">7. Buttons &amp; Actions (<code>flux:button</code>)</h2>
<p>Flux buttons feature built-in visual variants, sizing, and Livewire loading indicators:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex flex-wrap gap-3 items-center&quot;</span>&gt;</span>
    <span class="hljs-comment">&lt;!-- Primary Action --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;primary&quot;</span> <span class="hljs-attr">wire:click</span>=<span class="hljs-string">&quot;save&quot;</span>&gt;</span>Save<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>

    <span class="hljs-comment">&lt;!-- Subtle / Outline Variants --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;filled&quot;</span>&gt;</span>Filled Button<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;outline&quot;</span>&gt;</span>Outline Button<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;ghost&quot;</span>&gt;</span>Ghost Button<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>

    <span class="hljs-comment">&lt;!-- Destructive Action (Red) --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;danger&quot;</span> <span class="hljs-attr">wire:click</span>=<span class="hljs-string">&quot;delete&quot;</span>&gt;</span>Delete<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>

    <span class="hljs-comment">&lt;!-- Buttons with Icons and Sizes --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">icon</span>=<span class="hljs-string">&quot;plus&quot;</span> <span class="hljs-attr">size</span>=<span class="hljs-string">&quot;sm&quot;</span> <span class="hljs-attr">variant</span>=<span class="hljs-string">&quot;primary&quot;</span>&gt;</span>Add Item<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">icon-trailing</span>=<span class="hljs-string">&quot;arrow-right&quot;</span>&gt;</span>Next Step<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<blockquote>
<p><strong>Automatic Loading State:</strong> When binding <code>wire:click=&quot;save&quot;</code>, <code>&lt;flux:button&gt;</code> automatically displays a loading spinner and disables user clicks during server execution!</p>
</blockquote>

    <span class="hljs-tag">&lt;<span class="hljs-name">flux:input</span> <span class="hljs-attr">label</span>=<span class="hljs-string">&quot;Full Name&quot;</span> <span class="hljs-attr">wire:model</span>=<span class="hljs-string">&quot;name&quot;</span> /&gt;</span>

<h2 id="10-customization--theming">10. Customization &amp; Theming</h2>
<p>Flux is built to integrate seamlessly with your project design tokens:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-direct-tailwind-overrides">1. Direct Tailwind Overrides</h4>
<p>Append custom Tailwind classes to any Flux component via standard <code>class</code> attributes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">flux:input</span> 
    <span class="hljs-attr">label</span>=<span class="hljs-string">&quot;Search&quot;</span> 
    <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-slate-950 border-orange-500/50&quot;</span> 
/&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> 
    <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-full shadow-lg hover:shadow-orange-500/20&quot;</span>
&gt;</span>
    Submit
<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>
</code></pre>
</div>
<div class="card">
<h4 id="2-configuring-accent-colors">2. Configuring Accent Colors</h4>
<p>Set custom accent colors per component or globally in your layout:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- Accent color per component --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">flux:button</span> <span class="hljs-attr">accent</span>=<span class="hljs-string">&quot;orange&quot;</span>&gt;</span>
    Thomas More Orange
<span class="hljs-tag">&lt;/<span class="hljs-name">flux:button</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Variant and size settings --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">flux:badge</span> <span class="hljs-attr">color</span>=<span class="hljs-string">&quot;orange&quot;</span> <span class="hljs-attr">size</span>=<span class="hljs-string">&quot;lg&quot;</span>&gt;</span>

<span class="hljs-tag">&lt;/<span class="hljs-name">flux:badge</span>&gt;</span>
</code></pre>

<h2 id="10-advanced-composable-subcomponents--slots">10. Advanced: Composable Subcomponents &amp; Slots</h2>
<p>When you need bespoke layouts, break down fields into discrete child components:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">flux:field</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex justify-between items-center&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">flux:label</span>&gt;</span>Student Number<span class="hljs-tag">&lt;/<span class="hljs-name">flux:label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xs text-orange-400 font-mono&quot;</span>&gt;</span>r0123456<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">flux:input</span> <span class="hljs-attr">icon</span>=<span class="hljs-string">&quot;identification&quot;</span> <span class="hljs-attr">wire:model</span>=<span class="hljs-string">&quot;studentNumber&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;r-number&quot;</span> /&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">flux:description</span>&gt;</span>Enter the r-number displayed on your student ID card.<span class="hljs-tag">&lt;/<span class="hljs-name">flux:description</span>&gt;</span>

    <span class="hljs-comment">&lt;!-- Custom error rendering if needed --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">flux:error</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;studentNumber&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">flux:field</span>&gt;</span>
</code></pre>
<blockquote>
<p><strong>Flexibility:</strong> Using <code>&lt;flux:field&gt;</code> preserves automated ARIA binding while granting 100% control over the HTML layout.</p>
</blockquote>

<h1 id="mastering-flux-ui">Mastering Flux UI</h1>
<p class="subtitle">&lt;Write Less Blade, Build Better Interfaces /&gt;</p>
<h3 id="key-takeaways-for-students">Key Takeaways for Students</h3>
<ol>
<li><strong>Eliminate Boilerplate:</strong> Leverage <code>&lt;flux:input&gt;</code>, <code>&lt;flux:select&gt;</code>, and <code>&lt;flux:button&gt;</code> for clean views</li>
<li><strong>Automated Validation:</strong> Stop writing repetitive <code>@error</code> blocks and custom red border classes</li>
<li><strong>Accessibility First:</strong> Enjoy built-in ARIA labeling and modal keyboard navigation</li>
<li><strong>Built-in Loading Feedback:</strong> Buttons automatically handle loading spinners on <code>wire:click</code></li>
<li><strong>The Ultimate Laravel 13 Stack:</strong> <strong>Tailwind CSS v4</strong> + <strong>Livewire v4</strong> + <strong>Flux UI</strong>!</li>
</ol>
<div class="meta-box" style="margin-top: 24px;">
  <strong>Documentation:</strong> Visit <a href="https://fluxui.dev/docs">fluxui.dev/docs</a> to explore all components!
</div>
<footer>Web Development - Thomas More University of Applied Sciences</footer>
