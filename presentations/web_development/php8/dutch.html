<header>ITF | Web Development - PHP 8</header>
<h2 id="1-introductie-tot-php-wat-is-php">1. Introductie tot PHP: Wat is PHP?</h2>
<p>PHP is een populaire <strong>server-side scriptingtaal</strong>, specifiek ontworpen voor webontwikkeling:</p>
<div class="grid-2">
<div class="card">
<h4 id="belangrijkste-eigenschappen">Belangrijkste Eigenschappen</h4>
<ul>
<li><strong>Server-side:</strong> PHP code draait op de webserver, in tegenstelling tot client-side JavaScript in de browser</li>
<li><strong>Platformonafhankelijk:</strong> Draait vlekkeloos op Linux, Windows en macOS</li>
<li><strong>Serverondersteuning:</strong> Werkt naadloos met Nginx, Apache en IIS</li>
<li><strong>Open-source &amp; gratis:</strong> Vrij te gebruiken en breed ondersteund door hostingproviders</li>
<li><strong>C-style syntaxis:</strong> Grote gelijkenissen met Java, C# en JavaScript</li>
</ul>
</div>
<div class="card">
<h4 id="ecosystem--toepassingen">Ecosystem &amp; Toepassingen</h4>
<ul>
<li><strong>Bekende platformen:</strong> WordPress, Drupal, Magento, Moodle en Wikipedia</li>
<li><strong>Moderne frameworks:</strong> Symfony en <strong>Laravel</strong></li>
<li><strong>Oorsprong:</strong> Gemaakt door Rasmus Lerdorf in 1994 (oorspronkelijk &quot;Personal Home Page&quot;)</li>
<li><strong>Huidige betekenis:</strong> Recursief acroniem voor <em>PHP: Hypertext Preprocessor</em></li>
<li><strong>Versie in deze cursus:</strong> <strong>PHP 8.5.x</strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>

<header>ITF | Web Development - PHP 8</header>
<h2 id="1-hoe-werkt-php-client-vs-server-flow">1. Hoe werkt PHP? Client vs. Server Flow</h2>
<p>De client (browser) ontvangt enkel het eindresultaat in platte HTML:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Browser Client]  --&gt; 1. HTTP Request (hello_world.php) ---&gt;  [Webserver: Nginx/Apache]
                                                                        |
                                                                2. Voert PHP engine uit
                                                                3. Database queries (optioneel)
                                                                4. Genereert plain HTML
                                                                        |
[Browser Client]  &lt;-- 5. HTTP Response (Plain HTML output) &lt;-- [Webserver: Nginx/Apache]
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="origineel-php-bestand-op-de-server">Origineel PHP Bestand op de Server</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;!doctype html&gt;
&lt;html lang=<span class="hljs-string">&quot;nl&quot;</span>&gt;
&lt;body&gt;
  &lt;h1&gt;<span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;Hello world&#x27;</span>; <span class="hljs-meta">?&gt;</span>&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;
</code></pre>
</div>
<div class="card">
<h4 id="html-resultaat-in-de-browser">HTML Resultaat in de Browser</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!doctype <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;nl&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hello world<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</div>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="1-php-8-highlights-moderne-taalfuncties">1. PHP 8 Highlights: Moderne Taalfuncties</h2>
<p>PHP heeft de voorbije jaren een enorme metamorfose ondergaan naar een moderne, strikt getypeerde taal:</p>
<div class="grid-2">
<div class="card">
<h4 id="moderne-expressiviteit">Moderne Expressiviteit</h4>
<ul>
<li><strong>Named arguments:</strong> Argumenten doorgeven op naam in plaats van louter op positie</li>
<li><strong>Match expressions:</strong> Een schoner, expressief en strikt alternatief voor <code>switch</code></li>
<li><strong>Nullsafe operator (<code>?-&gt;</code>):</strong> Veilig methoden aanroepen op objecten die mogelijk <code>null</code> zijn</li>
<li><strong>Short arrow functions (<code>fn</code>):</strong> Compacte closures voor functionele operaties</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="type-safety--architectuur">Type Safety &amp; Architectuur</h4>
<ul>
<li><strong>Union types (<code>int|string</code>):</strong> Waarden kunnen meerdere types aannemen</li>
<li><strong>Nullable types (<code>?string</code>):</strong> Expliciete ondersteuning voor afwezigheid van waarden</li>
<li><strong>Readonly properties:</strong> Eigenschappen die na initialisatie onveranderlijk zijn</li>
<li><strong>Enums:</strong> Type-veilige opsommingen van vaste waarden</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="1-waarom-php-voorbereiding-op-laravel-span-classbadgecruciaalspan">1. Waarom PHP? Voorbereiding op Laravel <span class="badge">Cruciaal</span></h2>
<p>Deze inleiding in PHP 8 is geen alleenstaand onderwerp, maar de <strong>onmisbare fundering</strong> voor het vervolg van dit vak:</p>
<div class="card card-cyan">
<h4 id="de-directe-link-naar-laravel">De directe link naar Laravel</h4>
<p>Over enkele weken starten we met de ontwikkeling van een volwaardige <strong>Laravel 13 webapplicatie</strong>.<br />
Laravel is geschreven in modern PHP. Een diepgaand begrip van de PHP 8 basisconcepten zorgt ervoor dat je begrijpt wat het framework onder de motorkap doet.</p>
</div>
<div class="grid-2">
<div class="card">
<h4 id="wat-je-direct-herkent-in-laravel">Wat je direct herkent in Laravel</h4>
<ul>
<li><strong>Routing &amp; Controllers:</strong> PHP klassen, methods en type hints</li>
<li><strong>Blade templates:</strong> Ternary operatoren en loops (<code>@foreach</code>)</li>
<li><strong>Eloquent Models:</strong> Associatieve arrays, object casting en nullables</li>
<li><strong>Helpers:</strong> Statische helper methods en method chaining</li>
</ul>
</div>
<div class="card">
<h4 id="voorsprong-voor-studenten">Voorsprong voor studenten</h4>
<ul>
<li>Je kent de syntax al vanuit Java, JavaScript en Python</li>
<li>We focussen specifiek op de <strong>PHP-eigen constructies</strong>: het dollarteken <code>$</code>, array-mechanismen, strikte vergelijkingen en de null coalescing operator (<code>??</code>)</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>

<header>ITF | Web Development - PHP 8</header>

<header>ITF | Web Development - PHP 8</header>
<h2 id="2-ontwikkelomgeving-laravel-herd">2. Ontwikkelomgeving: Laravel Herd</h2>
<p>In plaats van zware traditionele stacks (WAMP, XAMPP, MAMP) gebruiken we <strong>Laravel Herd</strong>:</p>
<div class="grid-2">
<div class="card card-accent">
<h4 id="waarom-laravel-herd">Waarom Laravel Herd?</h4>

<li><strong>Zero-configuration:</strong> Geen gedoe met vhosts of handmatige Apache configuraties</li>
<li><strong>Volledige stack:</strong> Bevat Nginx, Node.js en meerdere PHP-versies (PHP 8.5)</li>

</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-basis-syntaxis-php-code-blocks">3. Basis Syntaxis: PHP Code Blocks</h2>
<p>PHP code kan naadloos worden geïntegreerd binnen HTML documenten via script tags:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;!doctype html&gt;
&lt;html lang=<span class="hljs-string">&quot;nl&quot;</span>&gt;
&lt;head&gt;
  <span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">include_once</span>(<span class="hljs-string">&#x27;../shared/meta.php&#x27;</span>); <span class="hljs-meta">?&gt;</span>
  &lt;title&gt;Hello world&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello world&lt;/h1&gt;
  &lt;p&gt;<span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;Hello world&#x27;</span>; <span class="hljs-meta">?&gt;</span>&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="regels-voor-script-blocks">Regels voor Script Blocks</h4>
<ul>
<li>Start altijd met <code>&lt;?php</code> en sluit af met <code>?&gt;</code></li>
<li>Elk afzonderlijk statement eindigt verplicht met een puntkomma <code>;</code></li>
<li><code>echo</code> is het basiscommando om tekst of HTML output te genereren</li>
</ul>
</div>
<div class="card">
<h4 id="shorthand-varianten">Shorthand Varianten</h4>
<ul>
<li><strong>Shorthand echo:</strong> <code>&lt;?= 'Hello world' ?&gt;</code> is exact gelijk aan <code>&lt;?php echo 'Hello world'; ?&gt;</code></li>
<li><strong>Pure PHP bestanden:</strong> Bevat een bestand enkel PHP code (geen HTML), dan <strong>mag de closing tag <code>?&gt;</code> worden weggelaten</strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-basis-syntaxis-comments--ide-sneltoetsen">3. Basis Syntaxis: Comments &amp; IDE Sneltoetsen</h2>
<p>Goed gedocumenteerde code verhoogt de leesbaarheid en overdraagbaarheid:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-comment">// Dit is een inline commentaarregel</span>

<span class="hljs-comment">/*
 * Dit commentaarblok
 * strekt zich uit over meerdere regels
 */</span>

<span class="hljs-variable">$score</span> = <span class="hljs-number">15</span>; <span class="hljs-comment">// Commentaar achter een statement</span>
</code></pre>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="phpstorm-sneltoetsen">PhpStorm Sneltoetsen</h4>
<ul>
<li><strong>Single-line comment:</strong> <code>Ctrl + /</code> (toggle op geselecteerde regels)</li>
<li><strong>Multi-line comment:</strong> <code>Ctrl + Shift + /</code> (omringt selectie met <code>/* ... */</code>)</li>
<li><strong>Code formatteren:</strong> <code>Ctrl + Alt + L</code></li>
</ul>
</div>
<div class="card">
<h4 id="best-practice">Best Practice</h4>
<p>Schrijf commentaar om het <strong>waarom</strong> achter complexe business logica uit te leggen, niet het overduidelijke &quot;hoe&quot; van standaard syntaxis.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-variabelen--naming-conventions">3. Variabelen &amp; Naming Conventions</h2>
<p>In vergelijking met Java, JavaScript en Python valt direct het dollarteken op:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage1</span> = <span class="hljs-number">73.08</span>;
<span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$hasGraduated</span> = <span class="hljs-literal">true</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="strikte-naamgevingsregels">Strikte Naamgevingsregels</h4>
<ul>
<li>Begint <strong>altijd met een dollarteken (<code>$</code>)</strong></li>
<li>Gevolgd door een letter of underscore <code>_</code> (nooit een cijfer als startteken)</li>
<li>Bevat enkel alfanumerieke tekens en underscores (geen spaties of koppeltekens)</li>
<li><strong>Hoofdlettergevoelig:</strong> <code>$student</code> en <code>$Student</code> zijn twee totaal verschillende variabelen</li>
</ul>
</div>
<div class="card">
<h4 id="conventies-in-php--laravel">Conventies in PHP &amp; Laravel</h4>
<ul>
<li>Gebruik <strong>camelCase</strong> (<code>$firstName</code>) of <strong>snake_case</strong> (<code>$first_name</code>) voor variabelen</li>
<li>Gebruik <strong>PascalCase</strong> (<code>StudentController</code>) voor klassennamen</li>
<li>Variabelen hoeven niet vooraf gedeclareerd te worden met <code>let</code>, <code>var</code> of een type (zoals in Java of JS)</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-datatypes-in-php-8">3. Datatypes in PHP 8</h2>
<p>PHP is een dynamisch getypeerde taal: het type van een variabele wordt bepaald op basis van de toegekende waarde:</p>
<div class="grid-2">
<div class="card">
<h4 id="primitieve-datatypes">Primitieve Datatypes</h4>
<ul>
<li><strong>Integer:</strong> Hele getallen (<code>42</code>, <code>-10</code>, <code>0</code>)</li>
<li><strong>Float:</strong> Decimale getallen (<code>3.14</code>, <code>12.7</code>, wetenschappelijk <code>34e-2</code>)</li>
<li><strong>String:</strong> Tekstreeksen (<code>'John Doe'</code>, <code>&quot;Web Development&quot;</code>)</li>
<li><strong>Boolean:</strong> Logische waarden (<code>true</code> of <code>false</code>)</li>
<li><strong>NULL:</strong> Variabele zonder toegekende waarde (<code>null</code>)</li>
</ul>
</div>
<div class="card">
<h4 id="samengestelde--speciale-types">Samengestelde &amp; Speciale Types</h4>
<ul>
<li><strong>Array:</strong> Geordende mappen van waarden of sleutel-waarde paren</li>
<li><strong>Object:</strong> Instantie van een gedefinieerde klasse</li>
<li>PHP zet types automatisch om waar nodig (type juggling), maar biedt via PHP 8 sterke mogelijkheden voor strikte typering</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-type-juggling-vs-strikte-typering-span-classbadgephp-8-best-practicespan">3. Type Juggling vs. Strikte Typering <span class="badge">PHP 8 Best Practice</span></h2>
<p>Standaard probeert PHP types automatisch om te zetten naar het verwachte type (<strong>type juggling</strong>). Met <code>declare(strict_types=1);</code> dwing je strikte types af:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-zonder-strikte-typering-standaard">1. Zonder strikte typering (Standaard)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">sum</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$a</span>, <span class="hljs-keyword">int</span> <span class="hljs-variable">$b</span></span>): <span class="hljs-title">int</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$a</span> + <span class="hljs-variable">$b</span>;
}

<span class="hljs-comment">// String &#x27;10&#x27; wordt stil omgezet naar int 10</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">sum</span>(<span class="hljs-number">5</span>, <span class="hljs-string">&#x27;10&#x27;</span>); <span class="hljs-comment">// Output: 15</span>
</code></pre>
<ul>
<li><strong>Voordeel:</strong> Flexibel; handig omdat HTML formulier-inputs altijd strings zijn</li>
<li><strong>Nadeel:</strong> Verbergt typefouten en leidt tot onvoorspelbaar gedrag bij foutieve data</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="2-met-strikte-typering-strict_types1">2. Met strikte typering (<code>strict_types=1</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">declare</span>(strict_types=<span class="hljs-number">1</span>);

<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">sum</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$a</span>, <span class="hljs-keyword">int</span> <span class="hljs-variable">$b</span></span>): <span class="hljs-title">int</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$a</span> + <span class="hljs-variable">$b</span>;
}

<span class="hljs-comment">// String &#x27;10&#x27; gooit direct een TypeError!</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">sum</span>(<span class="hljs-number">5</span>, <span class="hljs-string">&#x27;10&#x27;</span>); <span class="hljs-comment">// Fatal error: TypeError</span>
</code></pre>
<ul>
<li><strong>Voordeel:</strong> Voorkomt subtiele bugs; fouten worden direct opgemerkt tijdens ontwikkeling</li>
<li><strong>Nadeel:</strong> Minder vergevingsgezind; invoer uit formulieren vereist expliciete casting</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-strings-concatenatie-vs-interpolatie">3. Strings: Concatenatie vs. Interpolatie</h2>
<p>PHP biedt twee verschillende manieren om variabelen samen te voegen in tekst:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-concatenatie-met-punt">1. Concatenatie met punt (<code>.</code>)</h4>
<ul>
<li>Werkt met zowel enkele als dubbele quotes</li>
<li>Variabelen worden handmatig samengevoegd</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage</span> = <span class="hljs-number">73.08</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;&#x27;</span> . <span class="hljs-variable">$student1</span> . <span class="hljs-string">&#x27; behaalt &#x27;</span> . 
     <span class="hljs-variable">$percentage</span> . <span class="hljs-string">&#x27; %&lt;/p&gt;&#x27;</span> . <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>
<p><em>Voeg altijd spaties rond het puntteken toe voor optimale leesbaarheid.</em></p>
</div>
<div class="card">
<h4 id="2-interpolatie-met-dubbele-quotes">2. Interpolatie met dubbele quotes</h4>
<ul>
<li>Variabelen binnen <code>&quot;...&quot;</code> worden automatisch vervangen door hun actuele waarde</li>
<li>Geen breekpunten met punten nodig</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$percentage</span> = <span class="hljs-number">64.84</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;<span class="hljs-subst">$student2</span> behaalt <span class="hljs-subst">$percentage</span> %&lt;/p&gt;\n&quot;</span>;
</code></pre>
<p><em>Let op: string interpolatie werkt uitsluitend bij dubbele quotes, nooit bij enkele quotes.</em></p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-multi-line-strings-met-heredoc-notatie">3. Multi-line Strings met Heredoc Notatie</h2>
<p>Voor grotere blokken HTML output is de <strong>Heredoc</strong> syntax ideaal:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage1</span> = <span class="hljs-number">73.08</span>;
<span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$percentage2</span> = <span class="hljs-number">64.84</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&lt;&lt;&lt;HTML
&lt;article class=&quot;p-4 bg-slate-800 rounded&quot;&gt;
  &lt;h3&gt;Resultaten ITF&lt;/h3&gt;
  &lt;p&gt;<span class="hljs-subst">$student1</span> behaalt <span class="hljs-subst">$percentage1</span> %&lt;/p&gt;
  &lt;p&gt;<span class="hljs-subst">$student2</span> behaalt <span class="hljs-subst">$percentage2</span> %&lt;/p&gt;
&lt;/article&gt;
HTML</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="voordelen-van-heredoc">Voordelen van Heredoc</h4>
<ul>
<li>Geen omslachtige quotes of escaping nodig</li>
<li>Regeleindes (<code>\n</code>) en inspringing blijven behouden</li>
<li>Automatische variabele-interpolatie</li>
<li>Ideaal in combinatie met Emmet afkortingen in PhpStorm</li>
</ul>
</div>
<div class="card">
<h4 id="syntaxis-regels">Syntaxis Regels</h4>
<ul>
<li>Start met <code>&lt;&lt;&lt;</code> gevolgd door een identifier (bijv. <code>HTML</code> of <code>RESULTS</code>)</li>
<li>De inhoud start op de volgende regel</li>
<li>De sluit-identifier staat op een eigen regel, direct gevolgd door <code>;</code></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-rekenkundige-operatoren">4. Rekenkundige Operatoren</h2>
<p>PHP ondersteunt alle klassieke rekenkundige berekeningen:</p>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Omschrijving</th>
<th>Voorbeeld</th>
<th>Resultaat ($x = 10, $y = 3)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>+</code></td>
<td>Optelling</td>
<td><code>$x + $y</code></td>
<td><code>13</code></td>
</tr>
<tr>
<td><code>-</code></td>
<td>Aftrekking</td>
<td><code>$x - $y</code></td>
<td><code>7</code></td>
</tr>
<tr>
<td><code>*</code></td>
<td>Vermenigvuldiging</td>
<td><code>$x * $y</code></td>
<td><code>30</code></td>
</tr>
<tr>
<td><code>/</code></td>
<td>Deling</td>
<td><code>$x / $y</code></td>
<td><code>3.3333333333333</code></td>
</tr>
<tr>
<td><code>%</code></td>
<td>Modulo (restwaarde)</td>
<td><code>$x % $y</code></td>
<td><code>1</code></td>
</tr>
<tr>
<td><code>**</code></td>
<td>Machtsverheffing (PHP 5.6+)</td>
<td><code>$x ** $y</code></td>
<td><code>1000</code> (10³)</td>
</tr>
</tbody>
</table>
<div class="card card-accent">
<h4 id="escapen-van-het-dollarteken-in-strings">Escapen van het dollarteken in strings</h4>
<p>Wil je de naam van een variabele letterlijk tonen in een dubbel gequote string in plaats van de waarde?<br />
Plaats een backslash voor het dollarteken:<br />
<code>echo &quot;&lt;p&gt;\$x + \$y = &quot; . ($x + $y) . &quot;&lt;/p&gt;&quot;;</code> produceert: <code>$x + $y = 13</code>.<br />
Gebruik altijd <strong>ronde haakjes</strong> rond rekenkundige expressies bij string concatenatie.</p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-toewijzingsoperatoren--increment">4. Toewijzingsoperatoren &amp; Increment</h2>
<p>Toewijzingsoperatoren combineren een bewerking met een directe toewijzing aan de variabele:</p>
<div class="grid-2">
<div class="card">
<h4 id="samengestelde-toewijzingen">Samengestelde Toewijzingen</h4>
<ul>
<li><code>$x += $y</code> is identiek aan <code>$x = $x + $y</code></li>
<li><code>$x -= $y</code> is identiek aan <code>$x = $x - $y</code></li>
<li><code>$x *= $y</code> is identiek aan <code>$x = $x * $y</code></li>
<li><code>$x /= $y</code> is identiek aan <code>$x = $x / $y</code></li>
<li><code>$x %= $y</code> is identiek aan <code>$x = $x % $y</code></li>
<li><code>$name .= $surname</code> voegt strings samen:<br />
<code>$name = $name . $surname</code></li>
</ul>
</div>
<div class="card">
<h4 id="increment--decrement">Increment &amp; Decrement</h4>
<ul>
<li><code>$x++</code>: Verhoogt de waarde van <code>$x</code> met 1</li>
<li><code>$x--</code>: Verlaagt de waarde van <code>$x</code> met 1</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$score</span> = <span class="hljs-number">10</span>;
<span class="hljs-variable">$score</span> += <span class="hljs-number">5</span>;   <span class="hljs-comment">// $score is nu 15</span>
<span class="hljs-variable">$score</span>++;      <span class="hljs-comment">// $score is nu 16</span>

<span class="hljs-variable">$title</span> = <span class="hljs-string">&#x27;Web &#x27;</span>;
<span class="hljs-variable">$title</span> .= <span class="hljs-string">&#x27;Dev&#x27;</span>; <span class="hljs-comment">// $title is nu &#x27;Web Dev&#x27;</span>
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-vergelijkingsoperatoren-loose-vs-strict-equality">4. Vergelijkingsoperatoren: Loose vs. Strict Equality</h2>
<p>In PHP is het onderscheid tussen losse en strikte gelijkheid van cruciaal belang:</p>
<div class="grid-2">
<div class="card">
<h4 id="losse-gelijkheid--en">Losse Gelijkheid (<code>==</code> en <code>!=</code>)</h4>
<ul>
<li>Converteert types automatisch voor de vergelijking (type coercion)</li>
<li>Kan leiden tot subtiele bugs</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$x</span> = <span class="hljs-number">10</span>;     <span class="hljs-comment">// integer</span>
<span class="hljs-variable">$y</span> = <span class="hljs-string">&#x27;10&#x27;</span>;   <span class="hljs-comment">// string</span>

<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$x</span> == <span class="hljs-variable">$y</span>); <span class="hljs-comment">// true!</span>
</code></pre>
</div>
<div class="card card-accent">
<h4 id="strikte-identiteit--en">Strikte Identiteit (<code>===</code> en <code>!==</code>)</h4>
<ul>
<li>Vergelijkt zowel de <strong>waarde</strong> als het <strong>datatype</strong></li>
<li><strong>Gouden standaard</strong> in modern PHP en Laravel</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$x</span> = <span class="hljs-number">10</span>;     <span class="hljs-comment">// integer</span>
<span class="hljs-variable">$y</span> = <span class="hljs-string">&#x27;10&#x27;</span>;   <span class="hljs-comment">// string</span>

<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$x</span> === <span class="hljs-variable">$y</span>); <span class="hljs-comment">// false (int !== string)</span>
</code></pre>
</div>
</div>
<h4 id="overige-vergelijkingen">Overige Vergelijkingen</h4>
<ul>
<li><code>$x &lt; $y</code> (kleiner dan), <code>$x &lt;= $y</code> (kleiner of gelijk)</li>
<li><code>$x &gt; $y</code> (groter dan), <code>$x &gt;= $y</code> (groter of gelijk)</li>
<li><code>&lt;&gt;</code> is een ouder synoniem voor <code>!=</code></li>
</ul>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-booleans--logische-operatoren">4. Booleans &amp; Logische Operatoren</h2>
<p>Hoe toont PHP booleans, en welke logische operatoren gebruiken we?</p>
<div class="grid-2">
<div class="card">
<h4 id="weergave-van-booleans">Weergave van Booleans</h4>
<p>Wanneer PHP een boolean omzet naar tekst:</p>
<ul>
<li><code>true</code> wordt weergegeven als <strong><code>1</code></strong></li>
<li><code>false</code> wordt weergegeven als <strong><code>&quot;&quot;</code> (lege string)</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-literal">true</span>;  <span class="hljs-comment">// Geeft: 1</span>
<span class="hljs-keyword">echo</span> <span class="hljs-literal">false</span>; <span class="hljs-comment">// Geeft: (helemaal niets!)</span>
</code></pre>
<p><em>Gebruik <code>var_dump()</code> tijdens het debuggen om echte booleans te zien.</em></p>
</div>
<div class="card">
<h4 id="logische-operatoren--precedence">Logische Operatoren &amp; Precedence</h4>
<ul>
<li><code>&amp;&amp;</code> (EN) en <code>||</code> (OF)</li>
<li><code>!</code> (NIET / negatie)</li>
<li><code>xor</code>: waar als precies een van beide waar is</li>
</ul>
<blockquote>
<p><strong>Belangrijk:</strong> PHP ondersteunt ook <code>and</code> en <code>or</code>, maar deze hebben een lagere operator prioriteit. Gebruik in conditionele expressies <strong>altijd <code>&amp;&amp;</code> en <code>||</code></strong> om onverwachte voorrangsfouten te voorkomen.</p>
</blockquote>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-controlestructuren-selectie-if-else-elseif">5. Controlestructuren: Selectie (<code>if</code>, <code>else</code>, <code>elseif</code>)</h2>
<p>Conditionele statements sturen de programmastroom op basis van logische expressies:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$scorePHP</span> = <span class="hljs-number">9</span>;

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;Proficiat, je bent geslaagd voor PHP!&lt;/p&gt;&#x27;</span>;
} <span class="hljs-keyword">elseif</span> (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">8</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;Je bent niet geslaagd, maar de score is tolereerbaar.&lt;/p&gt;&#x27;</span>;
} <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;Helaas niet geslaagd. Volgende keer beter!&lt;/p&gt;&#x27;</span>;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="syntaxis-details">Syntaxis Details</h4>
<ul>
<li>De conditie staat altijd tussen ronde haakjes <code>(...)</code></li>
<li>Het codeblok staat tussen accolades <code>{ ... }</code></li>
<li><code>elseif</code> wordt in PHP bij voorkeur als een aaneengeschreven woord gebruikt</li>
</ul>
</div>
<div class="card">
<h4 id="bekend-uit-java--javascript">Bekend uit Java / JavaScript</h4>
<p>De structuur werkt identiek aan Java, JavaScript en C#. Het grote voordeel in PHP is de directe combinatie met HTML output.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-de-ternary-operator-span-classbadgeveelvuldig-in-laravel-bladespan">5. De Ternary Operator <span class="badge">Veelvuldig in Laravel Blade</span></h2>
<p>De ternary operator is een krachtige shorthand voor eenvoudige <code>if-else</code> constructies:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Syntaxis: conditie ? expressieAlsWaar : expressieAlsOnwaar</span>
<span class="hljs-variable">$message</span> = <span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span> ? <span class="hljs-string">&#x27;Geslaagd&#x27;</span> : <span class="hljs-string">&#x27;Niet geslaagd&#x27;</span>;
</code></pre>
<div class="card card-cyan">
<h4 id="directe-integratie-in-html-weergave">Directe integratie in HTML weergave</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p class=&#x27;&quot;</span> . (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span> ? <span class="hljs-string">&#x27;text-green-500&#x27;</span> : <span class="hljs-string">&#x27;text-red-500&#x27;</span>) . <span class="hljs-string">&quot;&#x27;&gt;
        Jouw resultaat: <span class="hljs-subst">$scorePHP</span>
      &lt;/p&gt;&quot;</span>;
</code></pre>
</div>
<div class="grid-2">
<div class="card">
<h4 id="waarom-zo-belangrijk-voor-laravel">Waarom zo belangrijk voor Laravel?</h4>
<p>In <strong>Blade views</strong> ga je deze operator continu tegenkomen voor:</p>
<ul>
<li>Actieve menu-items highlighten: <code>class=&quot;{{ $active ? 'active' : '' }}&quot;</code></li>
<li>Dynamische badges en statusteksten</li>
<li>Formulier checkbox selecties</li>
</ul>
</div>
<div class="card">
<h4 id="richtlijn">Richtlijn</h4>
<p>Gebruik de ternary operator enkel voor <strong>enkelvoudige expressies</strong>. Zodra er meerdere stappen of geneste condities nodig zijn, blijft een standaard <code>if-else</code> veel leesbaarder.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-null-coalescing-operator--span-classbadgecruciaal-voor-laravelspan">5. Null Coalescing Operator (<code>??</code>) <span class="badge">Cruciaal voor Laravel</span></h2>
<p>Het controleren op het bestaan van waarden is een van de meest voorkomende taken in webapplicaties:</p>
<div class="card card-accent">
<h4 id="de-traditionele-manier-vs-de-moderne--operator">De traditionele manier vs. de moderne <code>??</code> operator</h4>
<p>Traditioneel controleerden we variabelen met <code>isset()</code> en een ternary operator:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$score</span> = <span class="hljs-keyword">isset</span>(<span class="hljs-variable">$scorePHP</span>) ? <span class="hljs-variable">$scorePHP</span> : <span class="hljs-string">&#x27;Geen score beschikbaar&#x27;</span>;
</code></pre>
<p>Met de <strong>null coalescing operator (<code>??</code>)</strong> schrijven we dit compact en elegant:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$score</span> = <span class="hljs-variable">$scorePHP</span> ?? <span class="hljs-string">&#x27;Geen score beschikbaar&#x27;</span>;
</code></pre>
<p>Als <code>$scorePHP</code> bestaat en niet <code>null</code> is, krijgt <code>$score</code> die waarde. In elk ander geval geldt de fallback.</p>
</div>
<div class="grid-2">
<div class="card">
<h4 id="waarom-cruciaal-in-laravel">Waarom cruciaal in Laravel?</h4>
<ul>
<li>Request input uitlezen: <code>$name = $request-&gt;name ?? 'Gast';</code></li>
<li>Configuratie en environment waarden met fallbacks</li>
<li>Optionele database relaties veilig renderen in Blade</li>
</ul>
</div>
<div class="card">
<h4 id="chaining-van-coalescing">Chaining van Coalescing</h4>
<p>Je kunt meerdere fallbacks achter elkaar plaatsen:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$display</span> = <span class="hljs-variable">$userNickname</span> ?? <span class="hljs-variable">$userName</span> ?? <span class="hljs-string">&#x27;Anoniem&#x27;</span>;
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-switch-vs-match-expression-php-8">5. <code>switch</code> vs. <code>match</code> Expression (PHP 8)</h2>
<p>PHP 8 introduceert <code>match</code>, een enorme stap voorwaarts ten opzichte van het traditionele <code>switch</code>:</p>
<div class="grid-2">
<div class="card">
<h4 id="oude-switch-statement">Oude <code>switch</code> statement</h4>
<ul>
<li>Vereist <code>break</code> statements om fall-through te vermijden</li>
<li>Gebruikt losse vergelijking (<code>==</code>)</li>
<li>Kent geen directe returnwaarde</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">switch</span> (<span class="hljs-variable">$role</span>) {
    <span class="hljs-keyword">case</span> <span class="hljs-string">&#x27;admin&#x27;</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Rood&#x27;</span>;
        <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">case</span> <span class="hljs-string">&#x27;editor&#x27;</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Blauw&#x27;</span>;
        <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">default</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Grijs&#x27;</span>;
}
</code></pre>
</div>
<div class="card card-accent">
<h4 id="moderne-php-8-match-expression">Moderne PHP 8 <code>match</code> expression</h4>
<ul>
<li>Evalueert direct naar een waarde (toewijsbaar)</li>
<li>Gebruikt <strong>strikte identiteit (<code>===</code>)</strong></li>
<li>Geen <code>break</code> nodig, veel kortere syntax</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$badge</span> = <span class="hljs-keyword">match</span> (<span class="hljs-variable">$role</span>) {
    <span class="hljs-string">&#x27;admin&#x27;</span>  =&gt; <span class="hljs-string">&#x27;Rood&#x27;</span>,
    <span class="hljs-string">&#x27;editor&#x27;</span> =&gt; <span class="hljs-string">&#x27;Blauw&#x27;</span>,
    <span class="hljs-keyword">default</span>  =&gt; <span class="hljs-string">&#x27;Grijs&#x27;</span>,
};
</code></pre>
<p><em>Gooit een <code>UnhandledMatchError</code> als er geen match is en geen <code>default</code> voorzien werd.</em></p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-iteraties-for-en-while">5. Iteraties: <code>for</code> en <code>while</code></h2>
<p>PHP biedt klassieke lussen voor herhalende bewerkingen wanneer een conditie waar is:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-for-loop-aantal-iteraties-vooraf-bekend">1. <code>for</code> Loop (Aantal iteraties vooraf bekend)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">5</span>;

<span class="hljs-keyword">for</span> (<span class="hljs-variable">$i</span> = <span class="hljs-number">1</span>; <span class="hljs-variable">$i</span> &lt;= <span class="hljs-variable">$depth</span>; <span class="hljs-variable">$i</span>++) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$i</span> x <span class="hljs-subst">$base</span> = &quot;</span> . (<span class="hljs-variable">$i</span> * <span class="hljs-variable">$base</span>) . <span class="hljs-string">&quot;&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
<ul>
<li>Initialisatie: <code>$i = 1</code></li>
<li>Conditiecontrole vooraf: <code>$i &lt;= $depth</code></li>
<li>Stapgrootte: <code>$i++</code></li>
</ul>
</div>
<div class="card">
<h4 id="2-while-loop-conditiecontrole-vooraf">2. <code>while</code> Loop (Conditiecontrole VOORAF)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">5</span>;
<span class="hljs-variable">$j</span> = <span class="hljs-number">1</span>;

<span class="hljs-keyword">while</span> (<span class="hljs-variable">$j</span> &lt;= <span class="hljs-variable">$depth</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$j</span> x <span class="hljs-subst">$base</span> = &quot;</span> . (<span class="hljs-variable">$j</span> * <span class="hljs-variable">$base</span>) . <span class="hljs-string">&quot;&lt;/li&gt;\n&quot;</span>;
    <span class="hljs-variable">$j</span>++;
}
</code></pre>
<ul>
<li>Controleert de conditie <strong>vóór</strong> elke iteratie</li>
<li>Is de conditie direct <code>false</code>, dan draait de body 0 keer</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-iteraties-de-cruciale-do-while-edge-case">5. Iteraties: De Cruciale <code>do-while</code> Edge Case</h2>
<p>Wat gebeurt er als de conditie bij de start al <code>false</code> is (bijvoorbeeld bij <code>$depth = 0</code>)?</p>
<div class="grid-2">
<div class="card">
<h4 id="while-conditiecontrole-vooraf"><code>while</code> (Conditiecontrole VOORAF)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">0</span>; <span class="hljs-comment">// Diepte is 0</span>

<span class="hljs-variable">$j</span> = <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> (<span class="hljs-variable">$j</span> &lt;= <span class="hljs-variable">$depth</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$j</span> x <span class="hljs-subst">$base</span>&lt;/li&gt;&quot;</span>;
    <span class="hljs-variable">$j</span>++;
}
</code></pre>
<ul>
<li><strong>Output:</strong> <em>(geen enkele regel)</em></li>
<li><strong>0 of meer keren:</strong> Omdat <code>$j &lt;= 0</code> direct <code>false</code> is, wordt het codeblok overgeslagen</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="do-while-conditiecontrole-achteraf"><code>do-while</code> (Conditiecontrole ACHTERAF)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">0</span>; <span class="hljs-comment">// Diepte is 0</span>

<span class="hljs-variable">$k</span> = <span class="hljs-number">1</span>;
<span class="hljs-keyword">do</span> {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$k</span> x <span class="hljs-subst">$base</span>&lt;/li&gt;&quot;</span>;
    <span class="hljs-variable">$k</span>++;
} <span class="hljs-keyword">while</span> (<span class="hljs-variable">$k</span> &lt;= <span class="hljs-variable">$depth</span>);
</code></pre>
<ul>
<li><strong>Output:</strong> <code>1 x 7</code> <em>(geprint!)</em></li>
<li><strong>1 of meer keren:</strong> Het codeblok draait altijd minstens eenmaal vóór de controle</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-ge%C3%AFndexeerde-arrays">6. Geïndexeerde Arrays</h2>
<p>Arrays in PHP zijn dynamisch en kunnen groeien zonder vaste lengtebeperking:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Aanbevolen notatie met vierkante haken []</span>
<span class="hljs-variable">$teachers</span> = [<span class="hljs-string">&#x27;Michaël Cloots&#x27;</span>, <span class="hljs-string">&#x27;Jan Janssen&#x27;</span>, <span class="hljs-string">&#x27;Patrick Verhaert&#x27;</span>];

<span class="hljs-comment">// Elementen individueel toewijzen via index (start bij 0)</span>
<span class="hljs-variable">$students</span>[<span class="hljs-number">0</span>] = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$students</span>[<span class="hljs-number">1</span>] = <span class="hljs-string">&#x27;Jane Doe&#x27;</span>;

<span class="hljs-comment">// Element toevoegen aan het einde van de array (auto-increment index)</span>
<span class="hljs-variable">$teachers</span>[] = <span class="hljs-string">&#x27;Nieuwe Collega&#x27;</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="eigenschappen">Eigenschappen</h4>
<ul>
<li>Starten standaard op index <strong><code>0</code></strong></li>
<li>De index van het laatste element is <code>count($array) - 1</code></li>
<li><code>count($teachers)</code> geeft het totale aantal elementen terug</li>
</ul>
</div>
<div class="card">
<h4 id="naming-convention">Naming Convention</h4>
<p>Gebruik altijd een <strong>meervoudig zelfstandig naamwoord</strong> voor arrays (<code>$students</code>, <code>$records</code>, <code>$courses</code>), zodat direct duidelijk is dat de variabele een collectie bevat.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-associatieve-arrays-sleutel-waarde-paren">6. Associatieve Arrays: Sleutel-Waarde Paren</h2>
<p>In associatieve arrays worden numerieke indexen vervangen door betekenisvolle tekstsleutels (strings):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Alle elementen in een keer initialiseren</span>
<span class="hljs-variable">$scoresJane</span> = [
    <span class="hljs-string">&#x27;PHP&#x27;</span>                 =&gt; <span class="hljs-number">17</span>,
    <span class="hljs-string">&#x27;Business essentials&#x27;</span> =&gt; <span class="hljs-number">14</span>,
    <span class="hljs-string">&#x27;English 2&#x27;</span>           =&gt; <span class="hljs-number">10</span>,
];

<span class="hljs-comment">// Individueel element ophalen of updaten</span>
<span class="hljs-variable">$scoresJane</span>[<span class="hljs-string">&#x27;PHP&#x27;</span>] = <span class="hljs-number">18</span>;
</code></pre>
<div class="card card-accent">
<h4 id="interpolatie-van-associatieve-array-elementen">Interpolatie van associatieve array elementen</h4>
<p>Wanneer je een associatief array element binnen een dubbel gequote string plaatst, moet je accolades <code>{}</code> gebruiken:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Correct met accolades:</span>
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Jane scoort voor PHP: <span class="hljs-subst">{$scoresJane[&#x27;PHP&#x27;]}</span>&lt;/p&gt;&quot;</span>;

<span class="hljs-comment">// Of via string concatenatie:</span>
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Jane scoort voor PHP: &quot;</span> . <span class="hljs-variable">$scoresJane</span>[<span class="hljs-string">&#x27;PHP&#x27;</span>] . <span class="hljs-string">&quot;&lt;/p&gt;&quot;</span>;
</code></pre>
<p><em>Zonder accolades kan de PHP parser de array-sleutel binnen de string niet correct interpreteren.</em></p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-multidimensionale-arrays">6. Multidimensionale Arrays</h2>
<p>Een multidimensionale array is een geneste array waarbij elementen zelf ook weer arrays zijn:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$students</span> = [
    [
        <span class="hljs-string">&#x27;name&#x27;</span>   =&gt; <span class="hljs-string">&#x27;John&#x27;</span>,
        <span class="hljs-string">&#x27;scores&#x27;</span> =&gt; [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">13</span>, <span class="hljs-string">&#x27;Business&#x27;</span> =&gt; <span class="hljs-number">8</span>, <span class="hljs-string">&#x27;English&#x27;</span> =&gt; <span class="hljs-number">18</span>]
    ],
    [
        <span class="hljs-string">&#x27;name&#x27;</span>   =&gt; <span class="hljs-string">&#x27;Jane&#x27;</span>,
        <span class="hljs-string">&#x27;scores&#x27;</span> =&gt; [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">17</span>, <span class="hljs-string">&#x27;Business&#x27;</span> =&gt; <span class="hljs-number">14</span>, <span class="hljs-string">&#x27;English&#x27;</span> =&gt; <span class="hljs-number">10</span>]
    ],
];
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="dieperliggende-waarden-aanspreken">Dieperliggende waarden aanspreken</h4>
<p>Gebruik opeenvolgende vierkante haken:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Naam van de eerste student</span>
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$students</span>[<span class="hljs-number">0</span>][<span class="hljs-string">&#x27;name&#x27;</span>]; <span class="hljs-comment">// John</span>

<span class="hljs-comment">// Score voor PHP van Jane</span>
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$students</span>[<span class="hljs-number">1</span>][<span class="hljs-string">&#x27;scores&#x27;</span>][<span class="hljs-string">&#x27;PHP&#x27;</span>]; <span class="hljs-comment">// 17</span>
</code></pre>
</div>
<div class="card">
<h4 id="toepassing-in-webapplicaties">Toepassing in Webapplicaties</h4>
<p>Vrijwel alle data uit databases, API-koppelingen en JSON responses komt binnen in de vorm van multidimensionale datastructuren.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-itereren-met-de-foreach-lus">6. Itereren met de <code>foreach</code> Lus</h2>
<p>De <code>foreach</code> lus is de standaardmanier om arrays en collecties te doorlopen in PHP:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-enkel-waarden-uitlezen">1. Enkel waarden uitlezen</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$fruits</span> = [<span class="hljs-string">&#x27;Appel&#x27;</span>, <span class="hljs-string">&#x27;Banaan&#x27;</span>, <span class="hljs-string">&#x27;Kers&#x27;</span>];

<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$fruits</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$fruit</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$fruit</span>&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h4 id="2-index--sleutel-%C3%A9n-waarde">2. Index / Sleutel én Waarde</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$scores</span> = [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">16</span>, <span class="hljs-string">&#x27;Java&#x27;</span> =&gt; <span class="hljs-number">14</span>];

<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$scores</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$course</span> =&gt; <span class="hljs-variable">$score</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$course</span>: <span class="hljs-subst">$score</span>&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
</div>
</div>
<h4 id="geneste-foreach-voor-multidimensionale-arrays">Geneste <code>foreach</code> voor multidimensionale arrays</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$students</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$student</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;h3&gt;Student: <span class="hljs-subst">{$student[&#x27;name&#x27;]}</span>&lt;/h3&gt;&lt;ul&gt;&quot;</span>;
    <span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$student</span>[<span class="hljs-string">&#x27;scores&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-variable">$vak</span> =&gt; <span class="hljs-variable">$score</span>) {
        <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$vak</span>: <span class="hljs-subst">$score</span>&lt;/li&gt;&quot;</span>;
    }
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;/ul&gt;&quot;</span>;
}
</code></pre>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-objecten-stdclass--conversie">6. Objecten (<code>stdClass</code>) &amp; Conversie</h2>
<p>Naast arrays kent PHP ook generieke objecten (<code>stdClass</code>), waarbij eigenschappen worden aangesproken met de <strong>pijl-operator (<code>-&gt;</code>)</strong>:</p>
<div class="grid-2">
<div class="card">
<h4 id="conversie-array-naar-object">Conversie: Array naar Object</h4>
<p>De meest robuuste manier om diepe geneste arrays om te zetten naar objecten is via JSON:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Converteert multidimensionale array naar stdClass objecten</span>
<span class="hljs-variable">$studentsObj</span> = <span class="hljs-title function_ invoke__">json_decode</span>(<span class="hljs-title function_ invoke__">json_encode</span>(<span class="hljs-variable">$students</span>));

<span class="hljs-comment">// Eigenschappen benaderen via -&gt;</span>
<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$studentsObj</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$student</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;<span class="hljs-subst">$student</span>-&gt;name scoort <span class="hljs-subst">{$student-&gt;scores-&gt;PHP}</span>&lt;/p&gt;&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h4 id="belang-van-json_decode-parameters">Belang van <code>json_decode()</code> parameters</h4>
<ul>
<li><code>json_decode($json)</code> (of met <code>false</code>): Geeft een <strong><code>stdClass</code> object</strong> terug (<code>$obj-&gt;prop</code>)</li>
<li><code>json_decode($json, true)</code>: Geeft een <strong>associatieve array</strong> terug (<code>$arr['prop']</code>)</li>
</ul>
<p>In Laravel Eloquent werken modellen vrijwel altijd als objecten met de pijl-notatie!</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-debugging-var_dump-vs-print_r">6. Debugging: <code>var_dump()</code> vs. <code>print_r()</code></h2>
<p>Wanneer data niet de verwachte structuur heeft, zijn debugging functies onmisbaar:</p>
<div class="grid-2">
<div class="card">
<h4 id="var_dumpvariabele"><code>var_dump($variabele)</code></h4>
<ul>
<li>Toont het <strong>datatype</strong>, de <strong>lengte</strong> en de <strong>waarde</strong> van elk element</li>
<li>Ideaal voor het opsporen van typefouten (bijvoorbeeld <code>'10'</code> vs <code>10</code>)</li>
</ul>
</div>
<div class="card">
<h4 id="print_rvariabele"><code>print_r($variabele)</code></h4>
<ul>
<li>Toont een schoner, compacter overzicht van arrays en objecten</li>
<li>Makkelijker scanbaar voor grote datasets</li>
</ul>
</div>
</div>
<div class="card card-accent">
<h4 id="tip-behoud-formattering-met-pre-tags">Tip: Behoud formattering met <code>&lt;pre&gt;</code> tags</h4>
<p>Standaard drukt de browser alle spaties en enters uit debug functies samen tot 1 regel.<br />
Omring je debug calls altijd met HTML <code>&lt;pre&gt;</code> tags voor een overzichtelijke boomstructuur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;pre&gt;&#x27;</span>;
<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$students</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;/pre&gt;&#x27;</span>;
</code></pre>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-functies-defini%C3%ABren--return-types">7. Functies Definiëren &amp; Return Types</h2>
<p>Functies groeperen herbruikbare logica. In modern PHP declareren we expliciet return types:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Functie zonder returnwaarde</span>
<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">writeMessage</span>(<span class="hljs-params"></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Welkom bij het opleidingsonderdeel Web Development!&lt;/p&gt;\n&quot;</span>;
}

<span class="hljs-comment">// Functie met parameters en een strikt return type</span>
<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">calculateAverage</span>(<span class="hljs-params"><span class="hljs-keyword">float</span> <span class="hljs-variable">$score1</span>, <span class="hljs-keyword">float</span> <span class="hljs-variable">$score2</span></span>): <span class="hljs-title">float</span> 
</span>{
    <span class="hljs-keyword">return</span> (<span class="hljs-variable">$score1</span> + <span class="hljs-variable">$score2</span>) / <span class="hljs-number">2</span>;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="basisregels">Basisregels</h4>
<ul>
<li>Begin met het sleutelwoord <code>function</code></li>
<li>Geef betekenisvolle namen in camelCase</li>
<li>Gebruik <code>: void</code> als de functie bewust niets teruggeeft via <code>return</code></li>
</ul>
</div>
<div class="card">
<h4 id="aanroepen">Aanroepen</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">writeMessage</span>();

<span class="hljs-variable">$gemiddelde</span> = <span class="hljs-title function_ invoke__">calculateAverage</span>(<span class="hljs-number">14.5</span>, <span class="hljs-number">18.0</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Gemiddelde: <span class="hljs-subst">$gemiddelde</span>&lt;/p&gt;&quot;</span>;
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-parameters-default-values--references">7. Parameters, Default Values &amp; References</h2>
<p>Functies kunnen flexibel worden geconfigureerd met optionele argumenten of referentie-parameters:</p>
<div class="grid-2">
<div class="card">
<h4 id="default-parameters-optioneel">Default Parameters (Optioneel)</h4>
<p>Parameters met een standaardwaarde hoeven bij aanroep niet meegegeven te worden:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">greet</span>(<span class="hljs-params"><span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span> = <span class="hljs-string">&#x27;Student&#x27;</span></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Hallo, <span class="hljs-subst">$name</span>!&lt;/p&gt;&quot;</span>;
}

<span class="hljs-title function_ invoke__">greet</span>(<span class="hljs-string">&#x27;Jan&#x27;</span>);   <span class="hljs-comment">// Hallo, Jan!</span>
<span class="hljs-title function_ invoke__">greet</span>();        <span class="hljs-comment">// Hallo, Student!</span>
</code></pre>
<p><em>Plaats optionele parameters altijd achteraan.</em></p>
</div>
<div class="card">
<h4 id="by-value-vs-by-reference">By Value vs. By Reference (<code>&amp;</code>)</h4>
<ul>
<li><strong>By Value (standaard):</strong> De functie werkt op een kopie; origineel blijft ongewijzigd</li>
<li><strong>By Reference (<code>&amp;</code>):</strong> De functie wijzigt rechtstreeks de originele variabele</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">applyDiscount</span>(<span class="hljs-params"><span class="hljs-keyword">float</span> &amp;<span class="hljs-variable">$price</span></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-variable">$price</span> *= <span class="hljs-number">0.8</span>; <span class="hljs-comment">// Wijzigt $price buiten de functie!</span>
}

<span class="hljs-variable">$bedrag</span> = <span class="hljs-number">100.0</span>;
<span class="hljs-title function_ invoke__">applyDiscount</span>(<span class="hljs-variable">$bedrag</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$bedrag</span>; <span class="hljs-comment">// 80.0</span>
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-type-hinting-nullable-types-type-span-classbadgecruciaal-voor-laravelspan">7. Type Hinting: Nullable Types (<code>?type</code>) <span class="badge">Cruciaal voor Laravel</span></h2>
<p>Vaak kan een parameter of returnwaarde een specifiek type hebben, of <code>null</code> zijn (bijvoorbeeld een optioneel veld in de database):</p>
<div class="card card-accent">
<h4 id="nullable-syntax-met-vraagteken-string">Nullable syntax met vraagteken (<code>?string</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">findUserEmail</span>(<span class="hljs-params">?<span class="hljs-keyword">int</span> <span class="hljs-variable">$userId</span></span>): ?<span class="hljs-title">string</span> 
</span>{
    <span class="hljs-keyword">if</span> (<span class="hljs-variable">$userId</span> === <span class="hljs-literal">null</span>) {
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;user_<span class="hljs-subst">$userId</span>@thomasmore.be&quot;</span>;
}

<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">findUserEmail</span>(<span class="hljs-number">12</span>);   <span class="hljs-comment">// &quot;user_12@thomasmore.be&quot;</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">findUserEmail</span>(<span class="hljs-literal">null</span>); <span class="hljs-comment">// null</span>
</code></pre>
</div>
<div class="grid-2">
<div class="card">
<h4 id="waarom-cruciaal-in-laravel-1">Waarom cruciaal in Laravel?</h4>
<ul>
<li><strong>Eloquent Models:</strong> Optionele databasekolommen (<code>nullable()</code>)</li>
<li><strong>Form Requests &amp; DTO's:</strong> Velden die niet verplicht zijn</li>
<li>Voorkomt runtime null reference errors</li>
</ul>
</div>
<div class="card">
<h4 id="betekenis-van">Betekenis van <code>?</code></h4>
<ul>
<li><code>?string</code> is gelijk aan de union type <code>string|null</code></li>
<li>Zowel een string als de waarde <code>null</code> worden expliciet geaccepteerd</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-type-hinting-union-types--foutafhandeling">7. Type Hinting: Union Types &amp; Foutafhandeling</h2>
<p>PHP 8 breidt het typesysteem verder uit met union types en strikte foutdetectie:</p>
<div class="grid-2">
<div class="card">
<h4 id="union-types-intfloatstring">Union Types (<code>int|float|string</code>)</h4>
<p>Laat toe dat een argument of returnwaarde tot meerdere expliciete types behoort:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">formatScore</span>(<span class="hljs-params"><span class="hljs-keyword">int</span>|<span class="hljs-keyword">float</span> <span class="hljs-variable">$score</span></span>): <span class="hljs-title">string</span> 
</span>{
    <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">number_format</span>(<span class="hljs-variable">$score</span>, <span class="hljs-number">1</span>) . <span class="hljs-string">&#x27; / 20&#x27;</span>;
}

<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-number">14</span>);   <span class="hljs-comment">// &quot;14.0 / 20&quot;</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-number">16.5</span>); <span class="hljs-comment">// &quot;16.5 / 20&quot;</span>
</code></pre>
<ul>
<li>Types worden gescheiden door een pipe <code>|</code></li>
<li>Vervangt verouderde PHPDoc annotaties</li>
</ul>
</div>
<div class="card card-cyan">
<h4 id="strikte-foutafhandeling-typeerror">Strikte Foutafhandeling: <code>TypeError</code></h4>
<p>Wordt er een type doorgegeven dat niet matched, dan gooit PHP direct een <code>TypeError</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Bij actieve strict_types:</span>
<span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-string">&#x27;veertien&#x27;</span>); 
<span class="hljs-comment">// Fatal error: Uncaught TypeError!</span>
</code></pre>
<ul>
<li>Fouten crashen direct en luid tijdens ontwikkeling</li>
<li>Voorkomt dat corrupte data stilletjes in de database belandt</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
