</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-short-arrow-functies-fn--include_once">7. Short Arrow Functies (<code>fn</code>) &amp; <code>include_once</code></h2>
<p>Voor korte anonieme functies kent PHP 8 een beknopte pijlnotatie:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Klassieke anonieme functie</span>
<span class="hljs-variable">$doubleClassic</span> = <span class="hljs-function"><span class="hljs-keyword">function</span>(<span class="hljs-params"><span class="hljs-variable">$n</span></span>) </span>{ <span class="hljs-keyword">return</span> <span class="hljs-variable">$n</span> * <span class="hljs-number">2</span>; };

<span class="hljs-comment">// Moderne Short Arrow Function (impliciete return van de expressie)</span>
<span class="hljs-variable">$double</span> = <span class="hljs-function"><span class="hljs-keyword">fn</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$n</span></span>): <span class="hljs-title">int</span> =&gt;</span> <span class="hljs-variable">$n</span> * <span class="hljs-number">2</span>;

<span class="hljs-variable">$numbers</span> = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>];
<span class="hljs-variable">$multiplied</span> = <span class="hljs-title function_ invoke__">array_map</span>(fn(<span class="hljs-variable">$n</span>) =&gt; <span class="hljs-variable">$n</span> * <span class="hljs-number">10</span>, <span class="hljs-variable">$numbers</span>); <span class="hljs-comment">// [10, 20, 30, 40]</span>
</code></pre>
<div class="card">
<h4 id="functies-opsplitsen-met-include_once">Functies opsplitsen met <code>include_once</code></h4>
<p>Plaats herbruikbare functies in aparte bestanden (bijv. <code>shared/functions.php</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">include_once</span> <span class="hljs-string">&#x27;../shared/functions.php&#x27;</span>; <span class="hljs-comment">// Laadt het bestand eenmalig in</span>
</code></pre>
<p><em>Gebruik altijd relatieve paden of <code>$_SERVER['DOCUMENT_ROOT'] . '/shared/...'</code>. Een pad dat start met <code>/</code> verwijst in PHP immers naar de root van het serversysteem, niet naar je projectmap!</em></p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-formulieren-html-formulier-basics">8. Formulieren: HTML Formulier Basics</h2>
<p>Formulieren zijn de primaire manier waarop gebruikers gegevens naar de webserver sturen:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;post&quot;</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;verwerk.php&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>Naam:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">span</span>&gt;</span>Geslacht:<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;M&quot;</span>&gt;</span> Man<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;F&quot;</span>&gt;</span> Vrouw<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;submit&quot;</span>&gt;</span>Verzenden<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="kernattributen">Kernattributen</h4>
<ul>
<li><code>action</code>: De bestemmings-URL waar de formulierdata naartoe wordt gestuurd</li>
<li><code>method</code>: De HTTP verzendmethode (<code>GET</code> of <code>POST</code>)</li>
<li><code>name</code>: <strong>Cruciaal:</strong> De waarde van het <code>name</code> attribuut vormt de array-sleutel in PHP!</li>
</ul>
</div>
<div class="card">
<h4 id="superglobals">Superglobals</h4>
<p>Bij verzending maakt PHP automatisch een associatieve array aan:</p>
<ul>
<li><code>method=&quot;get&quot;</code> vult de globale array <strong><code>$_GET</code></strong></li>
<li><code>method=&quot;post&quot;</code> vult de globale array <strong><code>$_POST</code></strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-formulierverwerking-met-_get">8. Formulierverwerking met <code>$_GET</code></h2>
<p>Bij <code>GET</code> worden alle formulierwaarden zichtbaar toegevoegd aan de URL (de query string):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>https://php8.test/verwerk.php?name=John+Doe&amp;gender=M
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// In het verwerkingsbestand (verwerk.php):</span>
<span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Niet opgegeven&#x27;</span>;
<span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Niet opgegeven&#x27;</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Welkom, <span class="hljs-subst">$name</span> (Geslacht: <span class="hljs-subst">$gender</span>)&lt;/p&gt;&quot;</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="wanneer-gebruik-je-get">Wanneer gebruik je <code>GET</code>?</h4>
<ul>
<li><strong>Zoekopdrachten en filters:</strong> URL kan worden gebookmarked of gedeeld</li>
<li><strong>Geen gevoelige data:</strong> Wachtwoorden horen nooit in een URL thuis</li>
<li><strong>Beperkte lengte:</strong> Browsers leggen limieten op aan URL-lengtes (~2048 tekens)</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="isset-vs-empty"><code>isset()</code> vs. <code>empty()</code></h4>
<ul>
<li><code>isset($var)</code>: Waar als de variabele bestaat en <strong>niet null</strong> is</li>
<li><code>empty($var)</code>: Waar als de variabele niet bestaat, of <code>&quot;&quot;</code>, <code>0</code>, <code>false</code>, <code>null</code> of <code>[]</code> is</li>
<li><strong>Tip:</strong> Een leeg tekstveld stuurt een lege string <code>&quot;&quot;</code>. Gebruik daarom <code>empty()</code> om lege invoer op te sporen!</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-formulierverwerking-met-_post">8. Formulierverwerking met <code>$_POST</code></h2>
<p>Bij <code>POST</code> worden gegevens onzichtbaar in de HTTP request body verzonden:</p>
<div class="grid-2">
<div class="card">
<h4 id="voordelen-van-post">Voordelen van <code>POST</code></h4>
<ul>
<li><strong>Veilig voor gevoelige data:</strong> Wachtwoorden en persoonsgegevens verschijnen niet in de browsergeschiedenis of serverlogs</li>
<li><strong>Geen datalimiet:</strong> Geschikt voor grote tekstblokken en bestandsuploads</li>
<li>Wijzigt doorgaans de staat op de server (create, update, delete)</li>
</ul>
</div>
<div class="card">
<h4 id="post-data-inspecteren-in-devtools">POST Data Inspecteren in DevTools</h4>
<ol>
<li>Druk op <code>F12</code> en open het tabblad <strong>Network</strong></li>
<li>Verstuur het formulier in de browser</li>
<li>Klik op de request in de lijst</li>
<li>Bekijk in het tabblad <strong>Payload</strong> de exacte sleutels en waarden die verzonden zijn</li>
</ol>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Inlezen via de $_POST superglobal:</span>
<span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Onbekend&#x27;</span>;
<span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Niet geselecteerd&#x27;</span>;
</code></pre>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-single-page-form-het-concept--flow">8. Single Page Form: Het Concept &amp; Flow</h2>
<p>In plaats van een apart verwerkingsbestand (<code>verwerk.php</code>), kunnen we invoer en verwerking op <strong>dezelfde pagina</strong> houden:</p>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="hoe-werkt-de-flow">Hoe werkt de flow?</h4>
<ul>
<li><strong><code>$_SERVER['PHP_SELF']</code></strong>: Verwijst altijd dynamisch naar de URL van het huidige script</li>
<li><strong>Eerste bezoek (GET):</strong> <code>$_POST</code> is leeg (<code>false</code>) -&gt; het formulier wordt getoond</li>
<li><strong>Na verzending (POST):</strong> <code>$_POST</code> bevat data (<code>true</code>) -&gt; de verwerking toont het resultaat</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="waarom-single-page">Waarom Single Page?</h4>
<ul>
<li><strong>Directe feedback:</strong> Foutmeldingen of succesboodschappen op dezelfde pagina</li>
<li><strong>State behoud:</strong> Ingevoerde waarden kunnen opnieuw worden ingevuld bij validatiefouten</li>
<li><strong>Eenvoud:</strong> Geen extra omleidings- of verwerkingsscripts nodig</li>
</ul>
</div>
</div>
<div class="card">
<h4 id="controlemechanisme-in-php">Controlemechanisme in PHP</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">if</span> (<span class="hljs-variable">$_POST</span>) {
    <span class="hljs-comment">// Formulier is verzonden: lees $_POST uit en toon bedanking of foutmelding</span>
} <span class="hljs-keyword">else</span> {
    <span class="hljs-comment">// Eerste bezoek: toon het lege HTML-formulier</span>
}
</code></pre>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-single-page-form-implementatie">8. Single Page Form: Implementatie</h2>
<p>Volledige opbouw met een standaard <code>if ($_POST) { ... } else { ... }</code> controlestructuur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;article&gt;
<span class="hljs-meta">&lt;?php</span>
<span class="hljs-keyword">if</span> (<span class="hljs-variable">$_POST</span>) {
    <span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Niet ingevuld&#x27;</span>;
    <span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Niet aangeduid&#x27;</span>;
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Bedankt voor je invoer, &lt;b&gt;<span class="hljs-subst">$name</span>&lt;/b&gt; (<span class="hljs-subst">$gender</span>)!&lt;/p&gt;&quot;</span>;
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;&lt;a href=&#x27;<span class="hljs-subst">{$_SERVER[&#x27;PHP_SELF&#x27;]}</span>&#x27; class=&#x27;btn&#x27;&gt;Opnieuw invoeren&lt;/a&gt;&lt;/p&gt;&quot;</span>;
} <span class="hljs-keyword">else</span> {
<span class="hljs-meta">?&gt;</span>
    &lt;form method=<span class="hljs-string">&quot;post&quot;</span> action=<span class="hljs-string">&quot;&lt;?php echo <span class="hljs-subst">$_SERVER</span>[&#x27;PHP_SELF&#x27;]; ?&gt;&quot;</span>&gt;
      &lt;input type=<span class="hljs-string">&quot;text&quot;</span> name=<span class="hljs-string">&quot;name&quot;</span> placeholder=<span class="hljs-string">&quot;Jouw naam&quot;</span>&gt;
      &lt;button type=<span class="hljs-string">&quot;submit&quot;</span>&gt;Verzend&lt;/button&gt;
    &lt;/form&gt;
<span class="hljs-meta">&lt;?php</span>
}
<span class="hljs-meta">?&gt;</span>
&lt;/article&gt;
</code></pre>
<ul>
<li><strong>Resetknop:</strong> De link naar <code>$_SERVER['PHP_SELF']</code> triggert een <code>GET</code>-request, waardoor <code>$_POST</code> leeg is en het <code>else</code>-blok het formulier opnieuw toont.</li>
</ul>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-klassen-in-php-de-basis-student">9. Klassen in PHP: De Basis (<code>Student</code>)</h2>
<p>Object-Oriented Programming (OOP) organiseert code in klassen (blauwdrukken) en objecten:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Student</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">getName</span>(<span class="hljs-params"></span>): <span class="hljs-title">string</span> </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;name;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">setName</span>(<span class="hljs-params"><span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span></span>): <span class="hljs-title">void</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;name = <span class="hljs-variable">$name</span>;
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="naming--encapsulatie">Naming &amp; Encapsulatie</h4>
<ul>
<li>Klassenamen starten met een <strong>hoofdletter</strong> (PascalCase)</li>
<li>Bestandsnaam is exact gelijk: <code>Student.php</code></li>
<li><code>private</code>: eigenschappen enkel binnen de klasse zelf bereikbaar (encapsulatie)</li>
</ul>
</div>
<div class="card" style="margin-top: 15px;">
<h4 id="mutators--this">Mutators &amp; <code>$this</code></h4>
<ul>
<li><strong>Getters &amp; Setters:</strong> Bieden gecontroleerde publieke toegang tot eigenschappen</li>
<li><strong><code>$this</code></strong>: Verwijst naar de huidige specifieke instantie</li>
<li><strong><code>-&gt;</code></strong>: Pijl-operator voor eigenschappen en methoden (<code>$this-&gt;name</code>)</li>
</ul>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-namespaces--autoloading">9. Namespaces &amp; Autoloading</h2>
<p>Namespaces voorkomen naamconflicten en weerspiegelen de mappenstructuur van je applicatie:</p>
<div class="grid-2">
<div class="card">
<h4 id="definitie-in-de-klasse">Definitie in de klasse</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Bestand: classes/Student.php</span>
<span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Student</span> 
</span>{
    <span class="hljs-comment">// ...</span>
}
</code></pre>
<ul>
<li>Sleutelwoord <code>namespace</code> staat altijd als allereerste statement</li>
<li><em>Tip: Rechtsklik in PhpStorm op map -&gt; <strong>New -&gt; PHP Class</strong> genereert automatisch de namespace!</em></li>
</ul>
</div>
<div class="card">
<h4 id="gebruik-via-use-statement">Gebruik via <code>use</code> statement</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Bestand: course/test.php</span>
<span class="hljs-keyword">include_once</span> <span class="hljs-string">&#x27;../classes/Student.php&#x27;</span>;

<span class="hljs-keyword">use</span> <span class="hljs-title">classes</span>\<span class="hljs-title">Student</span>;

<span class="hljs-variable">$student</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Student</span>();
<span class="hljs-variable">$student</span>-&gt;<span class="hljs-title function_ invoke__">setName</span>(<span class="hljs-string">&#x27;John Doe&#x27;</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$student</span>-&gt;<span class="hljs-title function_ invoke__">getName</span>();
</code></pre>
<p>Zonder <code>use</code> zou je overal de Fully Qualified Name <code>\classes\Student</code> moeten schrijven.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-constructors--geen-overloading-teacher">9. Constructors &amp; Geen Overloading (<code>Teacher</code>)</h2>
<p>Een constructor initialiseert een object bij aanmaak via het <code>new</code> sleutelwoord:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>\<span class="hljs-title class_">employees</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Teacher</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span>;

    <span class="hljs-comment">// Geparametriseerde constructor</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span> = <span class="hljs-string">&#x27;&#x27;</span>, 
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span> = <span class="hljs-string">&#x27;&#x27;</span>
    </span>) </span>{
        <span class="hljs-variable language_">$this</span>-&gt;name = <span class="hljs-variable">$name</span>;
        <span class="hljs-variable language_">$this</span>-&gt;gender = <span class="hljs-variable">$gender</span>;
    }
}
</code></pre>
</div>
<div class="card card-accent">
<h4 id="geen-overloading-in-php">Geen Overloading in PHP</h4>
<p>In tegenstelling tot Java ondersteunt PHP <strong>geen meerdere constructors</strong> met verschillende parameterlijsten!</p>
<p><strong>De oplossing:</strong> Geef parameters default waarden (<code>= ''</code>). Hierdoor zijn zowel <code>new Teacher('Jan', 'M')</code> als <code>new Teacher()</code> perfect geldig met dezelfde constructor.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-method-chaining-number">9. Method Chaining (<code>Number</code>)</h2>
<p>Method chaining stelt ons in staat om meerdere bewerkingen achter elkaar op hetzelfde object uit te voeren:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Number</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$x</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$x</span></span>) </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x = <span class="hljs-variable">$x</span>;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">add</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$y</span></span>): <span class="hljs-title">Number</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x += <span class="hljs-variable">$y</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>; <span class="hljs-comment">// Retourneert het object!</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">multiply</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$y</span></span>): <span class="hljs-title">Number</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x *= <span class="hljs-variable">$y</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>; <span class="hljs-comment">// Maakt de methode chainable</span>
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="fluent-interface-in-actie">Fluent Interface in Actie</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$number</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Number</span>(<span class="hljs-number">10</span>);
<span class="hljs-variable">$number</span>-&gt;<span class="hljs-title function_ invoke__">add</span>(<span class="hljs-number">90</span>)-&gt;<span class="hljs-title function_ invoke__">multiply</span>(<span class="hljs-number">3</span>); 
<span class="hljs-comment">// (10 + 90) * 3 = 300</span>
</code></pre>
<p>Doordat elke methode <code>return $this;</code> oplevert, kan de volgende methode direct worden aangeroepen op het resultaat.</p>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-statische-methoden--eigenschappen-drawer">9. Statische Methoden &amp; Eigenschappen (<code>Drawer</code>)</h2>
<p>Statische leden behoren toe aan de klasse zelf, niet aan een individuele instantie:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Drawer</span> 
</span>{
    <span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PI</span> = <span class="hljs-number">3.14</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-built_in">static</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$color</span> = <span class="hljs-string">&#x27;blue&#x27;</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-built_in">static</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">circle</span>(<span class="hljs-params">
        <span class="hljs-keyword">int</span> <span class="hljs-variable">$diameter</span> = <span class="hljs-number">100</span>
    </span>): <span class="hljs-title">string</span> </span>{
        <span class="hljs-built_in">self</span>::<span class="hljs-variable">$color</span> = <span class="hljs-string">&#x27;purple&#x27;</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">__CLASS__</span>; <span class="hljs-comment">// Static chaining</span>
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="scope-resolution-operator">Scope Resolution Operator (<code>::</code>)</h4>
<ul>
<li>Aanroepen zonder <code>new</code>: <code>Drawer::circle(150)</code></li>
<li>Binnen de klasse verwijst <strong><code>self::</code></strong> naar statische leden</li>
<li><strong><code>$this</code> bestaat niet</strong> in statische context!</li>
</ul>
</div>
<div class="card" style="margin-top: 15px;">
<h4 id="klassenconstanten-const">Klassenconstanten (<code>const</code>)</h4>
<ul>
<li>Gedeclareerd in <code>UPPERCASE</code>: <code>const PI = 3.14;</code></li>
<li>Benaderen via <code>self::PI</code> of <code>Drawer::PI</code></li>
<li>Onveranderlijk na declaratie</li>
</ul>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-statische-methoden-in-de-praktijk-de-link-naar-laravel">9. Statische Methoden in de Praktijk: De Link naar Laravel</h2>
<p>In Laravel zul je dagelijks fluent method chaining en statische aanroepen combineren:</p>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="statische-helpers-in-laravel">Statische Helpers in Laravel</h4>
<ul>
<li><strong>Datums &amp; Tijd (Carbon):</strong><br />
<code>Carbon\Carbon::now()-&gt;addDays(7);</code></li>
<li><strong>String manipulatie:</strong><br />
<code>Str::upper('thomas more');</code></li>
<li><strong>Array operaties:</strong><br />
<code>Arr::first($records);</code></li>
</ul>
</div>
<div class="card card-accent">
<h4 id="query-builder--database">Query Builder &amp; Database</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Statische start + fluent chaining:</span>
<span class="hljs-variable">$records</span> = DB::<span class="hljs-title function_ invoke__">table</span>(<span class="hljs-string">&#x27;records&#x27;</span>)
    -&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;genre_id&#x27;</span>, <span class="hljs-number">1</span>)
    -&gt;<span class="hljs-title function_ invoke__">orderBy</span>(<span class="hljs-string">&#x27;title&#x27;</span>)
    -&gt;<span class="hljs-title function_ invoke__">get</span>();
</code></pre>
<p><code>DB::table()</code> initialiseert de builder, waarna chaining (<code>-&gt;where()-&gt;get()</code>) volgt.</p>
</div>
</div>
<div class="card">
<h4 id="ontwerprichtlijn">Ontwerprichtlijn</h4>
<p>Gebruik statische methoden voor pure utilities die geen instantie-state nodig hebben, en instantie-methoden zodra een object zijn eigen unieke toestand moet bewaren.</p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="samenvatting-jouw-fundering-voor-laravel-13">Samenvatting: Jouw Fundering voor Laravel 13</h2>
<p>Je hebt nu de essentiële bouwstenen van modern PHP 8.5 onder de knie:</p>
<div class="grid-2">
<div class="card">
<h4 id="wat-we-hebben-gezien">Wat we hebben gezien</h4>
<ul>
<li><strong>Syntaxis:</strong> <code>$</code>, strings, heredoc en datatypes</li>
<li><strong>Operatoren:</strong> <code>===</code>, ternary en de <code>??</code> operator</li>
<li><strong>Structuren:</strong> <code>match</code>, loops en array-structuren</li>
<li><strong>Functies:</strong> Type hinting, nullable types (<code>?type</code>) en <code>fn</code></li>
<li><strong>Formulieren:</strong> <code>$_GET</code>, <code>$_POST</code> en single page processing</li>
<li><strong>OOP:</strong> Klassen, encapsulation, chaining en static methods</li>
</ul>
</div>
<div class="card card-cyan">
<h4 id="volgende-stappen">Volgende Stappen</h4>
<ul>
<li>Oefen met de bestanden in het <strong><code>learn_php8</code></strong> project</li>
<li>Test de interactieve formulieren en OOP in Herd</li>
<li>Volgende modules: <strong>Tailwind CSS v4</strong>, <strong>Alpine.js</strong> en het <strong>Laravel 13 Vinyl Shop Project</strong>!</li>
</ul>
<div class="meta-box" style="margin-top: 14px; padding: 10px 14px;">
  <strong>Vragen?</strong> Spreek je lectoren aan of raadpleeg <a href="https://itf-webdev.netlify.app/php/">itf-webdev.netlify.app</a>.
</div>
</div>
</div>

</section>
