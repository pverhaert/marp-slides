<header>ITF | Web Development - PHP 8</header>
<h2 id="1-introduction-to-php-what-is-php">1. Introduction to PHP: What is PHP?</h2>
<p>PHP is a popular <strong>server-side scripting language</strong>, specifically designed for web development:</p>
<div class="grid-2">
<div class="card">
<h4 id="key-characteristics">Key Characteristics</h4>
<ul>
<li><strong>Server-side:</strong> PHP code runs on the web server, unlike client-side JavaScript in the browser</li>
<li><strong>Cross-platform:</strong> Runs smoothly on Linux, Windows and macOS</li>
<li><strong>Server support:</strong> Works seamlessly with Nginx, Apache and IIS</li>
<li><strong>Open-source &amp; free:</strong> Freely usable and broadly supported by hosting providers</li>
<li><strong>C-style syntax:</strong> Strong similarities to Java, C# and JavaScript</li>
</ul>
</div>
<div class="card">
<h4 id="ecosystem--applications">Ecosystem &amp; Applications</h4>
<ul>
<li><strong>Well-known platforms:</strong> WordPress, Drupal, Magento, Moodle and Wikipedia</li>
<li><strong>Modern frameworks:</strong> Symfony and <strong>Laravel</strong></li>
<li><strong>Origins:</strong> Created by Rasmus Lerdorf in 1994 (originally &quot;Personal Home Page&quot;)</li>
<li><strong>Current meaning:</strong> Recursive acronym for <em>PHP: Hypertext Preprocessor</em></li>
<li><strong>Version in this course:</strong> <strong>PHP 8.5.x</strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="1-how-php-works-client-vs-server-flow">1. How PHP Works: Client vs. Server Flow</h2>
<p>The client (browser) only receives the final result in plain HTML:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Browser Client]  --&gt; 1. HTTP Request (hello_world.php) ---&gt;  [Webserver: Nginx/Apache]
                                                                        |
                                                                2. Executes PHP engine
                                                                3. Database queries (optional)
                                                                4. Generates plain HTML
                                                                        |
[Browser Client]  &lt;-- 5. HTTP Response (Plain HTML output) &lt;-- [Webserver: Nginx/Apache]
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="original-php-file-on-the-server">Original PHP File on the Server</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;!doctype html&gt;
&lt;html lang=<span class="hljs-string">&quot;en&quot;</span>&gt;
&lt;body&gt;
  &lt;h1&gt;<span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;Hello world&#x27;</span>; <span class="hljs-meta">?&gt;</span>&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;
</code></pre>
</div>
<div class="card">
<h4 id="html-result-in-the-browser">HTML Result in the Browser</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!doctype <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;en&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hello world<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="1-php-8-highlights-modern-language-features">1. PHP 8 Highlights: Modern Language Features</h2>
<p>In recent years, PHP has undergone a major transformation into a modern, strictly typed language:</p>
<div class="grid-2">
<div class="card">
<h4 id="modern-expressiveness">Modern Expressiveness</h4>
<ul>
<li><strong>Named arguments:</strong> Pass arguments by parameter name rather than strictly by position</li>
<li><strong>Match expressions:</strong> A cleaner, expressive and strict alternative to <code>switch</code></li>
<li><strong>Nullsafe operator (<code>?-&gt;</code>):</strong> Safely call methods on objects that may potentially be <code>null</code></li>
<li><strong>Short arrow functions (<code>fn</code>):</strong> Compact closures for functional array operations</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="type-safety--architecture">Type Safety &amp; Architecture</h4>
<ul>
<li><strong>Union types (<code>int|string</code>):</strong> Values can accept multiple explicit types</li>
<li><strong>Nullable types (<code>?string</code>):</strong> Explicit support for the absence of values</li>
<li><strong>Readonly properties:</strong> Properties that cannot be modified after initialisation</li>
<li><strong>Enums:</strong> Type-safe enumerations of fixed allowed values</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="1-why-php-preparation-for-laravel-span-classbadgecrucialspan">1. Why PHP? Preparation for Laravel <span class="badge">Crucial</span></h2>
<p>This introduction to PHP 8 is not an isolated topic, but the <strong>essential foundation</strong> for the remainder of this course:</p>
<div class="card card-cyan">
<h4 id="direct-link-to-laravel">Direct Link to Laravel</h4>
<p>In a few weeks, we will begin developing a full-featured <strong>Laravel 13 web application</strong>.<br />
Laravel is written in modern PHP. A solid grasp of core PHP 8 concepts ensures you understand what the framework does under the hood.</p>
</div>
<div class="grid-2">
<div class="card">
<h4 id="what-you-will-instantly-recognise">What You Will Instantly Recognise</h4>
<ul>
<li><strong>Routing &amp; Controllers:</strong> PHP classes, methods and type hints</li>
<li><strong>Blade templates:</strong> Ternary operators and loops (<code>@foreach</code>)</li>
<li><strong>Eloquent Models:</strong> Associative arrays, object casting and nullables</li>
<li><strong>Helpers:</strong> Static helper methods and method chaining</li>
</ul>
</div>
<div class="card">
<h4 id="head-start-for-students">Head Start for Students</h4>
<ul>
<li>You already know core programming syntax from Java, JavaScript and Python</li>
<li>We focus specifically on <strong>PHP-specific constructs</strong>: the dollar sign <code>$</code>, array handling, strict comparisons and the null coalescing operator (<code>??</code>)</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="2-example-project-learn_php8">2. Example Project: <code>learn_php8</code></h2>
<p>Throughout this chapter we make use of the official companion practice project:</p>
<div class="grid-2">
<div class="card">
<h4 id="project-resources">Project Resources</h4>
<ul>
<li><strong>GitHub Repository:</strong><br />
<a href="https://github.com/pverhaert/learn_php8">github.com/pverhaert/learn_php8</a></li>
<li><strong>Online Preview:</strong><br />
<a href="https://php8.z01.be/">php8.z01.be</a></li>
<li>Contains all theory examples and hands-on exercises</li>
<li>Styled with Tailwind CSS for a clean, legible UI</li>
</ul>
</div>
<div class="card">
<h4 id="cloning-the-repo-via-terminal">Cloning the Repo via Terminal</h4>
<p>Navigate to your projects directory (e.g. <code>C:\sites_laravel</code>) and run:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">git <span class="hljs-built_in">clone</span> https://github.com/pverhaert/learn_php8.git php8
<span class="hljs-built_in">cd</span> php8
<span class="hljs-built_in">rm</span> -rf .git
npm install
</code></pre>
<p><code>npm install</code> installs the front-end tooling (Tailwind CSS, Browsersync) from <code>package.json</code>.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="2-development-environment-laravel-herd">2. Development Environment: Laravel Herd</h2>
<p>Instead of heavy traditional LAMP/WAMP stacks (XAMPP, MAMP), we use <strong>Laravel Herd</strong>:</p>
<div class="grid-2">
<div class="card card-accent">
<h4 id="why-laravel-herd">Why Laravel Herd?</h4>
<ul>
<li><strong>Zero-configuration:</strong> No hassle with vhosts or manual Apache configurations</li>
<li><strong>Complete stack:</strong> Bundles Nginx, Node.js and multiple PHP versions (PHP 8.5)</li>
<li><strong>Automatic HTTPS:</strong> Easily manage local certificates with a click on the lock icon</li>
<li><strong>Lightning fast:</strong> Minimal memory footprint and native performance on Windows and macOS</li>
</ul>
</div>
<div class="card">
<h4 id="configuring-herd-for-php8">Configuring Herd for <code>php8</code></h4>
<ol>
<li>Open Laravel Herd and navigate to <strong>Sites</strong></li>
<li>Click the three dots at top right and choose <strong>Show sites without valid driver</strong></li>
<li>The project <code>php8</code> appears in the list</li>
<li>Click the <strong>lock icon</strong> to secure the site with HTTPS: <code>https://php8.test</code></li>
</ol>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="2-running-the-project--live-reloading">2. Running the Project &amp; Live Reloading</h2>
<p>Open the project folder <code>C:\sites_laravel\php8</code> in PhpStorm and start the watch task:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run watch
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="what-happens-behind-the-scenes">What Happens Behind the Scenes?</h4>
<ul>
<li>Starts a Browsersync proxy server on <strong><code>http://localhost:5500</code></strong></li>
<li>Monitors changes across PHP, JS and CSS files</li>
<li>Automatically refreshes the browser the moment you save a file in your editor</li>
</ul>
</div>
<div class="card">
<h4 id="direct-url-vs-proxy">Direct URL vs. Proxy</h4>
<ul>
<li><strong><code>http://localhost:5500</code>:</strong> Browsersync proxy with automatic live-reload (recommended during development)</li>
<li><strong><code>https://php8.test</code>:</strong> Direct Nginx URL via Herd (requires manual browser refresh after code changes)</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-basic-syntax-php-code-blocks">3. Basic Syntax: PHP Code Blocks</h2>
<p>PHP code integrates seamlessly inside HTML documents using script tags:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;!doctype html&gt;
&lt;html lang=<span class="hljs-string">&quot;en&quot;</span>&gt;
&lt;head&gt;
  <span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">include_once</span>(<span class="hljs-string">&#x27;../shared/meta.php&#x27;</span>); <span class="hljs-meta">?&gt;</span>
  &lt;title&gt;Hello world&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello world&lt;/h1&gt;
  &lt;p&gt;<span class="hljs-meta">&lt;?php</span> <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;Hello world&#x27;</span>; <span class="hljs-meta">?&gt;</span>&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="script-block-rules">Script Block Rules</h4>
<ul>
<li>Always start with <code>&lt;?php</code> and close with <code>?&gt;</code></li>
<li>Each individual statement must end with a semicolon <code>;</code></li>
<li><code>echo</code> is the primary construct used to output text or HTML</li>
</ul>
</div>
<div class="card">
<h4 id="shorthand-variations">Shorthand Variations</h4>
<ul>
<li><strong>Shorthand echo:</strong> <code>&lt;?= 'Hello world' ?&gt;</code> is fully equivalent to <code>&lt;?php echo 'Hello world'; ?&gt;</code></li>
<li><strong>Pure PHP files:</strong> If a file contains only PHP code (no HTML), the closing tag <code>?&gt;</code> <strong>must be omitted</strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-basic-syntax-comments--ide-shortcuts">3. Basic Syntax: Comments &amp; IDE Shortcuts</h2>
<p>Well-documented code enhances readability and maintainability:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-comment">// This is an inline single-line comment</span>

<span class="hljs-comment">/*
 * This comment block
 * spans across multiple lines
 */</span>

<span class="hljs-variable">$score</span> = <span class="hljs-number">15</span>; <span class="hljs-comment">// Comment following a statement</span>
</code></pre>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="phpstorm-shortcuts">PhpStorm Shortcuts</h4>
<ul>
<li><strong>Single-line comment:</strong> <code>Ctrl + /</code> (toggle on selected lines)</li>
<li><strong>Multi-line comment:</strong> <code>Ctrl + Shift + /</code> (wraps selection with <code>/* ... */</code>)</li>
<li><strong>Format code:</strong> <code>Ctrl + Alt + L</code></li>
</ul>
</div>
<div class="card">
<h4 id="best-practice">Best Practice</h4>
<p>Write comments to explain the <strong>why</strong> behind complex business logic, never the obvious &quot;how&quot; of standard syntax.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-variables--naming-conventions">3. Variables &amp; Naming Conventions</h2>
<p>Compared to Java, JavaScript and Python, the dollar sign immediately stands out:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage1</span> = <span class="hljs-number">73.08</span>;
<span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$hasGraduated</span> = <span class="hljs-literal">true</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="strict-naming-rules">Strict Naming Rules</h4>
<ul>
<li><strong>Always begins with a dollar sign (<code>$</code>)</strong></li>
<li>Followed by a letter or underscore <code>_</code> (never a digit as starting character)</li>
<li>May only contain alphanumeric characters and underscores (no spaces or hyphens)</li>
<li><strong>Case-sensitive:</strong> <code>$student</code> and <code>$Student</code> are two completely different variables</li>
</ul>
</div>
<div class="card">
<h4 id="conventions-in-php--laravel">Conventions in PHP &amp; Laravel</h4>
<ul>
<li>Use <strong>camelCase</strong> (<code>$firstName</code>) or <strong>snake_case</strong> (<code>$first_name</code>) for variable names</li>
<li>Use <strong>PascalCase</strong> (<code>StudentController</code>) for class names</li>
<li>Variables do not require pre-declaration keywords like <code>let</code>, <code>var</code> or explicit types</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-data-types-in-php-8">3. Data Types in PHP 8</h2>
<p>PHP is a dynamically typed language: the type of a variable is inferred based on its assigned value:</p>
<div class="grid-2">
<div class="card">
<h4 id="primitive-data-types">Primitive Data Types</h4>
<ul>
<li><strong>Integer:</strong> Whole numbers (<code>42</code>, <code>-10</code>, <code>0</code>)</li>
<li><strong>Float:</strong> Floating-point numbers (<code>3.14</code>, <code>12.7</code>, scientific <code>34e-2</code>)</li>
<li><strong>String:</strong> Text sequences (<code>'John Doe'</code>, <code>&quot;Web Development&quot;</code>)</li>
<li><strong>Boolean:</strong> Logical values (<code>true</code> or <code>false</code>)</li>
<li><strong>NULL:</strong> Variable without an assigned value (<code>null</code>)</li>
</ul>
</div>
<div class="card">
<h4 id="compound--special-types">Compound &amp; Special Types</h4>
<ul>
<li><strong>Array:</strong> Ordered maps of values or key-value pairs</li>
<li><strong>Object:</strong> Instance of a defined class</li>
<li>PHP converts types automatically where needed (type juggling), but offers strong support for strict typing via PHP 8</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-type-juggling-vs-strict-typing-span-classbadgephp-8-best-practicespan">3. Type Juggling vs. Strict Typing <span class="badge">PHP 8 Best Practice</span></h2>
<p>By default, PHP attempts to convert types automatically to the expected type (<strong>type juggling</strong>). With <code>declare(strict_types=1);</code>, you enforce strict type checking:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-without-strict-typing-default">1. Without Strict Typing (Default)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">sum</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$a</span>, <span class="hljs-keyword">int</span> <span class="hljs-variable">$b</span></span>): <span class="hljs-title">int</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$a</span> + <span class="hljs-variable">$b</span>;
}

<span class="hljs-comment">// String &#x27;10&#x27; is silently converted to int 10</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">sum</span>(<span class="hljs-number">5</span>, <span class="hljs-string">&#x27;10&#x27;</span>); <span class="hljs-comment">// Output: 15</span>
</code></pre>
<ul>
<li><strong>Advantage:</strong> Flexible; practical because HTML form inputs always arrive as strings</li>
<li><strong>Disadvantage:</strong> Hides type bugs and leads to unpredictable behavior on invalid inputs</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="2-with-strict-typing-strict_types1">2. With Strict Typing (<code>strict_types=1</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">declare</span>(strict_types=<span class="hljs-number">1</span>);

<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">sum</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$a</span>, <span class="hljs-keyword">int</span> <span class="hljs-variable">$b</span></span>): <span class="hljs-title">int</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$a</span> + <span class="hljs-variable">$b</span>;
}

<span class="hljs-comment">// String &#x27;10&#x27; throws a TypeError immediately!</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">sum</span>(<span class="hljs-number">5</span>, <span class="hljs-string">&#x27;10&#x27;</span>); <span class="hljs-comment">// Fatal error: TypeError</span>
</code></pre>
<ul>
<li><strong>Advantage:</strong> Prevents subtle bugs; errors are surfaced immediately during development</li>
<li><strong>Disadvantage:</strong> Less forgiving; form inputs require explicit casting</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-strings-concatenation-vs-interpolation">3. Strings: Concatenation vs. Interpolation</h2>
<p>PHP provides two different techniques to incorporate variables into text:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-concatenation-with-dot">1. Concatenation with Dot (<code>.</code>)</h4>
<ul>
<li>Works with both single and double quotes</li>
<li>Variables are joined manually with dot operators</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage</span> = <span class="hljs-number">73.08</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;&#x27;</span> . <span class="hljs-variable">$student1</span> . <span class="hljs-string">&#x27; achieves &#x27;</span> . 
     <span class="hljs-variable">$percentage</span> . <span class="hljs-string">&#x27; %&lt;/p&gt;&#x27;</span> . <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>
<p><em>Always place spaces around dot operators for maximum readability.</em></p>
</div>
<div class="card">
<h4 id="2-interpolation-with-double-quotes">2. Interpolation with Double Quotes</h4>
<ul>
<li>Variables inside <code>&quot;...&quot;</code> are evaluated and replaced with their current value</li>
<li>No manual breaking and dot joining needed</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$percentage</span> = <span class="hljs-number">64.84</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;<span class="hljs-subst">$student2</span> achieves <span class="hljs-subst">$percentage</span> %&lt;/p&gt;\n&quot;</span>;
</code></pre>
<p><em>Note: String interpolation only works with double quotes, never inside single quotes.</em></p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="3-multi-line-strings-with-heredoc-syntax">3. Multi-line Strings with Heredoc Syntax</h2>
<p>For larger blocks of HTML output, the <strong>Heredoc</strong> syntax is ideal:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$student1</span> = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$percentage1</span> = <span class="hljs-number">73.08</span>;
<span class="hljs-variable">$student2</span> = <span class="hljs-string">&#x27;Jane Smith&#x27;</span>;
<span class="hljs-variable">$percentage2</span> = <span class="hljs-number">64.84</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&lt;&lt;&lt;HTML
&lt;article class=&quot;p-4 bg-slate-800 rounded&quot;&gt;
  &lt;h3&gt;ITF Results&lt;/h3&gt;
  &lt;p&gt;<span class="hljs-subst">$student1</span> achieves <span class="hljs-subst">$percentage1</span> %&lt;/p&gt;
  &lt;p&gt;<span class="hljs-subst">$student2</span> achieves <span class="hljs-subst">$percentage2</span> %&lt;/p&gt;
&lt;/article&gt;
HTML</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="advantages-of-heredoc">Advantages of Heredoc</h4>
<ul>
<li>No tedious quote escaping required</li>
<li>Preserves line breaks (<code>\n</code>) and code indentation</li>
<li>Automatic variable interpolation</li>
<li>Pairs perfectly with Emmet abbreviations in PhpStorm</li>
</ul>
</div>
<div class="card">
<h4 id="syntax-rules">Syntax Rules</h4>
<ul>
<li>Starts with <code>&lt;&lt;&lt;</code> followed by an identifier (e.g. <code>HTML</code> or <code>RESULTS</code>)</li>
<li>Content begins on the next line</li>
<li>Closing identifier sits on its own line, immediately followed by <code>;</code></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-arithmetic-operators">4. Arithmetic Operators</h2>
<p>PHP supports all standard arithmetic calculations:</p>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Description</th>
<th>Example</th>
<th>Result ($x = 10, $y = 3)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>+</code></td>
<td>Addition</td>
<td><code>$x + $y</code></td>
<td><code>13</code></td>
</tr>
<tr>
<td><code>-</code></td>
<td>Subtraction</td>
<td><code>$x - $y</code></td>
<td><code>7</code></td>
</tr>
<tr>
<td><code>*</code></td>
<td>Multiplication</td>
<td><code>$x * $y</code></td>
<td><code>30</code></td>
</tr>
<tr>
<td><code>/</code></td>
<td>Division</td>
<td><code>$x / $y</code></td>
<td><code>3.3333333333333</code></td>
</tr>
<tr>
<td><code>%</code></td>
<td>Modulo (remainder)</td>
<td><code>$x % $y</code></td>
<td><code>1</code></td>
</tr>
<tr>
<td><code>**</code></td>
<td>Exponentiation (PHP 5.6+)</td>
<td><code>$x ** $y</code></td>
<td><code>1000</code> (10³)</td>
</tr>
</tbody>
</table>
<div class="card card-accent">
<h4 id="escaping-the-dollar-sign-in-strings">Escaping the Dollar Sign in Strings</h4>
<p>To display the variable name literally inside a double-quoted string instead of its evaluated value, prepend a backslash before the dollar sign:<br />
<code>echo &quot;&lt;p&gt;\$x + \$y = &quot; . ($x + $y) . &quot;&lt;/p&gt;&quot;;</code> produces: <code>$x + $y = 13</code>.<br />
Always use <strong>parentheses</strong> around arithmetic expressions when concatenating with strings.</p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-assignment-operators--increment">4. Assignment Operators &amp; Increment</h2>
<p>Assignment operators combine an operation with an immediate assignment back to the variable:</p>
<div class="grid-2">
<div class="card">
<h4 id="compound-assignments">Compound Assignments</h4>
<ul>
<li><code>$x += $y</code> is identical to <code>$x = $x + $y</code></li>
<li><code>$x -= $y</code> is identical to <code>$x = $x - $y</code></li>
<li><code>$x *= $y</code> is identical to <code>$x = $x * $y</code></li>
<li><code>$x /= $y</code> is identical to <code>$x = $x / $y</code></li>
<li><code>$x %= $y</code> is identical to <code>$x = $x % $y</code></li>
<li><code>$name .= $surname</code> concatenates strings:<br />
<code>$name = $name . $surname</code></li>
</ul>
</div>
<div class="card">
<h4 id="increment--decrement">Increment &amp; Decrement</h4>
<ul>
<li><code>$x++</code>: Increments the value of <code>$x</code> by 1</li>
<li><code>$x--</code>: Decrements the value of <code>$x</code> by 1</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$score</span> = <span class="hljs-number">10</span>;
<span class="hljs-variable">$score</span> += <span class="hljs-number">5</span>;   <span class="hljs-comment">// $score is now 15</span>
<span class="hljs-variable">$score</span>++;      <span class="hljs-comment">// $score is now 16</span>

<span class="hljs-variable">$title</span> = <span class="hljs-string">&#x27;Web &#x27;</span>;
<span class="hljs-variable">$title</span> .= <span class="hljs-string">&#x27;Dev&#x27;</span>; <span class="hljs-comment">// $title is now &#x27;Web Dev&#x27;</span>
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-comparison-operators-loose-vs-strict-equality">4. Comparison Operators: Loose vs. Strict Equality</h2>
<p>In PHP, the distinction between loose and strict equality is of crucial importance:</p>
<div class="grid-2">
<div class="card">
<h4 id="loose-equality--and">Loose Equality (<code>==</code> and <code>!=</code>)</h4>
<ul>
<li>Converts types automatically before evaluation (type coercion)</li>
<li>Can easily lead to subtle and unexpected bugs</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$x</span> = <span class="hljs-number">10</span>;     <span class="hljs-comment">// integer</span>
<span class="hljs-variable">$y</span> = <span class="hljs-string">&#x27;10&#x27;</span>;   <span class="hljs-comment">// string</span>

<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$x</span> == <span class="hljs-variable">$y</span>); <span class="hljs-comment">// true!</span>
</code></pre>
</div>
<div class="card card-accent">
<h4 id="strict-identity--and">Strict Identity (<code>===</code> and <code>!==</code>)</h4>
<ul>
<li>Compares both the <strong>value</strong> and the underlying <strong>data type</strong></li>
<li><strong>Gold standard</strong> across modern PHP and Laravel codebases</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$x</span> = <span class="hljs-number">10</span>;     <span class="hljs-comment">// integer</span>
<span class="hljs-variable">$y</span> = <span class="hljs-string">&#x27;10&#x27;</span>;   <span class="hljs-comment">// string</span>

<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$x</span> === <span class="hljs-variable">$y</span>); <span class="hljs-comment">// false (int !== string)</span>
</code></pre>
</div>
</div>
<h4 id="additional-comparisons">Additional Comparisons</h4>
<ul>
<li><code>$x &lt; $y</code> (less than), <code>$x &lt;= $y</code> (less than or equal)</li>
<li><code>$x &gt; $y</code> (greater than), <code>$x &gt;= $y</code> (greater than or equal)</li>
<li><code>&lt;&gt;</code> is an older synonym for <code>!=</code></li>
</ul>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="4-booleans--logical-operators">4. Booleans &amp; Logical Operators</h2>
<p>How does PHP render booleans, and which logical operators do we use?</p>
<div class="grid-2">
<div class="card">
<h4 id="boolean-string-output">Boolean String Output</h4>
<p>When PHP casts a boolean value to text:</p>
<ul>
<li><code>true</code> is rendered as <strong><code>1</code></strong></li>
<li><code>false</code> is rendered as <strong><code>&quot;&quot;</code> (an empty string)</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-literal">true</span>;  <span class="hljs-comment">// Outputs: 1</span>
<span class="hljs-keyword">echo</span> <span class="hljs-literal">false</span>; <span class="hljs-comment">// Outputs: (nothing at all!)</span>
</code></pre>
<p><em>Use <code>var_dump()</code> during debugging to inspect genuine booleans.</em></p>
</div>
<div class="card">
<h4 id="logical-operators--precedence">Logical Operators &amp; Precedence</h4>
<ul>
<li><code>&amp;&amp;</code> (AND) and <code>||</code> (OR)</li>
<li><code>!</code> (NOT / negation)</li>
<li><code>xor</code>: true if exactly one operand is true</li>
</ul>
<blockquote>
<p><strong>Important:</strong> PHP also supports <code>and</code> and <code>or</code>, but these have a lower operator precedence. In conditional statements, <strong>always use <code>&amp;&amp;</code> and <code>||</code></strong> to avoid unexpected precedence bugs.</p>
</blockquote>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-control-structures-selection-if-else-elseif">5. Control Structures: Selection (<code>if</code>, <code>else</code>, <code>elseif</code>)</h2>
<p>Conditional statements direct the flow of execution based on logical expressions:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$scorePHP</span> = <span class="hljs-number">9</span>;

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;Congratulations, you passed PHP!&lt;/p&gt;&#x27;</span>;
} <span class="hljs-keyword">elseif</span> (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">8</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;You did not pass, but the score is tolerable.&lt;/p&gt;&#x27;</span>;
} <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;p&gt;Unfortunately not passed. Better luck next time!&lt;/p&gt;&#x27;</span>;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="syntax-details">Syntax Details</h4>
<ul>
<li>The condition is always wrapped in parentheses <code>(...)</code></li>
<li>The code block is enclosed in curly braces <code>{ ... }</code></li>
<li><code>elseif</code> is conventionally written as a single word in PHP</li>
</ul>
</div>
<div class="card">
<h4 id="familiar-from-java--javascript">Familiar from Java / JavaScript</h4>
<p>The structure behaves identically to Java, JavaScript and C#. The primary power in PHP lies in its seamless combination with HTML output.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-the-ternary-operator-span-classbadgefrequent-in-laravel-bladespan">5. The Ternary Operator <span class="badge">Frequent in Laravel Blade</span></h2>
<p>The ternary operator is a powerful shorthand for concise <code>if-else</code> assignments:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Syntax: condition ? exprIfTrue : exprIfFalse</span>
<span class="hljs-variable">$message</span> = <span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span> ? <span class="hljs-string">&#x27;Passed&#x27;</span> : <span class="hljs-string">&#x27;Failed&#x27;</span>;
</code></pre>
<div class="card card-cyan">
<h4 id="direct-integration-in-html-rendering">Direct Integration in HTML Rendering</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p class=&#x27;&quot;</span> . (<span class="hljs-variable">$scorePHP</span> &gt;= <span class="hljs-number">10</span> ? <span class="hljs-string">&#x27;text-green-500&#x27;</span> : <span class="hljs-string">&#x27;text-red-500&#x27;</span>) . <span class="hljs-string">&quot;&#x27;&gt;
        Your result: <span class="hljs-subst">$scorePHP</span>
      &lt;/p&gt;&quot;</span>;
</code></pre>
</div>
<div class="grid-2">
<div class="card">
<h4 id="why-so-crucial-in-laravel">Why So Crucial in Laravel?</h4>
<p>In <strong>Blade views</strong>, you will use this operator constantly for:</p>
<ul>
<li>Highlighting active navigation items: <code>class=&quot;{{ $active ? 'active' : '' }}&quot;</code></li>
<li>Dynamic badges and status pill styling</li>
<li>Form checkbox pre-selection states</li>
</ul>
</div>
<div class="card">
<h4 id="guideline">Guideline</h4>
<p>Use the ternary operator only for <strong>single expressions</strong>. Once multiple actions or nested conditions are involved, a standard <code>if-else</code> remains far more readable.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-null-coalescing-operator--span-classbadgecrucial-for-laravelspan">5. Null Coalescing Operator (<code>??</code>) <span class="badge">Crucial for Laravel</span></h2>
<p>Compact alternative to <code>isset()</code> combined with a fallback assignment:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Traditional approach vs. modern ?? operator</span>
<span class="hljs-variable">$score</span> = <span class="hljs-keyword">isset</span>(<span class="hljs-variable">$scorePHP</span>) ? <span class="hljs-variable">$scorePHP</span> : <span class="hljs-string">&#x27;No score available&#x27;</span>;
<span class="hljs-variable">$score</span> = <span class="hljs-variable">$scorePHP</span> ?? <span class="hljs-string">&#x27;No score available&#x27;</span>;
</code></pre>
<div class="grid-2">
<div class="card card-accent">
<h4 id="why-essential-in-laravel">Why Essential in Laravel?</h4>
<ul>
<li>Request input: <code>$name = $request-&gt;name ?? 'Guest';</code></li>
<li>Configuration and environment fallbacks</li>
<li>Safely rendering optional database relations in Blade</li>
</ul>
</div>
<div class="card">
<h4 id="chaining-fallbacks">Chaining Fallbacks</h4>
<p>Chain multiple fallbacks consecutively:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$display</span> = <span class="hljs-variable">$userNickname</span> ?? <span class="hljs-variable">$userName</span> ?? <span class="hljs-string">&#x27;Anonymous&#x27;</span>;
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-switch-vs-match-expression-php-8">5. <code>switch</code> vs. <code>match</code> Expression (PHP 8)</h2>
<p>PHP 8 introduced <code>match</code>, a significant leap forward compared to the traditional <code>switch</code>:</p>
<div class="grid-2">
<div class="card">
<h4 id="legacy-switch-statement">Legacy <code>switch</code> Statement</h4>
<ul>
<li>Requires <code>break</code> statements to prevent fall-through</li>
<li>Uses loose comparison (<code>==</code>)</li>
<li>Has no direct return value (statement only)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">switch</span> (<span class="hljs-variable">$role</span>) {
    <span class="hljs-keyword">case</span> <span class="hljs-string">&#x27;admin&#x27;</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Red&#x27;</span>;
        <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">case</span> <span class="hljs-string">&#x27;editor&#x27;</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Blue&#x27;</span>;
        <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">default</span>:
        <span class="hljs-variable">$badge</span> = <span class="hljs-string">&#x27;Gray&#x27;</span>;
}
</code></pre>
</div>
<div class="card card-accent">
<h4 id="modern-php-8-match-expression">Modern PHP 8 <code>match</code> Expression</h4>
<ul>
<li>Evaluates directly into an assignable value</li>
<li>Enforces <strong>strict identity (<code>===</code>)</strong></li>
<li>No <code>break</code> needed, concise syntax</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$badge</span> = <span class="hljs-keyword">match</span> (<span class="hljs-variable">$role</span>) {
    <span class="hljs-string">&#x27;admin&#x27;</span>  =&gt; <span class="hljs-string">&#x27;Red&#x27;</span>,
    <span class="hljs-string">&#x27;editor&#x27;</span> =&gt; <span class="hljs-string">&#x27;Blue&#x27;</span>,
    <span class="hljs-keyword">default</span>  =&gt; <span class="hljs-string">&#x27;Gray&#x27;</span>,
};
</code></pre>
<p><em>Throws an <code>UnhandledMatchError</code> if no pattern matches and no <code>default</code> branch is provided.</em></p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-iterations-for-and-while">5. Iterations: <code>for</code> and <code>while</code></h2>
<p>PHP provides standard loop constructs for repeated execution while a condition evaluates to true:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-for-loop-known-number-of-iterations">1. <code>for</code> Loop (Known Number of Iterations)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">5</span>;

<span class="hljs-keyword">for</span> (<span class="hljs-variable">$i</span> = <span class="hljs-number">1</span>; <span class="hljs-variable">$i</span> &lt;= <span class="hljs-variable">$depth</span>; <span class="hljs-variable">$i</span>++) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$i</span> x <span class="hljs-subst">$base</span> = &quot;</span> . (<span class="hljs-variable">$i</span> * <span class="hljs-variable">$base</span>) . <span class="hljs-string">&quot;&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
<ul>
<li>Initialisation: <code>$i = 1</code></li>
<li>Condition check upfront: <code>$i &lt;= $depth</code></li>
<li>Step increment: <code>$i++</code></li>
</ul>
</div>
<div class="card">
<h4 id="2-while-loop-upfront-condition-check">2. <code>while</code> Loop (Upfront Condition Check)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">5</span>;
<span class="hljs-variable">$j</span> = <span class="hljs-number">1</span>;

<span class="hljs-keyword">while</span> (<span class="hljs-variable">$j</span> &lt;= <span class="hljs-variable">$depth</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$j</span> x <span class="hljs-subst">$base</span> = &quot;</span> . (<span class="hljs-variable">$j</span> * <span class="hljs-variable">$base</span>) . <span class="hljs-string">&quot;&lt;/li&gt;\n&quot;</span>;
    <span class="hljs-variable">$j</span>++;
}
</code></pre>
<ul>
<li>Evaluates the condition <strong>before</strong> each iteration</li>
<li>If the condition is immediately <code>false</code>, the body executes 0 times</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="5-iterations-the-crucial-do-while-edge-case">5. Iterations: The Crucial <code>do-while</code> Edge Case</h2>
<p>What happens when the condition evaluates to <code>false</code> right at the start (for example when <code>$depth = 0</code>)?</p>
<div class="grid-2">
<div class="card">
<h4 id="while-condition-checked-upfront"><code>while</code> (Condition Checked UPFRONT)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">0</span>; <span class="hljs-comment">// Depth is 0</span>

<span class="hljs-variable">$j</span> = <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> (<span class="hljs-variable">$j</span> &lt;= <span class="hljs-variable">$depth</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$j</span> x <span class="hljs-subst">$base</span>&lt;/li&gt;&quot;</span>;
    <span class="hljs-variable">$j</span>++;
}
</code></pre>
<ul>
<li><strong>Output:</strong> <em>(zero lines rendered)</em></li>
<li><strong>0 or more times:</strong> Because <code>$j &lt;= 0</code> is immediately <code>false</code>, the loop body is skipped entirely</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="do-while-condition-checked-afterwards"><code>do-while</code> (Condition Checked AFTERWARDS)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$base</span> = <span class="hljs-number">7</span>;
<span class="hljs-variable">$depth</span> = <span class="hljs-number">0</span>; <span class="hljs-comment">// Depth is 0</span>

<span class="hljs-variable">$k</span> = <span class="hljs-number">1</span>;
<span class="hljs-keyword">do</span> {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$k</span> x <span class="hljs-subst">$base</span>&lt;/li&gt;&quot;</span>;
    <span class="hljs-variable">$k</span>++;
} <span class="hljs-keyword">while</span> (<span class="hljs-variable">$k</span> &lt;= <span class="hljs-variable">$depth</span>);
</code></pre>
<ul>
<li><strong>Output:</strong> <code>1 x 7</code> <em>(printed!)</em></li>
<li><strong>1 or more times:</strong> The code block always executes at least once before the evaluation occurs</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-indexed-arrays">6. Indexed Arrays</h2>
<p>Arrays in PHP are dynamic and grow flexibly without fixed capacity limitations:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Recommended syntax with square brackets []</span>
<span class="hljs-variable">$teachers</span> = [<span class="hljs-string">&#x27;Michaël Cloots&#x27;</span>, <span class="hljs-string">&#x27;Jan Janssen&#x27;</span>, <span class="hljs-string">&#x27;Patrick Verhaert&#x27;</span>];

<span class="hljs-comment">// Assign elements individually by numeric index (starts at 0)</span>
<span class="hljs-variable">$students</span>[<span class="hljs-number">0</span>] = <span class="hljs-string">&#x27;John Doe&#x27;</span>;
<span class="hljs-variable">$students</span>[<span class="hljs-number">1</span>] = <span class="hljs-string">&#x27;Jane Doe&#x27;</span>;

<span class="hljs-comment">// Append element to the end of the array (auto-increment index)</span>
<span class="hljs-variable">$teachers</span>[] = <span class="hljs-string">&#x27;New Colleague&#x27;</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="key-properties">Key Properties</h4>
<ul>
<li>Indexed arrays start at index <strong><code>0</code></strong> by default</li>
<li>The index of the final element is <code>count($array) - 1</code></li>
<li><code>count($teachers)</code> returns the total number of elements</li>
</ul>
</div>
<div class="card">
<h4 id="naming-convention">Naming Convention</h4>
<p>Always use a <strong>plural noun</strong> for array variables (<code>$students</code>, <code>$records</code>, <code>$courses</code>), immediately signalling that the variable holds a collection.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-associative-arrays-key-value-pairs">6. Associative Arrays: Key-Value Pairs</h2>
<p>In associative arrays, numeric indexes are replaced by meaningful string keys:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$scoresJane</span> = [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">17</span>, <span class="hljs-string">&#x27;Business essentials&#x27;</span> =&gt; <span class="hljs-number">14</span>, <span class="hljs-string">&#x27;English 2&#x27;</span> =&gt; <span class="hljs-number">10</span>];
<span class="hljs-variable">$scoresJane</span>[<span class="hljs-string">&#x27;PHP&#x27;</span>] = <span class="hljs-number">18</span>; <span class="hljs-comment">// Retrieve or update an individual element</span>
</code></pre>
<div class="card card-accent">
<h4 id="string-interpolation-with-associative-arrays">String Interpolation with Associative Arrays</h4>
<p>Wrap array elements in curly braces <code>{}</code> inside double-quoted strings:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Correct with curly braces {} (or via explicit concatenation .):</span>
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Jane scores for PHP: <span class="hljs-subst">{$scoresJane[&#x27;PHP&#x27;]}</span>&lt;/p&gt;&quot;</span>;
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Jane scores for PHP: &quot;</span> . <span class="hljs-variable">$scoresJane</span>[<span class="hljs-string">&#x27;PHP&#x27;</span>] . <span class="hljs-string">&quot;&lt;/p&gt;&quot;</span>;
</code></pre>
<p><em>Without curly braces, PHP cannot unambiguously parse the array key inside double quotes.</em></p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-multidimensional-arrays">6. Multidimensional Arrays</h2>
<p>A multidimensional array is a nested array where elements are themselves arrays:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$students</span> = [
    [
        <span class="hljs-string">&#x27;name&#x27;</span>   =&gt; <span class="hljs-string">&#x27;John&#x27;</span>,
        <span class="hljs-string">&#x27;scores&#x27;</span> =&gt; [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">13</span>, <span class="hljs-string">&#x27;Business&#x27;</span> =&gt; <span class="hljs-number">8</span>, <span class="hljs-string">&#x27;English&#x27;</span> =&gt; <span class="hljs-number">18</span>]
    ],
    [
        <span class="hljs-string">&#x27;name&#x27;</span>   =&gt; <span class="hljs-string">&#x27;Jane&#x27;</span>,
        <span class="hljs-string">&#x27;scores&#x27;</span> =&gt; [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">17</span>, <span class="hljs-string">&#x27;Business&#x27;</span> =&gt; <span class="hljs-number">14</span>, <span class="hljs-string">&#x27;English&#x27;</span> =&gt; <span class="hljs-number">10</span>]
    ],
];
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="accessing-deep-values">Accessing Deep Values</h4>
<p>Chain consecutive square brackets:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Name of the first student</span>
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$students</span>[<span class="hljs-number">0</span>][<span class="hljs-string">&#x27;name&#x27;</span>]; <span class="hljs-comment">// John</span>

<span class="hljs-comment">// Jane&#x27;s PHP score</span>
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$students</span>[<span class="hljs-number">1</span>][<span class="hljs-string">&#x27;scores&#x27;</span>][<span class="hljs-string">&#x27;PHP&#x27;</span>]; <span class="hljs-comment">// 17</span>
</code></pre>
</div>
<div class="card">
<h4 id="application-in-web-applications">Application in Web Applications</h4>
<p>Nearly all data from database queries, external APIs and JSON responses arrives structured as multidimensional arrays.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-iterating-with-the-foreach-loop">6. Iterating with the <code>foreach</code> Loop</h2>
<p>The <code>foreach</code> loop is the idiomatic standard for traversing arrays and collections in PHP:</p>
<div class="grid-2">
<div class="card">
<h4 id="1-values-only">1. Values Only</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$fruits</span> = [<span class="hljs-string">&#x27;Apple&#x27;</span>, <span class="hljs-string">&#x27;Banana&#x27;</span>, <span class="hljs-string">&#x27;Cherry&#x27;</span>];

<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$fruits</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$fruit</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$fruit</span>&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h4 id="2-index--key-and-value">2. Index / Key and Value</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$scores</span> = [<span class="hljs-string">&#x27;PHP&#x27;</span> =&gt; <span class="hljs-number">16</span>, <span class="hljs-string">&#x27;Java&#x27;</span> =&gt; <span class="hljs-number">14</span>];

<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$scores</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$course</span> =&gt; <span class="hljs-variable">$score</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$course</span>: <span class="hljs-subst">$score</span>&lt;/li&gt;\n&quot;</span>;
}
</code></pre>
</div>
</div>
<h4 id="nested-foreach-for-multidimensional-arrays">Nested <code>foreach</code> for Multidimensional Arrays</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$students</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$student</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;h3&gt;Student: <span class="hljs-subst">{$student[&#x27;name&#x27;]}</span>&lt;/h3&gt;&lt;ul&gt;&quot;</span>;
    <span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$student</span>[<span class="hljs-string">&#x27;scores&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-variable">$course</span> =&gt; <span class="hljs-variable">$score</span>) {
        <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;li&gt;<span class="hljs-subst">$course</span>: <span class="hljs-subst">$score</span>&lt;/li&gt;&quot;</span>;
    }
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;/ul&gt;&quot;</span>;
}
</code></pre>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-objects-stdclass--conversion">6. Objects (<code>stdClass</code>) &amp; Conversion</h2>
<p>Alongside arrays, PHP supports generic objects (<code>stdClass</code>), whose properties are accessed via the <strong>arrow operator (<code>-&gt;</code>)</strong>:</p>
<div class="grid-2">
<div class="card">
<h4 id="conversion-array-to-object">Conversion: Array to Object</h4>
<p>The most robust technique to transform deeply nested arrays into objects is via JSON:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Converts multidimensional array to stdClass objects</span>
<span class="hljs-variable">$studentsObj</span> = <span class="hljs-title function_ invoke__">json_decode</span>(<span class="hljs-title function_ invoke__">json_encode</span>(<span class="hljs-variable">$students</span>));

<span class="hljs-comment">// Access properties via -&gt;</span>
<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$studentsObj</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$student</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;<span class="hljs-subst">$student</span>-&gt;name scores <span class="hljs-subst">{$student-&gt;scores-&gt;PHP}</span>&lt;/p&gt;&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h4 id="importance-of-json_decode-parameters">Importance of <code>json_decode()</code> Parameters</h4>
<ul>
<li><code>json_decode($json)</code> (or with <code>false</code>): Returns a <strong><code>stdClass</code> object</strong> (<code>$obj-&gt;prop</code>)</li>
<li><code>json_decode($json, true)</code>: Returns an <strong>associative array</strong> (<code>$arr['prop']</code>)</li>
</ul>
<p>In Laravel Eloquent, database models almost exclusively operate as objects with arrow notation!</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="6-debugging-var_dump-vs-print_r">6. Debugging: <code>var_dump()</code> vs. <code>print_r()</code></h2>
<p>When data structures do not behave as expected, debugging helper functions are indispensable:</p>
<div class="grid-2">
<div class="card">
<h4 id="var_dumpvariable"><code>var_dump($variable)</code></h4>
<ul>
<li>Displays the <strong>data type</strong>, <strong>length</strong> and <strong>exact value</strong> of each element</li>
<li>Ideal for diagnosing subtle type issues (for example <code>'10'</code> vs <code>10</code>)</li>
</ul>
</div>
<div class="card">
<h4 id="print_rvariable"><code>print_r($variable)</code></h4>
<ul>
<li>Produces a cleaner, more concise overview of arrays and objects</li>
<li>Easier to scan quickly for large collections</li>
</ul>
</div>
</div>
<div class="card card-accent">
<h4 id="tip-preserve-indentation-with-pre-tags">Tip: Preserve Indentation with <code>&lt;pre&gt;</code> Tags</h4>
<p>By default, the browser collapses all whitespace and newlines from debug output into a single line.<br />
Always wrap debug calls in HTML <code>&lt;pre&gt;</code> tags to preserve formatting and tree indentation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;pre&gt;&#x27;</span>;
<span class="hljs-title function_ invoke__">var_dump</span>(<span class="hljs-variable">$students</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-string">&#x27;&lt;/pre&gt;&#x27;</span>;
</code></pre>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-defining-functions--return-types">7. Defining Functions &amp; Return Types</h2>
<p>Functions encapsulate reusable logic. In modern PHP, we explicitly declare return types:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Function without a return value</span>
<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">writeMessage</span>(<span class="hljs-params"></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Welcome to Web Development!&lt;/p&gt;\n&quot;</span>;
}

<span class="hljs-comment">// Function with parameters and an explicit return type</span>
<span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">calculateAverage</span>(<span class="hljs-params"><span class="hljs-keyword">float</span> <span class="hljs-variable">$score1</span>, <span class="hljs-keyword">float</span> <span class="hljs-variable">$score2</span></span>): <span class="hljs-title">float</span> 
</span>{
    <span class="hljs-keyword">return</span> (<span class="hljs-variable">$score1</span> + <span class="hljs-variable">$score2</span>) / <span class="hljs-number">2</span>;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="basic-rules">Basic Rules</h4>
<ul>
<li>Start with the keyword <code>function</code></li>
<li>Use meaningful camelCase names</li>
<li>Use <code>: void</code> when the function intentionally produces no <code>return</code> value</li>
</ul>
</div>
<div class="card">
<h4 id="invocations">Invocations</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-title function_ invoke__">writeMessage</span>();

<span class="hljs-variable">$average</span> = <span class="hljs-title function_ invoke__">calculateAverage</span>(<span class="hljs-number">14.5</span>, <span class="hljs-number">18.0</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Average: <span class="hljs-subst">$average</span>&lt;/p&gt;&quot;</span>;
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-parameters-default-values--references">7. Parameters, Default Values &amp; References</h2>
<p>Functions can be configured with optional default parameters or pass-by-reference arguments:</p>
<div class="grid-2">
<div class="card">
<h4 id="default-parameters-optional">Default Parameters (Optional)</h4>
<p>Parameters with default values do not need to be supplied during invocation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">greet</span>(<span class="hljs-params"><span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span> = <span class="hljs-string">&#x27;Student&#x27;</span></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Hello, <span class="hljs-subst">$name</span>!&lt;/p&gt;&quot;</span>;
}

<span class="hljs-title function_ invoke__">greet</span>(<span class="hljs-string">&#x27;John&#x27;</span>);   <span class="hljs-comment">// Hello, John!</span>
<span class="hljs-title function_ invoke__">greet</span>();         <span class="hljs-comment">// Hello, Student!</span>
</code></pre>
<p><em>Always place optional parameters at the end.</em></p>
</div>
<div class="card">
<h4 id="by-value-vs-by-reference">By Value vs. By Reference (<code>&amp;</code>)</h4>
<ul>
<li><strong>By Value (default):</strong> Operates on an isolated copy; the caller's variable remains unchanged</li>
<li><strong>By Reference (<code>&amp;</code>):</strong> Directly alters the original variable in caller memory</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">applyDiscount</span>(<span class="hljs-params"><span class="hljs-keyword">float</span> &amp;<span class="hljs-variable">$price</span></span>): <span class="hljs-title">void</span> 
</span>{
    <span class="hljs-variable">$price</span> *= <span class="hljs-number">0.8</span>; <span class="hljs-comment">// Modifies $price outside the function!</span>
}

<span class="hljs-variable">$amount</span> = <span class="hljs-number">100.0</span>;
<span class="hljs-title function_ invoke__">applyDiscount</span>(<span class="hljs-variable">$amount</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$amount</span>; <span class="hljs-comment">// 80.0</span>
</code></pre>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-type-hinting-nullable-types-type-span-classbadgecrucial-for-laravelspan">7. Type Hinting: Nullable Types (<code>?type</code>) <span class="badge">Crucial for Laravel</span></h2>
<p>Parameters or return values that accept a specific type or <code>null</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">findUserEmail</span>(<span class="hljs-params">?<span class="hljs-keyword">int</span> <span class="hljs-variable">$userId</span></span>): ?<span class="hljs-title">string</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$userId</span> ? <span class="hljs-string">&quot;user_<span class="hljs-subst">$userId</span>@thomasmore.be&quot;</span> : <span class="hljs-literal">null</span>;
}
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">findUserEmail</span>(<span class="hljs-number">12</span>);   <span class="hljs-comment">// &quot;user_12@thomasmore.be&quot;</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">findUserEmail</span>(<span class="hljs-literal">null</span>); <span class="hljs-comment">// null</span>
</code></pre>
<div class="grid-2">
<div class="card card-accent">
<h4 id="why-essential-in-laravel-1">Why Essential in Laravel?</h4>
<ul>
<li><strong>Eloquent Models:</strong> Optional database attributes (<code>nullable()</code>)</li>
<li><strong>Form Requests:</strong> Non-mandatory input fields</li>
<li>Prevents fatal runtime type errors on <code>null</code></li>
</ul>
</div>
<div class="card">
<h4 id="meaning-of">Meaning of <code>?</code></h4>
<ul>
<li><code>?string</code> is shorthand for <code>string|null</code></li>
<li>Accepts both valid strings and explicit <code>null</code> values</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
