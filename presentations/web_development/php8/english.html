</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-type-hinting-union-types--error-handling">7. Type Hinting: Union Types &amp; Error Handling</h2>
<p>PHP 8 expands the type system with union types and strict runtime error detection:</p>
<div class="grid-2">
<div class="card">
<h4 id="union-types-intfloatstring">Union Types (<code>int|float|string</code>)</h4>
<p>Allows an argument or return value to match multiple explicit types:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">formatScore</span>(<span class="hljs-params"><span class="hljs-keyword">int</span>|<span class="hljs-keyword">float</span> <span class="hljs-variable">$score</span></span>): <span class="hljs-title">string</span> 
</span>{
    <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">number_format</span>(<span class="hljs-variable">$score</span>, <span class="hljs-number">1</span>) . <span class="hljs-string">&#x27; / 20&#x27;</span>;
}

<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-number">14</span>);   <span class="hljs-comment">// &quot;14.0 / 20&quot;</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-number">16.5</span>); <span class="hljs-comment">// &quot;16.5 / 20&quot;</span>
</code></pre>
<ul>
<li>Types are separated by a pipe <code>|</code></li>
<li>Replaces legacy PHPDoc docblock annotations</li>
</ul>
</div>
<div class="card card-cyan">
<h4 id="strict-error-handling-typeerror">Strict Error Handling: <code>TypeError</code></h4>
<p>Passing an invalid type causes PHP to throw a <code>TypeError</code> immediately:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// With strict_types enabled:</span>
<span class="hljs-title function_ invoke__">formatScore</span>(<span class="hljs-string">&#x27;fourteen&#x27;</span>); 
<span class="hljs-comment">// Fatal error: Uncaught TypeError!</span>
</code></pre>
<ul>
<li>Bugs fail fast and visibly during development</li>
<li>Prevents corrupted data from silently reaching the database</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="7-short-arrow-functions-fn--include_once">7. Short Arrow Functions (<code>fn</code>) &amp; <code>include_once</code></h2>
<p>For compact anonymous callbacks, PHP 8 provides concise arrow syntax:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Classic anonymous function</span>
<span class="hljs-variable">$doubleClassic</span> = <span class="hljs-function"><span class="hljs-keyword">function</span>(<span class="hljs-params"><span class="hljs-variable">$n</span></span>) </span>{ <span class="hljs-keyword">return</span> <span class="hljs-variable">$n</span> * <span class="hljs-number">2</span>; };

<span class="hljs-comment">// Modern Short Arrow Function (implicit return of the expression)</span>
<span class="hljs-variable">$double</span> = <span class="hljs-function"><span class="hljs-keyword">fn</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$n</span></span>): <span class="hljs-title">int</span> =&gt;</span> <span class="hljs-variable">$n</span> * <span class="hljs-number">2</span>;

<span class="hljs-variable">$numbers</span> = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>];
<span class="hljs-variable">$multiplied</span> = <span class="hljs-title function_ invoke__">array_map</span>(fn(<span class="hljs-variable">$n</span>) =&gt; <span class="hljs-variable">$n</span> * <span class="hljs-number">10</span>, <span class="hljs-variable">$numbers</span>); <span class="hljs-comment">// [10, 20, 30, 40]</span>
</code></pre>
<div class="card">
<h4 id="splitting-functions-with-include_once">Splitting Functions with <code>include_once</code></h4>
<p>Place reusable helper functions into dedicated files (e.g. <code>shared/functions.php</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">include_once</span> <span class="hljs-string">&#x27;../shared/functions.php&#x27;</span>; <span class="hljs-comment">// Loads the file exactly once</span>
</code></pre>
<p><em>Always use relative paths or <code>$_SERVER['DOCUMENT_ROOT'] . '/shared/...'</code>. In PHP, a path starting with <code>/</code> points to the server system root, not your project directory!</em></p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-forms-html-form-basics">8. Forms: HTML Form Basics</h2>
<p>Forms allow users to transmit input data to the web server:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;post&quot;</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;process.php&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>Name:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;M&quot;</span>&gt;</span> Male<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;F&quot;</span>&gt;</span> Female<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;submit&quot;</span>&gt;</span>Submit<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="core-attributes">Core Attributes</h4>
<ul>
<li><code>action</code>: Target URL where submitted data is routed</li>
<li><code>method</code>: HTTP transmission verb (<code>GET</code> or <code>POST</code>)</li>
<li><code>name</code>: <strong>Crucial:</strong> Sets the array key in PHP!</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="superglobals">Superglobals</h4>
<p>PHP automatically populates a global array:</p>
<ul>
<li><code>method=&quot;get&quot;</code> populates <strong><code>$_GET</code></strong></li>
<li><code>method=&quot;post&quot;</code> populates <strong><code>$_POST</code></strong></li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-form-processing-with-_get">8. Form Processing with <code>$_GET</code></h2>
<p>With <code>GET</code>, all submitted form values are appended visibly to the URL query string:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>https://php8.test/process.php?name=John+Doe&amp;gender=M
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// In the destination file (process.php):</span>
<span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Not specified&#x27;</span>;
<span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Not specified&#x27;</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Welcome, <span class="hljs-subst">$name</span> (Gender: <span class="hljs-subst">$gender</span>)&lt;/p&gt;&quot;</span>;
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="when-to-use-get">When to Use <code>GET</code>?</h4>
<ul>
<li><strong>Search queries and filters:</strong> URLs can be bookmarked or shared</li>
<li><strong>No sensitive data:</strong> Passwords must never appear inside an address bar</li>
<li><strong>Length limits:</strong> Browsers enforce URI length limits (~2048 characters)</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="isset-vs-empty"><code>isset()</code> vs. <code>empty()</code></h4>
<ul>
<li><code>isset($var)</code>: True if the variable exists and is <strong>not null</strong></li>
<li><code>empty($var)</code>: True if the variable is unset, or <code>&quot;&quot;</code>, <code>0</code>, <code>false</code>, <code>null</code> or <code>[]</code></li>
<li><strong>Tip:</strong> An empty input submits an empty string <code>&quot;&quot;</code>. Use <code>empty()</code> to detect blank inputs!</li>
</ul>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-form-processing-with-_post">8. Form Processing with <code>$_POST</code></h2>
<p>With <code>POST</code>, payload data is transmitted invisibly within the HTTP request body:</p>
<div class="grid-2">
<div class="card">
<h4 id="advantages-of-post">Advantages of <code>POST</code></h4>
<ul>
<li><strong>Secure for sensitive data:</strong> Passwords and credentials never appear in history or access logs</li>
<li><strong>No data limit:</strong> Suitable for large text bodies and file uploads</li>
<li>Typically modifies state on the server (create, update, delete)</li>
</ul>
</div>
<div class="card">
<h4 id="inspecting-post-data-in-devtools">Inspecting POST Data in DevTools</h4>
<ol>
<li>Press <code>F12</code> and open the <strong>Network</strong> tab</li>
<li>Submit the form in the browser</li>
<li>Click the request in the log list</li>
<li>In the <strong>Payload</strong> tab, inspect the exact submitted keys and values</li>
</ol>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Reading data from the $_POST superglobal:</span>
<span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Unknown&#x27;</span>;
<span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Not selected&#x27;</span>;
</code></pre>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-single-page-form-concept--flow">8. Single Page Form: Concept &amp; Flow</h2>
<p>Instead of a separate processing file (<code>process.php</code>), we can maintain input and processing within the <strong>same page</strong>:</p>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="how-the-flow-works">How the Flow Works</h4>
<ul>
<li><strong><code>$_SERVER['PHP_SELF']</code></strong>: Always resolves dynamically to the current script URL</li>
<li><strong>First visit (GET):</strong> <code>$_POST</code> is empty (<code>false</code>) -&gt; the empty form is rendered</li>
<li><strong>After submission (POST):</strong> <code>$_POST</code> contains data (<code>true</code>) -&gt; processes input and displays result</li>
</ul>
</div>
<div class="card card-accent">
<h4 id="why-single-page">Why Single Page?</h4>
<ul>
<li><strong>Immediate feedback:</strong> Error warnings or success messages on the exact same page</li>
<li><strong>Preserve state:</strong> User input can be re-populated into form fields upon validation errors</li>
<li><strong>Simplicity:</strong> No need for extra redirection or decoupled processing scripts</li>
</ul>
</div>
</div>
<div class="card">
<h4 id="php-control-mechanism">PHP Control Mechanism</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">if</span> (<span class="hljs-variable">$_POST</span>) {
    <span class="hljs-comment">// Form was submitted: read $_POST and display results or validation errors</span>
} <span class="hljs-keyword">else</span> {
    <span class="hljs-comment">// Fresh visit: render the empty HTML form</span>
}
</code></pre>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="8-single-page-form-implementation">8. Single Page Form: Implementation</h2>
<p>Full implementation structured with a standard <code>if ($_POST) { ... } else { ... }</code> block:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php">&lt;article&gt;
<span class="hljs-meta">&lt;?php</span>
<span class="hljs-keyword">if</span> (<span class="hljs-variable">$_POST</span>) {
    <span class="hljs-variable">$name</span> = !<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>]) ? <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;name&#x27;</span>] : <span class="hljs-string">&#x27;Not filled in&#x27;</span>;
    <span class="hljs-variable">$gender</span> = <span class="hljs-variable">$_POST</span>[<span class="hljs-string">&#x27;gender&#x27;</span>] ?? <span class="hljs-string">&#x27;Not specified&#x27;</span>;
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;Thank you for submitting, &lt;b&gt;<span class="hljs-subst">$name</span>&lt;/b&gt; (<span class="hljs-subst">$gender</span>)!&lt;/p&gt;&quot;</span>;
    <span class="hljs-keyword">echo</span> <span class="hljs-string">&quot;&lt;p&gt;&lt;a href=&#x27;<span class="hljs-subst">{$_SERVER[&#x27;PHP_SELF&#x27;]}</span>&#x27; class=&#x27;btn&#x27;&gt;Submit again&lt;/a&gt;&lt;/p&gt;&quot;</span>;
} <span class="hljs-keyword">else</span> {
<span class="hljs-meta">?&gt;</span>
    &lt;form method=<span class="hljs-string">&quot;post&quot;</span> action=<span class="hljs-string">&quot;&lt;?php echo <span class="hljs-subst">$_SERVER</span>[&#x27;PHP_SELF&#x27;]; ?&gt;&quot;</span>&gt;
      &lt;input type=<span class="hljs-string">&quot;text&quot;</span> name=<span class="hljs-string">&quot;name&quot;</span> placeholder=<span class="hljs-string">&quot;Your name&quot;</span>&gt;
      &lt;button type=<span class="hljs-string">&quot;submit&quot;</span>&gt;Submit&lt;/button&gt;
    &lt;/form&gt;
<span class="hljs-meta">&lt;?php</span>
}
<span class="hljs-meta">?&gt;</span>
&lt;/article&gt;
</code></pre>
<ul>
<li><strong>Reset button:</strong> Linking to <code>$_SERVER['PHP_SELF']</code> triggers a <code>GET</code> request, resetting <code>$_POST</code> to empty and causing the <code>else</code> block to render the form anew.</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-classes-in-php-the-basics-student">9. Classes in PHP: The Basics (<code>Student</code>)</h2>
<p>Object-Oriented Programming (OOP) organises code into classes (blueprints) and objects:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Student</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">getName</span>(<span class="hljs-params"></span>): <span class="hljs-title">string</span> </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;name;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">setName</span>(<span class="hljs-params"><span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span></span>): <span class="hljs-title">void</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;name = <span class="hljs-variable">$name</span>;
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="naming--encapsulation">Naming &amp; Encapsulation</h4>
<ul>
<li>Class names start with a <strong>capital letter</strong> (PascalCase)</li>
<li>File name equals class name: <code>Student.php</code></li>
<li><code>private</code>: properties are accessible only inside the class itself (encapsulation)</li>
</ul>
</div>
<div class="card" style="margin-top: 15px;">
<h4 id="mutators--this">Mutators &amp; <code>$this</code></h4>
<ul>
<li><strong>Getters &amp; Setters:</strong> Provide controlled public access to internal state</li>
<li><strong><code>$this</code></strong>: Refers to the current specific object instance</li>
<li><strong><code>-&gt;</code></strong>: Arrow operator for properties and methods (<code>$this-&gt;name</code>)</li>
</ul>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-namespaces--autoloading">9. Namespaces &amp; Autoloading</h2>
<p>Namespaces prevent name collisions and mirror the directory structure of your application:</p>
<div class="grid-2">
<div class="card">
<h4 id="definition-inside-the-class">Definition Inside the Class</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// File: classes/Student.php</span>
<span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Student</span> 
</span>{
    <span class="hljs-comment">// ...</span>
}
</code></pre>
<ul>
<li>The <code>namespace</code> keyword must always sit as the very first statement</li>
<li><em>Tip: Right-click a folder in PhpStorm -&gt; <strong>New -&gt; PHP Class</strong> fills the namespace automatically!</em></li>
</ul>
</div>
<div class="card">
<h4 id="usage-via-the-use-statement">Usage via the <code>use</code> Statement</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// File: course/test.php</span>
<span class="hljs-keyword">include_once</span> <span class="hljs-string">&#x27;../classes/Student.php&#x27;</span>;

<span class="hljs-keyword">use</span> <span class="hljs-title">classes</span>\<span class="hljs-title">Student</span>;

<span class="hljs-variable">$student</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Student</span>();
<span class="hljs-variable">$student</span>-&gt;<span class="hljs-title function_ invoke__">setName</span>(<span class="hljs-string">&#x27;John Doe&#x27;</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-variable">$student</span>-&gt;<span class="hljs-title function_ invoke__">getName</span>();
</code></pre>
<p>Without <code>use</code>, you would have to write the Fully Qualified Name <code>\classes\Student</code> everywhere.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-constructors--no-overloading-teacher">9. Constructors &amp; No Overloading (<code>Teacher</code>)</h2>
<p>A constructor initializes an object upon instantiation using the <code>new</code> keyword:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>\<span class="hljs-title class_">employees</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Teacher</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span>;

    <span class="hljs-comment">// Parameterized constructor</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$name</span> = <span class="hljs-string">&#x27;&#x27;</span>, 
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$gender</span> = <span class="hljs-string">&#x27;&#x27;</span>
    </span>) </span>{
        <span class="hljs-variable language_">$this</span>-&gt;name = <span class="hljs-variable">$name</span>;
        <span class="hljs-variable language_">$this</span>-&gt;gender = <span class="hljs-variable">$gender</span>;
    }
}
</code></pre>
</div>
<div class="card card-accent">
<h4 id="no-overloading-in-php">No Overloading in PHP</h4>
<p>Unlike Java, PHP <strong>does not support multiple constructors</strong> with different parameter signatures!</p>
<p><strong>The solution:</strong> Assign default values to parameters (<code>= ''</code>). This allows both <code>new Teacher('John', 'M')</code> and <code>new Teacher()</code> to work seamlessly with the same constructor.</p>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-method-chaining-number">9. Method Chaining (<code>Number</code>)</h2>
<p>Method chaining allows us to execute multiple operations in sequence on the same object:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Number</span> 
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$x</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$x</span></span>) </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x = <span class="hljs-variable">$x</span>;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">add</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$y</span></span>): <span class="hljs-title">Number</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x += <span class="hljs-variable">$y</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>; <span class="hljs-comment">// Returns the object instance!</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">multiply</span>(<span class="hljs-params"><span class="hljs-keyword">float</span>|<span class="hljs-keyword">int</span> <span class="hljs-variable">$y</span></span>): <span class="hljs-title">Number</span> </span>{
        <span class="hljs-variable language_">$this</span>-&gt;x *= <span class="hljs-variable">$y</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>; <span class="hljs-comment">// Enables chaining</span>
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="fluent-interface-in-action">Fluent Interface in Action</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-variable">$number</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Number</span>(<span class="hljs-number">10</span>);
<span class="hljs-variable">$number</span>-&gt;<span class="hljs-title function_ invoke__">add</span>(<span class="hljs-number">90</span>)-&gt;<span class="hljs-title function_ invoke__">multiply</span>(<span class="hljs-number">3</span>); 
<span class="hljs-comment">// (10 + 90) * 3 = 300</span>
</code></pre>
<p>Because each method call returns <code>return $this;</code>, subsequent methods can be chained immediately on the returned result.</p>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-static-methods--properties-drawer">9. Static Methods &amp; Properties (<code>Drawer</code>)</h2>
<p>Static members belong to the class definition itself, rather than to an individual instance:</p>
<div class="grid-2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-keyword">namespace</span> <span class="hljs-title class_">classes</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Drawer</span> 
</span>{
    <span class="hljs-keyword">const</span> <span class="hljs-variable constant_">PI</span> = <span class="hljs-number">3.14</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-built_in">static</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$color</span> = <span class="hljs-string">&#x27;blue&#x27;</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-built_in">static</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">circle</span>(<span class="hljs-params">
        <span class="hljs-keyword">int</span> <span class="hljs-variable">$diameter</span> = <span class="hljs-number">100</span>
    </span>): <span class="hljs-title">string</span> </span>{
        <span class="hljs-built_in">self</span>::<span class="hljs-variable">$color</span> = <span class="hljs-string">&#x27;purple&#x27;</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">__CLASS__</span>; <span class="hljs-comment">// Static chaining</span>
    }
}
</code></pre>
</div>
<div>
<div class="card">
<h4 id="scope-resolution-operator">Scope Resolution Operator (<code>::</code>)</h4>
<ul>
<li>Call without <code>new</code>: <code>Drawer::circle(150)</code></li>
<li>Inside the class, <strong><code>self::</code></strong> targets static members and constants</li>
<li><strong><code>$this</code> does not exist</strong> in static context!</li>
</ul>
</div>
<div class="card" style="margin-top: 15px;">
<h4 id="class-constants-const">Class Constants (<code>const</code>)</h4>
<ul>
<li>Declared in <code>UPPERCASE</code>: <code>const PI = 3.14;</code></li>
<li>Accessed via <code>self::PI</code> or <code>Drawer::PI</code></li>
<li>Immutable after declaration</li>
</ul>
</div>
</div>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
<header>ITF | Web Development - PHP 8</header>
<h2 id="9-static-methods-in-practice-the-link-to-laravel">9. Static Methods in Practice: The Link to Laravel</h2>
<p>In Laravel, you will combine fluent method chaining and static calls on a daily basis:</p>
<div class="grid-2">
<div class="card card-cyan">
<h4 id="static-helpers-in-laravel">Static Helpers in Laravel</h4>
<ul>
<li><strong>Dates &amp; Time (Carbon):</strong><br />
<code>Carbon\Carbon::now()-&gt;addDays(7);</code></li>
<li><strong>String manipulation:</strong><br />
<code>Str::upper('thomas more');</code></li>
<li><strong>Array operations:</strong><br />
<code>Arr::first($records);</code></li>
</ul>
</div>
<div class="card card-accent">
<h4 id="query-builder--database">Query Builder &amp; Database</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-php"><span class="hljs-comment">// Static initialization + fluent chaining:</span>
<span class="hljs-variable">$records</span> = DB::<span class="hljs-title function_ invoke__">table</span>(<span class="hljs-string">&#x27;records&#x27;</span>)
    -&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;genre_id&#x27;</span>, <span class="hljs-number">1</span>)
    -&gt;<span class="hljs-title function_ invoke__">orderBy</span>(<span class="hljs-string">&#x27;title&#x27;</span>)
    -&gt;<span class="hljs-title function_ invoke__">get</span>();
</code></pre>
<p><code>DB::table()</code> initializes the query builder, after which fluent chaining (<code>-&gt;where()-&gt;get()</code>) constructs the query.</p>
</div>
</div>
<div class="card">
<h4 id="architectural-guideline">Architectural Guideline</h4>
<p>Use static methods for pure utility functions that require no instance state, and instance methods whenever an object must preserve its own unique internal state.</p>
</div>
<footer>Web Development - Thomas More Hogeschool</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="ITF | Web Development - PHP 8" data-footer="Web Development - Thomas More Hogeschool" data-theme="thomasmore" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:ITF | Web Development - PHP 8;--footer:Web Development - Thomas More Hogeschool;--theme:thomasmore;" data-marpit-pagination-total="49">
