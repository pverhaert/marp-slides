<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250">
  <rect width="460" height="250" rx="12" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="24" y="32" fill="#e6edf3" font-family="monospace" font-size="13" font-weight="700">html { font-size: 16px; }</text>

  <text x="24" y="68" fill="#ff753a" font-family="monospace" font-size="14" font-weight="700">em (compounding when nested)</text>
  <rect x="24" y="78" width="412" height="58" rx="8" fill="#0f141c" stroke="#e84e10" stroke-width="1.5"/>
  <rect x="36" y="90" width="116" height="34" rx="5" fill="#2c3647"/>
  <text x="46" y="112" fill="#e6edf3" font-family="monospace" font-size="12">1.2em = 19px</text>
  <text x="160" y="112" fill="#ff753a" font-family="monospace" font-size="14">-></text>
  <rect x="184" y="90" width="116" height="34" rx="5" fill="#2c3647"/>
  <text x="194" y="112" fill="#e6edf3" font-family="monospace" font-size="12">1.2em = 23px</text>
  <text x="308" y="112" fill="#ff753a" font-family="monospace" font-size="14">-></text>
  <rect x="332" y="90" width="92" height="34" rx="5" fill="#e84e10"/>
  <text x="342" y="112" fill="#ffffff" font-family="monospace" font-size="12">27.6px!</text>

  <text x="24" y="168" fill="#38d9e7" font-family="monospace" font-size="14" font-weight="700">rem (always relative to &lt;html&gt;)</text>
  <rect x="24" y="178" width="412" height="58" rx="8" fill="#0f141c" stroke="#009cab" stroke-width="1.5"/>
  <rect x="36" y="190" width="116" height="34" rx="5" fill="#2c3647"/>
  <text x="44" y="212" fill="#e6edf3" font-family="monospace" font-size="12">1.2rem = 19px</text>
  <text x="160" y="212" fill="#38d9e7" font-family="monospace" font-size="14">=</text>
  <rect x="184" y="190" width="116" height="34" rx="5" fill="#2c3647"/>
  <text x="192" y="212" fill="#e6edf3" font-family="monospace" font-size="12">1.2rem = 19px</text>
  <text x="308" y="212" fill="#38d9e7" font-family="monospace" font-size="14">=</text>
  <rect x="332" y="190" width="92" height="34" rx="5" fill="#009cab"/>
  <text x="344" y="212" fill="#ffffff" font-family="monospace" font-size="12">19.2px</text>
</svg>

