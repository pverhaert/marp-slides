<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">flat vs. preserve-3d</text>

  <!-- flat -->
  <rect x="24" y="54" width="332" height="150" rx="10" fill="#0f141c" stroke="#2c3647"/>
  <text x="40" y="78" fill="#ff753a" font-family="Fira Code, monospace" font-size="12" font-weight="700">transform-style: flat; (default)</text>
  <polygon points="74,108 220,96 206,174 60,186" fill="#2c3647" stroke="#64748b" stroke-width="2"/>
  <rect x="96" y="126" width="76" height="24" rx="4" fill="#e84e10" fill-opacity="0.7"/>
  <text x="134" y="142" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Z flattened</text>
  <text x="236" y="138" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">Children collapse</text>
  <text x="236" y="156" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">onto parent plane</text>

  <!-- preserve-3d -->
  <rect x="24" y="218" width="332" height="184" rx="10" fill="#0f141c" stroke="#009cab"/>
  <text x="40" y="242" fill="#38d9e7" font-family="Fira Code, monospace" font-size="12" font-weight="700">transform-style: preserve-3d;</text>

  <!-- Base card plane -->
  <polygon points="74,284 220,272 206,368 60,380" fill="#181f2a" stroke="#38d9e7" stroke-width="2"/>
  <!-- Floating badge translateZ(40px) -->
  <polygon points="102,262 184,254 178,284 96,292" fill="#e84e10" stroke="#ff753a" stroke-width="2"/>
  <text x="140" y="276" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">Z: +40px</text>
  <!-- Floating button translateZ(30px) -->
  <polygon points="88,322 174,314 168,342 82,350" fill="#009cab" stroke="#38d9e7" stroke-width="2"/>
  <text x="128" y="336" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">Z: +30px</text>

  <text x="236" y="316" fill="#38d9e7" font-family="Outfit, sans-serif" font-size="12" font-weight="700">True 3D layers</text>
  <text x="236" y="334" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">Elements float</text>
  <text x="236" y="352" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">along Z-axis</text>
</svg>

