<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3D Flip Card Anatomy</text>

  <!-- State 1: Rest -->
  <rect x="24" y="54" width="332" height="162" rx="10" fill="#0f141c" stroke="#2c3647"/>
  <text x="40" y="78" fill="#38d9e7" font-family="Fira Code, monospace" font-size="12" font-weight="700">Rest: .card { rotateY(0deg) }</text>

  <!-- Front face visible -->
  <rect x="44" y="96" width="110" height="102" rx="8" fill="#009cab" stroke="#38d9e7" stroke-width="2"/>
  <text x="99" y="138" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">.card-front</text>
  <text x="99" y="158" fill="#e6edf3" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">0deg (visible)</text>

  <!-- Back face hidden -->
  <rect x="182" y="96" width="154" height="102" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="259" y="134" fill="#94a3b8" font-family="Fira Code, monospace" font-size="12" text-anchor="middle">.card-back</text>
  <text x="259" y="154" fill="#94a3b8" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">180deg (hidden)</text>
  <text x="259" y="174" fill="#64748b" font-family="Outfit, sans-serif" font-size="10" text-anchor="middle">backface-visibility: hidden</text>

  <!-- State 2: Hover -->
  <rect x="24" y="232" width="332" height="170" rx="10" fill="#0f141c" stroke="#e84e10"/>
  <text x="40" y="256" fill="#ff753a" font-family="Fira Code, monospace" font-size="12" font-weight="700">:hover: .card { rotateY(180deg) }</text>

  <!-- Front face hidden -->
  <rect x="44" y="276" width="154" height="108" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="121" y="316" fill="#94a3b8" font-family="Fira Code, monospace" font-size="12" text-anchor="middle">.card-front</text>
  <text x="121" y="336" fill="#94a3b8" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">180deg (hidden)</text>
  <text x="121" y="356" fill="#64748b" font-family="Outfit, sans-serif" font-size="10" text-anchor="middle">backface-visibility: hidden</text>

  <!-- Back face visible -->
  <rect x="226" y="276" width="110" height="108" rx="8" fill="#e84e10" stroke="#ff753a" stroke-width="2"/>
  <text x="281" y="320" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">.card-back</text>
  <text x="281" y="340" fill="#ffffff" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">360deg (visible)</text>
</svg>

