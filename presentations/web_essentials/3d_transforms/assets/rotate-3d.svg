<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3D Rotation Functions</text>

  <!-- rotateX -->
  <rect x="24" y="54" width="332" height="108" rx="10" fill="#0f141c" stroke="#2c3647"/>
  <text x="40" y="78" fill="#ff753a" font-family="Fira Code, monospace" font-size="13" font-weight="700">rotateX(40deg)</text>
  <line x1="56" y1="122" x2="178" y2="122" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="74,98 160,98 150,144 84,144" fill="#e84e10" fill-opacity="0.85" stroke="#ff753a" stroke-width="2"/>
  <text x="198" y="118" fill="#e6edf3" font-family="Outfit, sans-serif" font-size="12">Tilts forward / back</text>
  <text x="198" y="136" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="11">around horizontal X-axis</text>

  <!-- rotateY -->
  <rect x="24" y="176" width="332" height="108" rx="10" fill="#0f141c" stroke="#2c3647"/>
  <text x="40" y="200" fill="#38d9e7" font-family="Fira Code, monospace" font-size="13" font-weight="700">rotateY(45deg)</text>
  <line x1="117" y1="210" x2="117" y2="274" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="82,216 152,224 152,262 82,270" fill="#009cab" fill-opacity="0.85" stroke="#38d9e7" stroke-width="2"/>
  <text x="198" y="240" fill="#e6edf3" font-family="Outfit, sans-serif" font-size="12">Turns left / right</text>
  <text x="198" y="258" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="11">around vertical Y-axis</text>

  <!-- rotateZ -->
  <rect x="24" y="298" width="332" height="104" rx="10" fill="#0f141c" stroke="#2c3647"/>
  <text x="40" y="322" fill="#e6edf3" font-family="Fira Code, monospace" font-size="13" font-weight="700">rotateZ(20deg) == rotate(20deg)</text>
  <g transform="rotate(20 117 360)">
    <rect x="82" y="338" width="70" height="44" rx="5" fill="#2c3647" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <circle cx="117" cy="360" r="4" fill="#ff753a"/>
  <text x="198" y="356" fill="#e6edf3" font-family="Outfit, sans-serif" font-size="12">Spins in screen plane</text>
  <text x="198" y="374" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="11">around Z-axis</text>
</svg>

