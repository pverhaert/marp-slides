<h2 id="1-introduction-to-css3">1. Introduction to CSS3</h2>
<h3 id="what-is-css">What is CSS?</h3>
<ul>
<li><strong>Cascading Style Sheets</strong>: the standard style language for the web</li>
<li>Separates <strong>content and structure (HTML)</strong> from <strong>visual presentation (CSS)</strong></li>
<li>Ensures a <strong>consistent design system</strong> across an entire website</li>
</ul>
<h3 id="where-to-write-css">Where to write CSS?</h3>
<ol>
<li><strong>External CSS file</strong> (<code>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;</code>) - <em>Best practice!</em></li>
<li><strong>Embedded CSS</strong> (inside <code>&lt;style&gt;</code> tags in the <code>&lt;head&gt;</code>)</li>
<li><strong>Inline CSS</strong> (via the <code>style=&quot;...&quot;</code> attribute) - <em>Avoid this!</em></li>
</ol>
<blockquote>
<p><strong>W3C Validation:</strong> Always validate your stylesheets using the official <a href="https://jigsaw.w3.org/css-validator/">W3C CSS Validator</a>.</p>
</blockquote>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="1-css-syntax-the-style-rule">1. CSS Syntax: The Style Rule</h2>
<p>A CSS rule consists of a <strong>selector</strong> and a <strong>declaration block</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Selector { Property: Value; } */</span>
<span class="hljs-selector-tag">h2</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#e84e10</span>;
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#181f2a</span>;
  <span class="hljs-attribute">margin-left</span>: <span class="hljs-number">20px</span>;
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;Outfit&#x27;</span>, sans-serif;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="rule-structure">Rule Structure</h4>
<ul>
<li><strong>Selector:</strong> Identifies which HTML elements will be formatted</li>
<li><strong>Declaration:</strong> Property + value pair terminated with a semicolon <code>;</code></li>
</ul>
</div>
<div class="card">
<h4 id="syntax-conventions">Syntax Conventions</h4>
<ul>
<li>Wrap values containing spaces in quotes: <code>&quot;Times New Roman&quot;</code></li>
<li>Group multiple selectors with commas: <code>h1, h2, h3</code></li>
</ul>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="1-the-5-core-selectors">1. The 5 Core Selectors</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Selector Type</th>
<th style="text-align:left">HTML Example</th>
<th style="text-align:left">CSS Notation</th>
<th style="text-align:left">Description</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Tag selector</strong></td>
<td style="text-align:left"><code>&lt;p&gt;Text&lt;/p&gt;</code></td>
<td style="text-align:left"><code>p { color: white; }</code></td>
<td style="text-align:left">Selects all elements of this tag type</td>
</tr>
<tr>
<td style="text-align:left"><strong>Class selector</strong></td>
<td style="text-align:left"><code>&lt;p class=&quot;intro&quot;&gt;</code></td>
<td style="text-align:left"><code>.intro { font-weight: bold; }</code></td>
<td style="text-align:left">Reusable styling across multiple elements</td>
</tr>
<tr>
<td style="text-align:left"><strong>ID selector</strong></td>
<td style="text-align:left"><code>&lt;header id=&quot;main&quot;&gt;</code></td>
<td style="text-align:left"><code>#main { background: #000; }</code></td>
<td style="text-align:left">Unique element on the page</td>
</tr>
<tr>
<td style="text-align:left"><strong>Pseudo-class</strong></td>
<td style="text-align:left"><code>&lt;a href=&quot;...&quot;&gt;</code></td>
<td style="text-align:left"><code>a:hover { color: #ff753a; }</code></td>
<td style="text-align:left">Targets element state or user interaction</td>
</tr>
<tr>
<td style="text-align:left"><strong>Attribute selector</strong></td>
<td style="text-align:left"><code>&lt;a target=&quot;_blank&quot;&gt;</code></td>
<td style="text-align:left"><code>a[target=&quot;_blank&quot;] { ... }</code></td>
<td style="text-align:left">Selects based on HTML attribute values</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Combinations */</span>
<span class="hljs-selector-tag">article</span><span class="hljs-selector-class">.highlight</span> { ... } <span class="hljs-comment">/* Targets only &lt;article&gt; elements with class highlight */</span>
<span class="hljs-selector-tag">article</span> <span class="hljs-selector-class">.highlight</span> { ... } <span class="hljs-comment">/* Targets elements with class highlight INSIDE an &lt;article&gt; */</span>
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="1-cascade-priority--specificity">1. Cascade, Priority &amp; Specificity</h2>
<p>When multiple rules target the same element, the <strong>cascade</strong> decides which rule applies:</p>
<h3 id="priority-order-highest-to-lowest">Priority Order (Highest to Lowest)</h3>
<ol>
<li><strong>Web Developer Inline CSS</strong> (<code>style=&quot;...&quot;</code>)</li>
<li><strong>Web Developer Embedded CSS</strong> (<code>&lt;style&gt;</code>)</li>
<li><strong>Web Developer External CSS</strong> (<code>style.css</code>)</li>
<li><strong>User Browser Settings</strong></li>
<li><strong>Default Browser Stylesheet</strong></li>
</ol>
<h3 id="equal-priority-resolution">Equal Priority Resolution</h3>
<ul>
<li>The <strong>last declared rule</strong> in the stylesheet overrides earlier rules.</li>
<li>More specific selectors (<code>#id</code>) win over general tag selectors (<code>p</code>).</li>
<li><strong><code>!important</code>:</strong> Forces absolute override (use strictly as a last resort!).</li>
</ul>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="1-css-inheritance">1. CSS Inheritance</h2>
<p>Elements inherit select styles from their <strong>ancestor elements</strong> down the DOM tree:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">body</span> {
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;Outfit&#x27;</span>, sans-serif;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#e6edf3</span>;
  <span class="hljs-attribute">line-height</span>: <span class="hljs-number">1.6</span>;
}
<span class="hljs-comment">/* All p, h1, li, span elements automatically inherit font-family and text color! */</span>
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="inherited-properties">Inherited Properties</h4>
<ul>
<li>Typography: <code>font-family</code>, <code>font-size</code>, <code>font-weight</code>, <code>line-height</code></li>
<li>Text styling: <code>color</code>, <code>letter-spacing</code>, <code>text-align</code></li>
<li>Lists: <code>list-style-type</code></li>
</ul>
</div>
<div class="card">
<h4 id="non-inherited-properties">Non-Inherited Properties</h4>
<ul>
<li>Box model: <code>margin</code>, <code>padding</code>, <code>border</code>, <code>width</code>, <code>height</code></li>
<li>Backgrounds: <code>background-color</code>, <code>background-image</code></li>
<li>Positioning: <code>position</code>, <code>display</code>, <code>top</code>, <code>left</code></li>
</ul>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-typography--web-safe-fonts">2. Typography &amp; Web Safe Fonts</h2>
<p>By default, browsers support a limited selection of pre-installed <strong>Web Safe Fonts</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Always specify font fallbacks ending with a generic family */</span>
<span class="hljs-selector-tag">h1</span> {
  <span class="hljs-attribute">font-family</span>: Arial, Helvetica, sans-serif;
}
<span class="hljs-selector-tag">p</span> {
  <span class="hljs-attribute">font-family</span>: Georgia, <span class="hljs-string">&#x27;Times New Roman&#x27;</span>, serif;
}
<span class="hljs-selector-tag">code</span> {
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;Fira Code&#x27;</span>, Consolas, Monaco, monospace;
}
</code></pre>
<h3 id="generic-font-families">Generic Font Families</h3>
<ul>
<li><code>sans-serif</code>: Modern clean fonts without serifs (Arial, Roboto, Outfit)</li>
<li><code>serif</code>: Traditional fonts with decorative serifs (Times, Georgia)</li>
<li><code>monospace</code>: Fixed-width character spacing for code (Fira Code, Courier)</li>
<li><code>cursive</code> &amp; <code>fantasy</code>: Decorative and display scripts</li>
</ul>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-web-fonts-google-fonts--font-face">2. Web Fonts: Google Fonts &amp; <code>@font-face</code></h2>
<h3 id="method-1-google-fonts-import-or-link">Method 1: Google Fonts (<code>@import</code> or <code>&lt;link&gt;</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* At the very top of your external CSS file */</span>
<span class="hljs-keyword">@import</span> url(<span class="hljs-string">&#x27;https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;display=swap&#x27;</span>);

<span class="hljs-selector-tag">body</span> {
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;Outfit&#x27;</span>, sans-serif;
}
</code></pre>
<h3 id="method-2-self-hosted-fonts-via-font-face">Method 2: Self-Hosted Fonts via <code>@font-face</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@font-face</span> {
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;ThomasMoreCustom&#x27;</span>;
  <span class="hljs-attribute">src</span>: <span class="hljs-built_in">url</span>(<span class="hljs-string">&#x27;fonts/custom-font.woff2&#x27;</span>) <span class="hljs-built_in">format</span>(<span class="hljs-string">&#x27;woff2&#x27;</span>),
       <span class="hljs-built_in">url</span>(<span class="hljs-string">&#x27;fonts/custom-font.woff&#x27;</span>) <span class="hljs-built_in">format</span>(<span class="hljs-string">&#x27;woff&#x27;</span>);
  <span class="hljs-attribute">font-weight</span>: <span class="hljs-number">700</span>;
  <span class="hljs-attribute">font-style</span>: normal;
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-essential-text-properties">2. Essential Text Properties</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.article-body</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">1.125rem</span>;          <span class="hljs-comment">/* 18px using relative units */</span>
  <span class="hljs-attribute">font-weight</span>: <span class="hljs-number">600</span>;             <span class="hljs-comment">/* Thickness: 100 to 900 or normal/bold */</span>
  <span class="hljs-attribute">font-style</span>: italic;           <span class="hljs-comment">/* normal | italic | oblique */</span>
  <span class="hljs-attribute">line-height</span>: <span class="hljs-number">1.6</span>;             <span class="hljs-comment">/* Relative unitless line spacing */</span>
  <span class="hljs-attribute">text-align</span>: justify;          <span class="hljs-comment">/* left | right | center | justify */</span>
  <span class="hljs-attribute">text-decoration</span>: none;        <span class="hljs-comment">/* none | underline | line-through */</span>
  <span class="hljs-attribute">text-transform</span>: uppercase;    <span class="hljs-comment">/* uppercase | lowercase | capitalize */</span>
  <span class="hljs-attribute">letter-spacing</span>: <span class="hljs-number">0.05em</span>;       <span class="hljs-comment">/* Spacing between individual letters */</span>
}
</code></pre>
<blockquote>
<p><strong>Accessibility Tip:</strong> Always use relative units (<code>rem</code> or <code>em</code>) for <code>font-size</code> so that typography respects the user's browser accessibility settings!</p>
</blockquote>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-units-px-vs-em-vs-rem-span-classbadgerecommendedspan">2. Units: PX vs EM vs REM <span class="badge">Recommended</span></h2>
<table>
<thead>
<tr>
<th style="text-align:left">Unit</th>
<th style="text-align:left">Type</th>
<th style="text-align:left">Base Reference</th>
<th style="text-align:left">Behavior in Nested Elements</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>px</code> (Pixel)</strong></td>
<td style="text-align:left">Absolute</td>
<td style="text-align:left">Fixed display pixels</td>
<td style="text-align:left">Does <strong>not</strong> scale with browser base font settings</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>em</code></strong></td>
<td style="text-align:left">Relative</td>
<td style="text-align:left"><code>font-size</code> of <strong>immediate parent</strong></td>
<td style="text-align:left"><strong>Compounding:</strong> scales multiplicatively in nested trees</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>rem</code> (Root EM)</strong></td>
<td style="text-align:left">Relative</td>
<td style="text-align:left"><code>font-size</code> of the <strong>root (<code>&lt;html&gt;</code>) element</strong></td>
<td style="text-align:left"><strong>Consistent &amp; predictable</strong> across the entire DOM</td>
</tr>
</tbody>
</table>
<h3 id="why-is-rem-strongly-preferred">Why is <code>rem</code> strongly preferred?</h3>
<ol>
<li><strong>Accessibility (A11y):</strong> If a user adjusts their default browser font size (e.g. from <code>16px</code> to <code>24px</code>), all layout dimensions and text scale proportionally.</li>
<li><strong>No Compounding Bug:</strong> With <code>em</code>, <code>font-size: 1.2em</code> in nested lists compounds exponentially (<code>16px -&gt; 19.2px -&gt; 23px</code>). With <code>rem</code>, <code>1.2rem</code> is always strictly <code>1.2 * root</code>.</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">html</span> { <span class="hljs-attribute">font-size</span>: <span class="hljs-number">16px</span>; }      <span class="hljs-comment">/* Default root: 1rem = 16px */</span>
<span class="hljs-selector-tag">h1</span>   { <span class="hljs-attribute">font-size</span>: <span class="hljs-number">2.25rem</span>; }   <span class="hljs-comment">/* 2.25 * 16px = 36px (predictable &amp; responsive) */</span>
<span class="hljs-selector-tag">p</span>    { <span class="hljs-attribute">font-size</span>: <span class="hljs-number">1rem</span>; }      <span class="hljs-comment">/* 1 * 16px = 16px */</span>
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-color-formats-in-css3">2. Color Formats in CSS3</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Model</th>
<th style="text-align:left">Example</th>
<th style="text-align:left">Description</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Named Color</strong></td>
<td style="text-align:left"><code>color: orange;</code></td>
<td style="text-align:left">140 standard named colors</td>
</tr>
<tr>
<td style="text-align:left"><strong>HEX (Hexadecimal)</strong></td>
<td style="text-align:left"><code>color: #e84e10;</code></td>
<td style="text-align:left">6 characters (RRGGBB) from <code>00</code> to <code>FF</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>RGB</strong></td>
<td style="text-align:left"><code>color: rgb(232, 78, 16);</code></td>
<td style="text-align:left">Red, Green, Blue integers from <code>0</code> to <code>255</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>RGBA (with Alpha)</strong></td>
<td style="text-align:left"><code>color: rgba(232, 78, 16, 0.8);</code></td>
<td style="text-align:left">Includes opacity channel (<code>0.0</code> to <code>1.0</code>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>HSL / HSLA</strong></td>
<td style="text-align:left"><code>color: hsl(17, 88%, 49%);</code></td>
<td style="text-align:left">Hue (0-360 deg), Saturation (%), Lightness (%)</td>
</tr>
</tbody>
</table>
<h3 id="opacity-vs-rgba"><code>opacity</code> vs <code>rgba()</code></h3>
<ul>
<li><code>opacity: 0.5;</code> makes the <strong>entire element including its text and child nodes</strong> translucent.</li>
<li><code>background-color: rgba(...);</code> makes <strong>only the background</strong> translucent, keeping text 100% sharp and readable!</li>
</ul>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="2-interactive-pseudo-classes-for-links">2. Interactive Pseudo-classes for Links</h2>
<p>Always style hyperlink states in the <strong>LVHA order</strong> (Lord Vader Handles All):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 1. Unvisited link */</span>
<span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:link</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#009cab</span>;
  <span class="hljs-attribute">text-decoration</span>: none;
}
<span class="hljs-comment">/* 2. Previously visited link */</span>
<span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:visited</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#8b949e</span>;
}
<span class="hljs-comment">/* 3. Mouse cursor hover */</span>
<span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#ff753a</span>;
  <span class="hljs-attribute">text-decoration</span>: underline;
}
<span class="hljs-comment">/* 4. Active moment of clicking */</span>
<span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:active</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#e84e10</span>;
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="3-the-css-box-model">3. The CSS Box Model</h2>
<p>Every element on a web page is rendered as a rectangular box comprised of <strong>4 layers</strong>:</p>
<div class="card" style="text-align: center; padding: 18px; border: 2px dashed var(--color-accent);">
  <div style="background: rgba(232, 78, 16, 0.2); padding: 14px; border: 1px solid var(--color-accent); border-radius: 4px;">
    <strong>MARGIN</strong> (Outer spacing - transparent)
    <div style="background: rgba(0, 156, 171, 0.25); padding: 12px; margin: 10px; border: 2px solid var(--color-secondary); border-radius: 4px;">
      <strong>BORDER</strong> (Border outline surrounding padding)
      <div style="background: rgba(24, 31, 42, 0.9); padding: 12px; margin: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
        <strong>PADDING</strong> (Inner clearance between content and border)
        <div style="background: #e84e10; color: #fff; padding: 10px; margin: 10px; font-weight: bold; border-radius: 4px;">
          CONTENT (Text, images, media)
        </div>
      </div>
    </div>
  </div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="3-box-sizing-border-box">3. <code>box-sizing: border-box</code></h2>
<p>By default, CSS calculates dimensions via <code>content-box</code> (total width = content + padding + border), causing unexpected layout overflow bugs!</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Universal Box Model Reset */</span>
*, *<span class="hljs-selector-pseudo">::before</span>, *<span class="hljs-selector-pseudo">::after</span> {
  <span class="hljs-attribute">box-sizing</span>: border-box;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="content-box-default"><code>content-box</code> (Default)</h4>
<ul>
<li><code>width: 300px</code> + <code>padding: 20px</code> + <code>border: 5px</code></li>
<li>Total rendered width = <strong>350px</strong>!</li>
</ul>
</div>
<div class="card">
<h4 id="border-box-recommended"><code>border-box</code> (Recommended)</h4>
<ul>
<li><code>width: 300px</code> includes padding and border</li>
<li>Total rendered width remains <strong>exactly 300px</strong>!</li>
</ul>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="3-margin--padding-shorthands">3. Margin &amp; Padding Shorthands</h2>
<p>Clockwise direction order: <strong>Top - Right - Bottom - Left (TRBL)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 4 values: Top, Right, Bottom, Left */</span>
<span class="hljs-attribute">margin</span>: <span class="hljs-number">10px</span> <span class="hljs-number">20px</span> <span class="hljs-number">15px</span> <span class="hljs-number">5px</span>;

<span class="hljs-comment">/* 2 values: [Top &amp; Bottom] [Left &amp; Right] */</span>
<span class="hljs-attribute">padding</span>: <span class="hljs-number">15px</span> <span class="hljs-number">30px</span>;

<span class="hljs-comment">/* 1 value: applies equally to all 4 sides */</span>
<span class="hljs-attribute">margin</span>: <span class="hljs-number">20px</span>;

<span class="hljs-comment">/* Horizontally centering a fixed-width block element */</span>
<span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">960px</span>;
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span> auto; <span class="hljs-comment">/* Top/Bottom: 0, Left/Right: automatic centering */</span>
}
</code></pre>
<blockquote>
<p><strong>Margin Collapsing:</strong> Adjacent vertical margins do not add up; they collapse into the single largest margin value between the two elements.</p>
</blockquote>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="3-borders-radius--box-shadow">3. Borders, Radius &amp; Box Shadow</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.card-box</span> {
  <span class="hljs-comment">/* Border shorthand: width, style, color */</span>
  <span class="hljs-attribute">border</span>: <span class="hljs-number">2px</span> solid <span class="hljs-number">#2c3647</span>;
  <span class="hljs-attribute">border-left</span>: <span class="hljs-number">6px</span> solid <span class="hljs-number">#e84e10</span>; <span class="hljs-comment">/* Override specific side */</span>

  <span class="hljs-comment">/* Rounded corners */</span>
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">8px</span>;           <span class="hljs-comment">/* All 4 corners */</span>
  <span class="hljs-comment">/* border-radius: 50%; -&gt; Transforms a square image into a perfect circle! */</span>

  <span class="hljs-comment">/* Drop shadow: [X-offset] [Y-offset] [Blur] [Spread] [Color] */</span>
  <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">4px</span> <span class="hljs-number">16px</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0.4</span>);
}
</code></pre>
<h3 id="outline-vs-border">Outline vs Border</h3>
<ul>
<li><code>border</code> occupies physical layout space within the box model.</li>
<li><code>outline</code> floats outside the border without shifting surrounding layout elements (essential for accessible <code>:focus</code> keyboard navigation).</li>
</ul>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="4-the-display-property">4. The <code>display</code> Property</h2>
<p>Controls the formatting context and flow behavior of an element:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.block-el</span>   { <span class="hljs-attribute">display</span>: block; }        <span class="hljs-comment">/* &lt;div&gt;, &lt;p&gt;, &lt;h1&gt; */</span>
<span class="hljs-selector-class">.inline-el</span>  { <span class="hljs-attribute">display</span>: inline; }       <span class="hljs-comment">/* &lt;span&gt;, &lt;a&gt;, &lt;strong&gt; */</span>
<span class="hljs-selector-class">.hybrid-el</span>  { <span class="hljs-attribute">display</span>: inline-block; }  <span class="hljs-comment">/* Buttons, tags */</span>
<span class="hljs-selector-class">.hidden-el</span>  { <span class="hljs-attribute">display</span>: none; }          <span class="hljs-comment">/* Completely removed from flow */</span>
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">Property</th>
<th style="text-align:center"><code>block</code></th>
<th style="text-align:center"><code>inline</code></th>
<th style="text-align:center"><code>inline-block</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Starts on new line?</strong></td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">No</td>
</tr>
<tr>
<td style="text-align:left"><strong>Width &amp; Height adjustable?</strong></td>
<td style="text-align:center">Yes</td>
<td style="text-align:center">No</td>
<td style="text-align:center">Yes</td>
</tr>
<tr>
<td style="text-align:left"><strong>Default width:</strong></td>
<td style="text-align:center">100% of parent</td>
<td style="text-align:center">Content width only</td>
<td style="text-align:center">Content width only</td>
</tr>
<tr>
<td style="text-align:left"><strong>Margin &amp; Padding:</strong></td>
<td style="text-align:center">Full 4 sides</td>
<td style="text-align:center">Horizontal only</td>
<td style="text-align:center">Full 4 sides</td>
</tr>
</tbody>
</table>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="4-display-none-vs-visibility-hidden">4. <code>display: none</code> vs <code>visibility: hidden</code></h2>
<div class="grid-2">
<div class="card">
<h4 id="display-none"><code>display: none;</code></h4>
<ul>
<li>Completely removes the element from the document flow</li>
<li>Neighboring elements shift to fill the vacated space</li>
<li>Not visible and occupies <strong>0px space</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.completely-hidden</span> {
  <span class="hljs-attribute">display</span>: none;
}
</code></pre>
</div>
<div class="card">
<h4 id="visibility-hidden"><code>visibility: hidden;</code></h4>
<ul>
<li>Makes the element visually invisible</li>
<li>The element <strong>retains its original dimensions and blank space</strong></li>
<li>Acts as a transparent placeholder</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.invisible-placeholder</span> {
  <span class="hljs-attribute">visibility</span>: hidden;
}
</code></pre>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="4-styling-lists--navigation-bars">4. Styling Lists &amp; Navigation Bars</h2>
<p>HTML lists (<code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code>) are commonly transformed into clean navigation menus:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Horizontal Navigation Bar using &lt;ul&gt; */</span>
<span class="hljs-selector-tag">nav</span> <span class="hljs-selector-tag">ul</span> {
  <span class="hljs-attribute">list-style</span>: none;             <span class="hljs-comment">/* Removes default bullet points */</span>
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span>;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">0</span>;
  <span class="hljs-attribute">display</span>: flex;                <span class="hljs-comment">/* Aligns menu items horizontally */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">24px</span>;
}

<span class="hljs-selector-tag">nav</span> <span class="hljs-selector-tag">li</span> <span class="hljs-selector-tag">a</span> {
  <span class="hljs-attribute">display</span>: block;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">10px</span> <span class="hljs-number">16px</span>;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#ffffff</span>;
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#181f2a</span>;
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">4px</span>;
  <span class="hljs-attribute">text-decoration</span>: none;
  <span class="hljs-attribute">transition</span>: background-color <span class="hljs-number">0.2s</span> ease;
}

<span class="hljs-selector-tag">nav</span> <span class="hljs-selector-tag">li</span> <span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#e84e10</span>;
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="4-styling-tables-with-css">4. Styling Tables with CSS</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">table</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
  <span class="hljs-attribute">border-collapse</span>: collapse;    <span class="hljs-comment">/* Eliminates double borders between cells! */</span>
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">16px</span> <span class="hljs-number">0</span>;
}

<span class="hljs-selector-tag">th</span>, <span class="hljs-selector-tag">td</span> {
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">12px</span> <span class="hljs-number">16px</span>;
  <span class="hljs-attribute">border-bottom</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#2c3647</span>;
  <span class="hljs-attribute">text-align</span>: left;
}

<span class="hljs-selector-tag">th</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#1c2331</span>;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#ff753a</span>;
}

<span class="hljs-comment">/* Zebra striping for enhanced scannability */</span>
<span class="hljs-selector-tag">tbody</span> <span class="hljs-selector-tag">tr</span><span class="hljs-selector-pseudo">:nth-child</span>(even) {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#18202d</span>;
}

<span class="hljs-selector-tag">tbody</span> <span class="hljs-selector-tag">tr</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-built_in">rgba</span>(<span class="hljs-number">232</span>, <span class="hljs-number">78</span>, <span class="hljs-number">16</span>, <span class="hljs-number">0.15</span>); <span class="hljs-comment">/* Subtle row hover highlight */</span>
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="5-background-images-background-image">5. Background Images (<code>background-image</code>)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.hero-banner</span> {
  <span class="hljs-comment">/* Image path */</span>
  <span class="hljs-attribute">background-image</span>: <span class="hljs-built_in">url</span>(<span class="hljs-string">&#x27;images/campus.webp&#x27;</span>);
  
  <span class="hljs-comment">/* Prevent tile repetition */</span>
  <span class="hljs-attribute">background-repeat</span>: no-repeat;
  
  <span class="hljs-comment">/* Alignment and sizing */</span>
  <span class="hljs-attribute">background-position</span>: center center;
  <span class="hljs-attribute">background-size</span>: cover;          <span class="hljs-comment">/* cover: fills viewport | contain: fits whole image */</span>
  
  <span class="hljs-comment">/* Parallax effect: image remains fixed while scrolling */</span>
  <span class="hljs-attribute">background-attachment</span>: fixed;
  
  <span class="hljs-attribute">height</span>: <span class="hljs-number">400px</span>;
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Concise Shorthand Syntax */</span>
<span class="hljs-selector-class">.hero-banner</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-number">#0f141c</span> <span class="hljs-built_in">url</span>(<span class="hljs-string">&#x27;images/campus.webp&#x27;</span>) no-repeat center / cover fixed;
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="5-css-gradients">5. CSS Gradients</h2>
<p>Gradients are rendered mathematically as lightweight, scalable background images:</p>
<div class="grid-2">
<div class="card">
<h4 id="linear-gradient">Linear Gradient</h4>
<p>Color transition along a directional angle:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.linear-box</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-built_in">linear-gradient</span>(
    <span class="hljs-number">135deg</span>, 
    <span class="hljs-number">#e84e10</span> <span class="hljs-number">0%</span>, 
    <span class="hljs-number">#0f141c</span> <span class="hljs-number">100%</span>
  );
}
</code></pre>
</div>
<div class="card">
<h4 id="radial-gradient">Radial Gradient</h4>
<p>Circular color transition radiating from a center point:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.radial-box</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-built_in">radial-gradient</span>(
    circle at center, 
    <span class="hljs-number">#ff753a</span> <span class="hljs-number">0%</span>, 
    <span class="hljs-number">#0f141c</span> <span class="hljs-number">70%</span>
  );
}
</code></pre>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Semi-transparent dark gradient overlay to ensure text contrast over photos */</span>
<span class="hljs-selector-class">.hero-overlay</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-built_in">linear-gradient</span>(<span class="hljs-built_in">rgba</span>(<span class="hljs-number">15</span>, <span class="hljs-number">20</span>, <span class="hljs-number">28</span>, <span class="hljs-number">0.8</span>), <span class="hljs-built_in">rgba</span>(<span class="hljs-number">15</span>, <span class="hljs-number">20</span>, <span class="hljs-number">28</span>, <span class="hljs-number">0.8</span>)), <span class="hljs-built_in">url</span>(<span class="hljs-string">&#x27;photo.webp&#x27;</span>);
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="5-images-object-fit--filters">5. Images: <code>object-fit</code> &amp; Filters</h2>
<h3 id="responsive-images--object-fit">Responsive Images &amp; <code>object-fit</code></h3>
<p>Prevents image distortion when forced into fixed aspect ratio containers:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">img</span><span class="hljs-selector-class">.responsive-cover</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
  <span class="hljs-attribute">height</span>: <span class="hljs-number">250px</span>;
  <span class="hljs-attribute">object-fit</span>: cover;            <span class="hljs-comment">/* Fills container without aspect ratio distortion */</span>
  <span class="hljs-attribute">object-position</span>: center top;   <span class="hljs-comment">/* Anchors focus to top of image */</span>
  <span class="hljs-attribute">display</span>: block;
}
</code></pre>
<h3 id="visual-css-filters">Visual CSS Filters</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">img</span><span class="hljs-selector-class">.filter-demo</span> {
  <span class="hljs-attribute">filter</span>: <span class="hljs-built_in">grayscale</span>(<span class="hljs-number">100%</span>);      <span class="hljs-comment">/* Grayscale effect */</span>
  <span class="hljs-attribute">transition</span>: filter <span class="hljs-number">0.3s</span> ease;
}
<span class="hljs-selector-tag">img</span><span class="hljs-selector-class">.filter-demo</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">filter</span>: <span class="hljs-built_in">grayscale</span>(<span class="hljs-number">0%</span>) <span class="hljs-built_in">brightness</span>(<span class="hljs-number">110%</span>); <span class="hljs-comment">/* Full color + extra brightness on hover */</span>
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="6-floats--the-clearfix-hack">6. Floats &amp; The Clearfix Hack</h2>
<p>Originally designed <strong>only to wrap running text around an image</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">img</span><span class="hljs-selector-class">.float-left</span> {
  <span class="hljs-attribute">float</span>: left;                  <span class="hljs-comment">/* Floats image to the left */</span>
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span> <span class="hljs-number">18px</span> <span class="hljs-number">12px</span> <span class="hljs-number">0</span>;
}

<span class="hljs-comment">/* Problem: parent container collapses to zero height */</span>
<span class="hljs-comment">/* Solution: Modern Clearfix */</span>
<span class="hljs-selector-class">.clearfix</span><span class="hljs-selector-pseudo">::after</span> {
  <span class="hljs-attribute">content</span>: <span class="hljs-string">&quot;&quot;</span>;
  <span class="hljs-attribute">display</span>: block;
  <span class="hljs-attribute">clear</span>: both;                  <span class="hljs-comment">/* Clears both float sides */</span>
}
</code></pre>
<blockquote>
<p><strong>Modern Standard:</strong> Always use <strong>Flexbox</strong> or <strong>CSS Grid</strong> for columns and multi-component layouts, never <code>float</code>!</p>
</blockquote>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="6-css-positioning-position">6. CSS Positioning (<code>position</code>)</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Value</th>
<th style="text-align:left">Document Flow Behavior</th>
<th style="text-align:left">Reference Point for <code>top/left/bottom/right</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>static</code></strong></td>
<td style="text-align:left">Normal flow <em>(default)</em></td>
<td style="text-align:left">None (coordinates have no effect)</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>relative</code></strong></td>
<td style="text-align:left">Keeps original layout slot</td>
<td style="text-align:left">Offset relative to its <strong>original position</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>absolute</code></strong></td>
<td style="text-align:left"><strong>Removed</strong> from flow</td>
<td style="text-align:left">Offset relative to nearest <strong>non-static parent</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>fixed</code></strong></td>
<td style="text-align:left"><strong>Removed</strong> from flow</td>
<td style="text-align:left">Offset relative to the <strong>browser viewport</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>sticky</code></strong></td>
<td style="text-align:left">Hybrid (<code>relative</code> + <code>fixed</code>)</td>
<td style="text-align:left">Scrolls with document until reaching threshold</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Standard Pattern: Relative Parent, Absolute Child */</span>
<span class="hljs-selector-class">.card-container</span> { <span class="hljs-attribute">position</span>: relative; }
<span class="hljs-selector-class">.card-badge</span>     { <span class="hljs-attribute">position</span>: absolute; <span class="hljs-attribute">top</span>: <span class="hljs-number">12px</span>; <span class="hljs-attribute">right</span>: <span class="hljs-number">12px</span>; }
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="6-sticky-headers--z-index">6. Sticky Headers &amp; <code>z-index</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Sticky navigation bar that locks to the top on scroll */</span>
<span class="hljs-selector-tag">header</span><span class="hljs-selector-class">.main-nav</span> {
  <span class="hljs-attribute">position</span>: sticky;
  <span class="hljs-attribute">top</span>: <span class="hljs-number">0</span>;
  <span class="hljs-attribute">z-index</span>: <span class="hljs-number">1000</span>;                <span class="hljs-comment">/* Controls 3D vertical stacking layer */</span>
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#0f141c</span>;
  <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">2px</span> <span class="hljs-number">10px</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0.5</span>);
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="how-z-index-works">How <code>z-index</code> works</h4>
<ul>
<li>Sets which overlapping elements appear in front</li>
<li>Operates <strong>only on positioned elements</strong> (<code>relative</code>, <code>absolute</code>, <code>fixed</code>, <code>sticky</code>)</li>
</ul>
</div>
<div class="card">
<h4 id="stacking-context">Stacking Context</h4>
<ul>
<li>Higher numbers stack in front of lower numbers: <code>z-index: 999;</code></li>
<li>Negative integers place items behind: <code>z-index: -1;</code></li>
</ul>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="6-responsive-design--media-queries">6. Responsive Design &amp; Media Queries</h2>
<p><strong>Responsive Web Design (RWD)</strong> dynamically adapts layouts to different display sizes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- Mandatory viewport meta tag in HTML head --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</span> <span class="hljs-attr">content</span>=<span class="hljs-string">&quot;width=device-width, initial-scale=1.0&quot;</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Mobile-First Base CSS (for smartphones &lt; 768px) */</span>
<span class="hljs-selector-class">.col</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
}

<span class="hljs-comment">/* Tablet &amp; Desktop Breakpoint (from 768px width) */</span>
<span class="hljs-keyword">@media</span> screen <span class="hljs-keyword">and</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">768px</span>) {
  <span class="hljs-selector-class">.col</span> {
    <span class="hljs-attribute">width</span>: <span class="hljs-number">50%</span>;
    <span class="hljs-attribute">float</span>: left;
  }
}

<span class="hljs-comment">/* Large Desktop Screens (from 1200px width) */</span>
<span class="hljs-keyword">@media</span> screen <span class="hljs-keyword">and</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">1200px</span>) {
  <span class="hljs-selector-class">.col</span> {
    <span class="hljs-attribute">width</span>: <span class="hljs-number">25%</span>;
  }
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="7-flexbox-1d-flexible-containers">7. Flexbox: 1D Flexible Containers</h2>
<p>Flexbox is designed for one-dimensional layouts along a single axis (row OR column):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.flex-container</span> {
  <span class="hljs-attribute">display</span>: flex;                <span class="hljs-comment">/* Enables flexbox layout context */</span>
  <span class="hljs-attribute">flex-direction</span>: row;          <span class="hljs-comment">/* row | row-reverse | column | column-reverse */</span>
  <span class="hljs-attribute">flex-wrap</span>: wrap;              <span class="hljs-comment">/* nowrap | wrap (items wrap onto new lines) */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>;                    <span class="hljs-comment">/* Gaps between items without margin hacks */</span>
  
  <span class="hljs-comment">/* Main Axis Alignment (X axis when row) */</span>
  <span class="hljs-attribute">justify-content</span>: space-between; <span class="hljs-comment">/* flex-start | center | flex-end | space-between | space-evenly */</span>
  
  <span class="hljs-comment">/* Cross Axis Alignment (Y axis when row) */</span>
  <span class="hljs-attribute">align-items</span>: center;          <span class="hljs-comment">/* stretch | flex-start | center | flex-end | baseline */</span>
}
</code></pre>
<blockquote>
<p><strong>Classic CSS Trick:</strong> Perfect horizontal and vertical centering in 3 lines:<br />
<code>display: flex; justify-content: center; align-items: center;</code></p>
</blockquote>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="7-flexbox-item-properties">7. Flexbox: Item Properties</h2>
<p>Properties placed directly on the <strong>child items</strong> of a flex container:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.flex-item</span> {
  <span class="hljs-comment">/* flex shorthand: [flex-grow] [flex-shrink] [flex-basis] */</span>
  <span class="hljs-attribute">flex</span>: <span class="hljs-number">1</span> <span class="hljs-number">1</span> <span class="hljs-number">200px</span>;
}
</code></pre>
<div class="grid-2">
<div class="card">
<h4 id="flex-grow--flex-shrink"><code>flex-grow</code> &amp; <code>flex-shrink</code></h4>
<ul>
<li><strong><code>flex-grow: 1</code></strong>: Absorbs proportional remaining space</li>
<li><strong><code>flex-grow: 2</code></strong>: Grows twice as fast as sibling items</li>
<li><strong><code>flex-shrink: 1</code></strong>: Shrinks proportionally when space is limited</li>
</ul>
</div>
<div class="card">
<h4 id="flex-basis--align-self"><code>flex-basis</code> &amp; <code>align-self</code></h4>
<ul>
<li><strong><code>flex-basis: 250px</code></strong>: Initial base width before space distribution</li>
<li><strong><code>align-self: flex-end</code></strong>: Overrides <code>align-items</code> for this individual child</li>
</ul>
</div>
</div>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="7-css-grid--12-column-layouts">7. CSS Grid &amp; 12-Column Layouts</h2>
<p>CSS Grid is designed for two-dimensional layouts across rows AND columns simultaneously:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">12</span>, <span class="hljs-number">1</span>fr); <span class="hljs-comment">/* 12 equal fractional units (1fr) */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>;
}

<span class="hljs-comment">/* Main content spans 8 of the 12 columns (66.6% width) */</span>
<span class="hljs-selector-tag">main</span><span class="hljs-selector-class">.content</span> {
  <span class="hljs-attribute">grid-column</span>: span <span class="hljs-number">8</span>;
}

<span class="hljs-comment">/* Sidebar spans remaining 4 columns (33.3% width) */</span>
<span class="hljs-selector-tag">aside</span><span class="hljs-selector-class">.sidebar</span> {
  <span class="hljs-attribute">grid-column</span>: span <span class="hljs-number">4</span>;
}

<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">768px</span>) {
  <span class="hljs-selector-tag">main</span><span class="hljs-selector-class">.content</span>, <span class="hljs-selector-tag">aside</span><span class="hljs-selector-class">.sidebar</span> {
    <span class="hljs-attribute">grid-column</span>: span <span class="hljs-number">12</span>; <span class="hljs-comment">/* On mobile, both collapse to full 100% width */</span>
  }
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="8-2d-transforms-transform">8. 2D Transforms (<code>transform</code>)</h2>
<p>Modifies element position, scale, and angle without disrupting surrounding layout flow:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box-transform</span> {
  <span class="hljs-comment">/* Translation (shift X, Y) */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translate</span>(<span class="hljs-number">20px</span>, -<span class="hljs-number">10px</span>);
  
  <span class="hljs-comment">/* Rotation */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotate</span>(<span class="hljs-number">15deg</span>);
  
  <span class="hljs-comment">/* Scaling (resize) */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">1.1</span>);
  
  <span class="hljs-comment">/* Skew (distortion) */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">skew</span>(<span class="hljs-number">5deg</span>, <span class="hljs-number">5deg</span>);
  
  <span class="hljs-comment">/* Combining multiple transformations */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translate</span>(-<span class="hljs-number">50%</span>, -<span class="hljs-number">50%</span>) <span class="hljs-built_in">rotate</span>(-<span class="hljs-number">5deg</span>) <span class="hljs-built_in">scale</span>(<span class="hljs-number">1.05</span>);
  
  <span class="hljs-comment">/* Set transformation anchor origin point */</span>
  <span class="hljs-attribute">transform-origin</span>: center center;
}
</code></pre>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="8-css-transitions">8. CSS Transitions</h2>
<p>Creates smooth, interpolated animations between two CSS states (such as <code>:hover</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.interactive-btn</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#181f2a</span>;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#ffffff</span>;
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateY</span>(<span class="hljs-number">0</span>);
  
  <span class="hljs-comment">/* Transition shorthand: [property] [duration] [timing-function] [delay] */</span>
  <span class="hljs-attribute">transition</span>: all <span class="hljs-number">0.3s</span> ease;
  <span class="hljs-comment">/* transition: transform 0.2s ease-out, background-color 0.3s linear; */</span>
}

<span class="hljs-selector-class">.interactive-btn</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#e84e10</span>;
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateY</span>(-<span class="hljs-number">4px</span>);   <span class="hljs-comment">/* Button subtly floats upward */</span>
  <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">6px</span> <span class="hljs-number">20px</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">232</span>, <span class="hljs-number">78</span>, <span class="hljs-number">16</span>, <span class="hljs-number">0.4</span>);
}
</code></pre>
<h3 id="timing-functions">Timing Functions</h3>
<ul>
<li><code>ease</code> (default: smooth start and stop) | <code>linear</code> (constant speed)</li>
<li><code>ease-in</code> (slow acceleration) | <code>ease-out</code> (gentle deceleration) | <code>cubic-bezier(...)</code></li>
</ul>
<footer>Web Essentials - Thomas More University of Applied Sciences</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="ITF | Web Essentials - CSS3" data-footer="Web Essentials - Thomas More University of Applied Sciences" data-theme="thomasmore" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:ITF | Web Essentials - CSS3;--footer:Web Essentials - Thomas More University of Applied Sciences;--theme:thomasmore;" data-marpit-pagination-total="36">
<header>ITF | Web Essentials - CSS3</header>
<h2 id="8-css-keyframe-animations-keyframes">8. CSS Keyframe Animations (<code>@keyframes</code>)</h2>
<p>Build multi-step, self-running animations without JavaScript:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 1. Define animation milestones */</span>
<span class="hljs-keyword">@keyframes</span> pulseGlow {
  <span class="hljs-number">0%</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">1</span>);
    <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">0</span> <span class="hljs-number">0</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">232</span>, <span class="hljs-number">78</span>, <span class="hljs-number">16</span>, <span class="hljs-number">0.4</span>);
  }
  <span class="hljs-number">50%</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">1.05</span>);
    <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">0</span> <span class="hljs-number">20px</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">232</span>, <span class="hljs-number">78</span>, <span class="hljs-number">16</span>, <span class="hljs-number">0.8</span>);
  }
  <span class="hljs-number">100%</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">1</span>);

<h2 id="8-3d-transforms--card-flip">8. 3D Transforms &amp; Card Flip</h2>
<p>Establishing <code>perspective</code> on a parent element unlocks a 3D coordinate space (Z-axis):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.flip-card-container</span> {
  <span class="hljs-attribute">perspective</span>: <span class="hljs-number">1000px</span>;          <span class="hljs-comment">/* 3D depth perception in pixels */</span>
}

<span class="hljs-selector-class">.flip-card-inner</span> {
  <span class="hljs-attribute">position</span>: relative;
  <span class="hljs-attribute">width</span>: <span class="hljs-number">300px</span>;
  <span class="hljs-attribute">height</span>: <span class="hljs-number">200px</span>;
  <span class="hljs-attribute">transform-style</span>: preserve-<span class="hljs-number">3</span>d; <span class="hljs-comment">/* Preserves 3D depth for child faces */</span>
  <span class="hljs-attribute">transition</span>: transform <span class="hljs-number">0.6s</span> ease;
}

<span class="hljs-selector-class">.flip-card-container</span><span class="hljs-selector-pseudo">:hover</span> <span class="hljs-selector-class">.flip-card-inner</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotateY</span>(<span class="hljs-number">180deg</span>);    <span class="hljs-comment">/* Flips 180 degrees around the Y axis */</span>
}

<span class="hljs-selector-class">.card-front</span>, <span class="hljs-selector-class">.card-back</span> {
  <span class="hljs-attribute">position</span>: absolute;
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
  <span class="hljs-attribute">height</span>: <span class="hljs-number">100%</span>;
  <span class="hljs-attribute">backface-visibility</span>: hidden;  <span class="hljs-comment">/* Hides rear face when rotated away! */</span>
}

<span class="hljs-selector-class">.card-back</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotateY</span>(<span class="hljs-number">180deg</span>);
}

<p class="subtitle">&lt;From Clean Structure to Engaging Interactive UI /&gt;</p>
<h3 id="key-takeaways">Key Takeaways</h3>
<ol>
<li>Always apply a <strong>Universal Box Model Reset</strong> (<code>box-sizing: border-box</code>)</li>

<li>Use relative units (<code>rem</code>, <code>em</code>, <code>%</code>, <code>fr</code>) for flexible scaling</li>
<li>Enhance user interaction with subtle <strong>transitions &amp; transforms</strong></li>
</ol>
