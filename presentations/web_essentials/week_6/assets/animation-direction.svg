<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">animation-direction (2 cycles)</text>

  <!-- normal -->
  <rect x="22" y="52" width="336" height="76" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="36" y="74" fill="#38d9e7" font-family="Fira Code, monospace" font-size="13" font-weight="700">normal</text>
  <line x1="48" y1="102" x2="176" y2="102" stroke="#38d9e7" stroke-width="3"/>
  <polygon points="178,102 168,97 168,107" fill="#38d9e7"/>
  <text x="112" y="94" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <line x1="196" y1="102" x2="324" y2="102" stroke="#38d9e7" stroke-width="3"/>
  <polygon points="326,102 316,97 316,107" fill="#38d9e7"/>
  <text x="260" y="94" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>

  <!-- reverse -->
  <rect x="22" y="140" width="336" height="76" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="36" y="162" fill="#ff753a" font-family="Fira Code, monospace" font-size="13" font-weight="700">reverse</text>
  <line x1="178" y1="190" x2="50" y2="190" stroke="#ff753a" stroke-width="3"/>
  <polygon points="48,190 58,185 58,195" fill="#ff753a"/>
  <text x="112" y="182" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">100% -> 0%</text>
  <line x1="326" y1="190" x2="198" y2="190" stroke="#ff753a" stroke-width="3"/>
  <polygon points="196,190 206,185 206,195" fill="#ff753a"/>
  <text x="260" y="182" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">100% -> 0%</text>

  <!-- alternate -->
  <rect x="22" y="228" width="336" height="76" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="36" y="250" fill="#38d9e7" font-family="Fira Code, monospace" font-size="13" font-weight="700">alternate</text>
  <line x1="48" y1="278" x2="176" y2="278" stroke="#38d9e7" stroke-width="3"/>
  <polygon points="178,278 168,273 168,283" fill="#38d9e7"/>
  <text x="112" y="270" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <line x1="326" y1="278" x2="198" y2="278" stroke="#ff753a" stroke-width="3"/>
  <polygon points="196,278 206,273 206,283" fill="#ff753a"/>
  <text x="260" y="270" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">100% -> 0%</text>

  <!-- alternate-reverse -->
  <rect x="22" y="316" width="336" height="82" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="36" y="338" fill="#ff753a" font-family="Fira Code, monospace" font-size="13" font-weight="700">alternate-reverse</text>
  <line x1="178" y1="368" x2="50" y2="368" stroke="#ff753a" stroke-width="3"/>
  <polygon points="48,368 58,363 58,373" fill="#ff753a"/>
  <text x="112" y="360" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">100% -> 0%</text>
  <line x1="196" y1="368" x2="324" y2="368" stroke="#38d9e7" stroke-width="3"/>
  <polygon points="326,368 316,363 316,373" fill="#38d9e7"/>
  <text x="260" y="360" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
</svg>

