<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>

  <!-- Card 1: translate -->
  <rect x="20" y="20" width="290" height="150" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="165" y="44" fill="#38d9e7" font-family="Fira Code, monospace" font-size="13" font-weight="700" text-anchor="middle">translate(28px, -16px)</text>
  <rect x="95" y="72" width="90" height="60" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="123" y="56" width="90" height="60" rx="6" fill="#009cab" fill-opacity="0.88" stroke="#38d9e7" stroke-width="2"/>
  <text x="168" y="91" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">X +28, Y -16</text>

  <!-- Card 2: scale -->
  <rect x="330" y="20" width="290" height="150" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="475" y="44" fill="#ff753a" font-family="Fira Code, monospace" font-size="13" font-weight="700" text-anchor="middle">scale(1.25) / scale(0.75)</text>
  <rect x="360" y="64" width="96" height="68" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="348" y="56" width="120" height="84" rx="6" fill="#e84e10" fill-opacity="0.45" stroke="#ff753a" stroke-width="2"/>
  <text x="408" y="103" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">1.25</text>
  <rect x="496" y="64" width="96" height="68" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="508" y="73" width="72" height="50" rx="6" fill="#e84e10" fill-opacity="0.88" stroke="#ff753a" stroke-width="2"/>
  <text x="544" y="103" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">0.75</text>

  <!-- Card 3: rotate -->
  <rect x="20" y="190" width="290" height="150" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="165" y="214" fill="#38d9e7" font-family="Fira Code, monospace" font-size="13" font-weight="700" text-anchor="middle">rotate(18deg)</text>
  <rect x="110" y="242" width="110" height="66" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g transform="rotate(18 165 275)">
    <rect x="110" y="242" width="110" height="66" rx="6" fill="#009cab" fill-opacity="0.88" stroke="#38d9e7" stroke-width="2"/>
    <text x="165" y="280" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">+18deg</text>
  </g>
  <circle cx="165" cy="275" r="4" fill="#ff753a"/>

  <!-- Card 4: skewX -->
  <rect x="330" y="190" width="290" height="150" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="475" y="214" fill="#ff753a" font-family="Fira Code, monospace" font-size="13" font-weight="700" text-anchor="middle">skewX(-18deg)</text>
  <rect x="420" y="242" width="110" height="66" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g transform="translate(475 275) skewX(-18) translate(-475 -275)">
    <rect x="420" y="242" width="110" height="66" rx="6" fill="#e84e10" fill-opacity="0.88" stroke="#ff753a" stroke-width="2"/>
    <text x="475" y="280" fill="#ffffff" font-family="Fira Code, monospace" font-size="12" font-weight="700" text-anchor="middle">skewX(-18deg)</text>
  </g>
</svg>

