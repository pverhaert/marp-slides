<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">animation-fill-mode Timeline</text>

  <!-- Column headers -->
  <text x="155" y="64" fill="#94a3b8" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">Delay</text>
  <text x="235" y="64" fill="#ffffff" font-family="Fira Code, monospace" font-size="11" font-weight="700" text-anchor="middle">0% -> 100%</text>
  <text x="318" y="64" fill="#94a3b8" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">After</text>

  <!-- none -->
  <rect x="20" y="80" width="340" height="68" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="34" y="119" fill="#e6edf3" font-family="Fira Code, monospace" font-size="12" font-weight="700">none</text>
  <rect x="122" y="98" width="66" height="32" rx="5" fill="#2c3647"/>
  <text x="155" y="118" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">CSS</text>
  <rect x="196" y="98" width="78" height="32" rx="5" fill="#009cab"/>
  <text x="235" y="118" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <rect x="282" y="98" width="66" height="32" rx="5" fill="#2c3647"/>
  <text x="315" y="118" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">CSS</text>

  <!-- forwards -->
  <rect x="20" y="162" width="340" height="68" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="34" y="201" fill="#38d9e7" font-family="Fira Code, monospace" font-size="12" font-weight="700">forwards</text>
  <rect x="122" y="180" width="66" height="32" rx="5" fill="#2c3647"/>
  <text x="155" y="200" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">CSS</text>
  <rect x="196" y="180" width="78" height="32" rx="5" fill="#009cab"/>
  <text x="235" y="200" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <rect x="282" y="180" width="66" height="32" rx="5" fill="#e84e10"/>
  <text x="315" y="200" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">100%</text>

  <!-- backwards -->
  <rect x="20" y="244" width="340" height="68" rx="8" fill="#0f141c" stroke="#2c3647"/>
  <text x="34" y="283" fill="#ff753a" font-family="Fira Code, monospace" font-size="12" font-weight="700">backwards</text>
  <rect x="122" y="262" width="66" height="32" rx="5" fill="#e84e10"/>
  <text x="155" y="282" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">0%</text>
  <rect x="196" y="262" width="78" height="32" rx="5" fill="#009cab"/>
  <text x="235" y="282" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <rect x="282" y="262" width="66" height="32" rx="5" fill="#2c3647"/>
  <text x="315" y="282" fill="#94a3b8" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">CSS</text>

  <!-- both -->
  <rect x="20" y="326" width="340" height="68" rx="8" fill="#0f141c" stroke="#38d9e7"/>
  <text x="34" y="365" fill="#38d9e7" font-family="Fira Code, monospace" font-size="12" font-weight="700">both</text>
  <rect x="122" y="344" width="66" height="32" rx="5" fill="#e84e10"/>
  <text x="155" y="364" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">0%</text>
  <rect x="196" y="344" width="78" height="32" rx="5" fill="#009cab"/>
  <text x="235" y="364" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">0% -> 100%</text>
  <rect x="282" y="344" width="66" height="32" rx="5" fill="#e84e10"/>
  <text x="315" y="364" fill="#ffffff" font-family="Fira Code, monospace" font-size="10" font-weight="700" text-anchor="middle">100%</text>
</svg>

