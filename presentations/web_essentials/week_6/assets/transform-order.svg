<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420">
  <rect width="380" height="420" rx="14" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="190" y="34" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Order Matters: Left to Right</text>

  <!-- Case 1: rotate first, then translateX -->
  <rect x="20" y="52" width="340" height="170" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="34" y="76" fill="#ff753a" font-family="Fira Code, monospace" font-size="12" font-weight="700">rotate(45deg) translateX(70px)</text>
  <!-- ghost -->
  <rect x="52" y="106" width="54" height="36" rx="5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- diagonal axis -->
  <line x1="79" y1="124" x2="150" y2="195" stroke="#ff753a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(79 124) rotate(45) translate(70 0) translate(-27 -18)">
    <rect x="0" y="0" width="54" height="36" rx="5" fill="#e84e10" stroke="#ff753a" stroke-width="2"/>
    <text x="27" y="22" fill="#ffffff" font-family="Fira Code, monospace" font-size="11" font-weight="700" text-anchor="middle">Box</text>
  </g>
  <text x="195" y="128" fill="#e6edf3" font-family="Outfit, sans-serif" font-size="12">1. Rotates axis 45deg</text>
  <text x="195" y="148" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">2. Moves diagonally</text>

  <!-- Case 2: translateX first, then rotate -->
  <rect x="20" y="236" width="340" height="166" rx="10" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <text x="34" y="260" fill="#38d9e7" font-family="Fira Code, monospace" font-size="12" font-weight="700">translateX(70px) rotate(45deg)</text>
  <!-- ghost -->
  <rect x="52" y="298" width="54" height="36" rx="5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- horizontal axis -->
  <line x1="79" y1="316" x2="149" y2="316" stroke="#38d9e7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(149 316) rotate(45) translate(-27 -18)">
    <rect x="0" y="0" width="54" height="36" rx="5" fill="#009cab" stroke="#38d9e7" stroke-width="2"/>
    <text x="27" y="22" fill="#ffffff" font-family="Fira Code, monospace" font-size="11" font-weight="700" text-anchor="middle">Box</text>
  </g>
  <text x="205" y="308" fill="#e6edf3" font-family="Outfit, sans-serif" font-size="12">1. Moves 70px right</text>
  <text x="205" y="328" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="12">2. Rotates in place</text>
</svg>

