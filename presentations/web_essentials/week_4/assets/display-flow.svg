<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <rect width="460" height="320" rx="12" fill="#181f2a" stroke="#2c3647" stroke-width="2"/>
  <text x="24" y="34" fill="#ff753a" font-family="monospace" font-size="15" font-weight="700">display: block (100% width)</text>
  <rect x="24" y="44" width="412" height="28" rx="6" fill="#e84e10"/>
  <text x="38" y="63" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">Block A (width: 100%)</text>
  <rect x="24" y="78" width="412" height="28" rx="6" fill="#e84e10" fill-opacity="0.75"/>
  <text x="38" y="97" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">Block B (new line)</text>

  <text x="24" y="138" fill="#38d9e7" font-family="monospace" font-size="15" font-weight="700">display: inline (content only)</text>
  <rect x="24" y="150" width="412" height="44" rx="6" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <rect x="34" y="160" width="96" height="24" rx="4" fill="#009cab"/>
  <text x="44" y="177" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">Inline A</text>
  <rect x="138" y="160" width="96" height="24" rx="4" fill="#009cab" fill-opacity="0.8"/>
  <text x="148" y="177" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">Inline B</text>
  <text x="246" y="177" fill="#8b949e" font-family="monospace" font-size="12">no width/height</text>

  <text x="24" y="226" fill="#ff753a" font-family="monospace" font-size="15" font-weight="700">display: inline-block (w + h + row)</text>
  <rect x="24" y="238" width="412" height="62" rx="6" fill="#0f141c" stroke="#2c3647" stroke-width="1.5"/>
  <rect x="36" y="248" width="120" height="42" rx="6" fill="#e84e10"/>
  <text x="50" y="274" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">120 x 42px</text>
  <rect x="168" y="248" width="120" height="42" rx="6" fill="#009cab"/>
  <text x="182" y="274" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">120 x 42px</text>
  <rect x="300" y="248" width="120" height="42" rx="6" fill="#2c3647" stroke="#ff753a" stroke-width="1.5"/>
  <text x="314" y="274" fill="#e6edf3" font-family="monospace" font-size="12" font-weight="700">120 x 42px</text>
</svg>

