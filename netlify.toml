[build]
  publish = "dist"
  command = "npm run build"

# Backwards compatibility: redirect any legacy /presentations/ links to root
[[redirects]]
  from = "/presentations/*"
  to = "/:splat"
  status = 301

# Clean short URLs
[[redirects]]
  from = "/basic_html"
  to = "/web_essentials/basic_html/dutch.html"
  status = 200

[[redirects]]
  from = "/basic_html_en"
  to = "/web_essentials/basic_html/english.html"
  status = 200

