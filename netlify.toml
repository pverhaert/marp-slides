[build]
  publish = "dist"
  command = "npm run build"

# Redirect root to presentations dashboard
[[redirects]]
  from = "/"
  to = "/presentations/"
  status = 301

# Clean short URLs redirects to presentations/
[[redirects]]
  from = "/basic_html"
  to = "/presentations/web_essentials/basic_html/dutch.html"
  status = 200

[[redirects]]
  from = "/basic_html_en"
  to = "/presentations/web_essentials/basic_html/english.html"
  status = 200

