[build]
  publish = "dist"
  command = "npm run build"

# Backwards compatibility: redirect any legacy /presentations/ links to root
[[redirects]]
  from = "/presentations/*"
  to = "/:splat"
  status = 301

# Clean short URLs
[[redirects]]
  from = "/week_1"
  to = "/web_essentials/week_1/dutch.html"
  status = 200

[[redirects]]
